<body class="bg-slate-100 text-slate-800 antialiased">

  <!-- TELA DE AUTENTICAÇÃO -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-navy-950 via-navy-900 to-navy-800">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
      <div id="login-logo-box" class="mb-6"></div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Usuário</label>
          <input id="login-username" type="text" required autocomplete="username" placeholder="Digite seu usuário" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-navy-800" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Senha</label>
          <input id="login-password" type="password" required autocomplete="current-password" placeholder="Digite sua senha" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-navy-800" />
        </div>
        <div class="flex items-center justify-between text-xs">
          <label class="inline-flex items-center gap-2 text-slate-600 cursor-pointer">
            <input id="login-remember" type="checkbox" checked class="rounded border-slate-300" />
            <span>Manter sessão ativa neste navegador</span>
          </label>
        </div>
        <div id="login-error" class="hidden text-xs font-bold text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2"></div>
        <button type="submit" class="w-full py-3 rounded-xl bg-accent-500 hover:bg-accent-600 text-white font-extrabold text-sm shadow-md transition cursor-pointer">
          Entrar no CONTECH ERP
        </button>
      </form>
      <p class="text-[11px] text-center text-slate-400 mt-6">CONTECH Contabilidade &amp; Informática • Itaporanga - PB</p>
    </div>
  </div>

        <div id="sidebar-sync-badge" class="text-emerald-400 font-semibold mt-0.5">Armazenamento Local Ativo</div>

      <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 flex items-center justify-between gap-3 sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <button type="button" onclick="toggleSidebar()" class="px-3 py-1.5 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-xs font-bold cursor-pointer">
            <span id="toggle-sidebar-label">Esconder Menu</span>
          </button>
          <span class="hidden md:inline text-xs font-semibold text-slate-500">CONTECH Contabilidade &amp; Informática</span>
        </div>
        <div class="flex items-center gap-3">

        </div>

    </div>

    function generateId(prefix = 'ID') {
      return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.floor(100 + Math.random() * 900)}`;
    }

    function addDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function addMonthsISO(isoDate, monthsToAdd) {
      const [y, m, d] = (isoDate || new Date().toISOString().slice(0, 10)).split('-').map(Number);
      const dt = new Date(y, m - 1 + monthsToAdd, d);
      return dt.toISOString().slice(0, 10);
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')

    function formatDateBR(iso) {
      if (!iso) return '—';
      const parts = String(iso).slice(0, 10).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : iso;
    }

    function daysUntil(iso) {
      if (!iso) return null;
      const target = new Date(`${String(iso).slice(0, 10)}T00:00:00`);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    function downloadCSV(filename, headers, rows) {
      const csv = [headers, ...rows]
        .map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'))
        .join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function syncAuthScreen() {
      const loginLogo = document.getElementById('login-logo-box');
      if (loginLogo && !loginLogo.innerHTML) loginLogo.innerHTML = getContechLogoSVG(false);
      const sideLogo = document.getElementById('sidebar-logo-box');
      if (sideLogo && !sideLogo.innerHTML) sideLogo.innerHTML = getContechLogoSVG(true);

      const session = getActiveSession();
      const authEl = document.getElementById('auth-screen');
      const shellEl = document.getElementById('app-shell');

      if (!session) {
        authEl.classList.remove('hidden');
        shellEl.classList.add('hidden');
        return;
      }

      authEl.classList.add('hidden');
      shellEl.classList.remove('hidden');
      document.getElementById('current-user-name').textContent = session.name || session.username;
      document.getElementById('current-user-role').textContent = session.role || 'Operador';
      renderSidebar();
      renderRoute(ActiveRoute);
      initInstantBidirectionalSync();
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const errBox = document.getElementById('login-error');

      const found = (AppState.users || []).find((u) => u.username === username && u.password === password);
      if (!found) {
        errBox.textContent = 'Usuário ou senha inválidos.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      const sessionData = JSON.stringify({ id: found.id, username: found.username, name: found.name, role: found.role });
      if (remember) {
        localStorage.setItem(SESSION_KEY, sessionData);
        sessionStorage.removeItem(SESSION_KEY);
      } else {
        sessionStorage.setItem(SESSION_KEY, sessionData);
        localStorage.removeItem(SESSION_KEY);
      }
      syncAuthScreen();
    });

    function renderRoute(route) {
      const container = document.getElementById('main-content');
      if (!container) return;

      const activeEl = document.activeElement;
      const shouldRestoreFocus =
        activeEl &&
        container.contains(activeEl) &&
        (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA') &&
        activeEl.id;
      const focusId = shouldRestoreFocus ? activeEl.id : null;
      const selStart = shouldRestoreFocus && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
      const selEnd = shouldRestoreFocus && typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null;

      switch (route) {
        case 'dashboard': renderDashboard(container); break;
        case 'contabeis': renderClientes(container, 'contabeis'); break;
        case 'gerais': renderClientes(container, 'gerais'); break;
        case 'certificados': renderCertificados(container); break;
        case 'pagar': renderFinanceiro(container, 'pagar'); break;
        case 'receber': renderFinanceiro(container, 'receber'); break;
        case 'tarefas': renderTarefas(container); break;
        case 'licitacoes': renderLicitacoes(container); break;
        case 'pmi': renderPmi(container); break;
        case 'os': renderOrdensServico(container); break;
        case 'estudo': renderEstudo(container); break;
        case 'relatorios': renderRelatorios(container); break;
        case 'administracao': renderAdministracao(container); break;
        default: renderDashboard(container); break;
      }

      if (focusId) {
        const restored = document.getElementById(focusId);
        if (restored) {
          restored.focus();
          if (selStart !== null && typeof restored.setSelectionRange === 'function') {
            try {
              restored.setSelectionRange(selStart, selEnd ?? selStart);
            } catch (e) {}
          }
        }
      }
    }

        'ID': c.id || '',
        'ID ALTERDATA': c.idAlterdata || '',
        'NOME': c.nomeRazao || '',
        'CPF': c.cpf || '',
        'SENHA GOV': c.senhas?.gov || '',
        'CNPJ': c.cnpj || '',
        'IE': c.inscricaoEstadual || '',
        'IM': c.inscricaoMunicipal || '',
        'DATA ABERTURA': c.dataAbertura || '',
        'DATA NASCIMENTO': c.dataNascimento || '',
        'VENC CERTIFICADO': c.certificadoVencimento || '',
        'REGIME': c.regimeTributario || 'Simples Nacional',
        'CAPITAL SOCIAL': Number(c.capitalSocial || 0),
        'PROCURACOES': (c.procuracoes || c.producoes || []).join(', '),
        'PARCELAMENTO': (c.parcelamentos || []).join(', '),
        'EFD': c.obrigacoes?.EFD || 'N/A',
        'MIT': c.obrigacoes?.MIT || 'N/A',
        'DEFIS': c.obrigacoes?.DEFIS || 'N/A',
        'DASN': c.obrigacoes?.DASN || 'N/A',
        'CELULAR': c.celular || '',
        'RG': c.rg || '',
        'CNH': c.cnh || '',
        'TITULO': c.tituloEleitor || '',
        'EMAIL': c.email || '',
        'SENHA NFSE': c.senhas?.nfse || '',
        'SENHA EMAIL': c.senhas?.email || ''
      };
    }

    function mapSheetRowToClient(r, prefix) {
      const splitList = (val) => String(val || '').split(',').map((s) => s.trim()).filter(Boolean);
      return {
        id: String(r['ID'] || r.id || generateId(prefix)),
        idAlterdata: String(r['ID ALTERDATA'] || r.id_alterdata || ''),
        nomeRazao: String(r['NOME'] || r.nome || ''),
        cpf: String(r['CPF'] || r.cpf || ''),
        rg: String(r['RG'] || r.rg || ''),
        cnh: String(r['CNH'] || r.cnh || ''),
        tituloEleitor: String(r['TITULO'] || r.titulo || ''),
        dataNascimento: String(r['DATA NASCIMENTO'] || r.data_nascimento || ''),
        celular: String(r['CELULAR'] || r.celular || ''),
        email: String(r['EMAIL'] || r.email || ''),
        cnpj: String(r['CNPJ'] || r.cnpj || ''),
        inscricaoEstadual: String(r['IE'] || r.inscricao_estadual || ''),
        inscricaoMunicipal: String(r['IM'] || r.inscricao_municipal || ''),
        dataAbertura: String(r['DATA ABERTURA'] || r.data_abertura || ''),
        regimeTributario: String(r['REGIME'] || r.regime || 'Simples Nacional'),
        capitalSocial: Number(r['CAPITAL SOCIAL'] || r.capital_social || 0),
        procuracoes: splitList(r['PROCURACOES'] || r.producoes),
        parcelamentos: splitList(r['PARCELAMENTO'] || r.parcelamento),
        obrigacoes: {
          EFD: String(r['EFD'] || r.efd || 'N/A'),
          MIT: String(r['MIT'] || r.mit || 'N/A'),
          DEFIS: String(r['DEFIS'] || r.defis || 'N/A'),
          DASN: String(r['DASN'] || r.dasn || 'N/A')
        },
        certificadoVencimento: String(r['VENC CERTIFICADO'] || r.vencimento_certificado || ''),
        senhas: {
          gov: String(r['SENHA GOV'] || r.senha_gov || ''),
          nfse: String(r['SENHA NFSE'] || r.senha_nfse || ''),
          email: String(r['SENHA EMAIL'] || r.senha_email || '')
        }
      };
    }

    function mapStateToSheetPayload() {
      const today = new Date().toISOString().slice(0, 10);
      return {
        contabeis: (AppState.clientesContabeis || []).map(mapClientToSheetRow),
        gerais: (AppState.clientesGerais || []).map(mapClientToSheetRow),
        pagar: (AppState.contasPagar || []).map((p) => ({
          ID: p.id, Data_Lancamento: today, Fornecedor_Descricao: p.descricao, Categoria: p.categoria,
          Parcela: p.parcela || '1/1', Vencimento: p.vencimento, Valor: Number(p.valor || 0),
          Status: p.status, Data_Pagamento: p.dataPagamento || '', Observacoes: ''
        })),
        receber: (AppState.contasReceber || []).map((r) => ({
          ID: r.id, Data_Lancamento: today, Cliente: r.cliente, Descricao_Servico: r.descricao,
          Parcela: r.parcela || '1/1', Vencimento: r.vencimento, Valor: Number(r.valor || 0),
          Status: r.status, Data_Recebimento: r.dataRecebimento || '', Observacoes: ''
        })),
        tarefas: (AppState.tarefas || []).map((t) => ({
          ID: t.id, Titulo: t.titulo, Area: t.area, Prioridade: t.prioridade,
          Prazo: t.prazo, Status: t.status, Responsavel: t.responsavel || '', Observacoes: ''
        })),
        licitacoes: (AppState.licitacoes || []).map((l) => ({
          ID: l.id, Portal: l.portal, Numero_Edital: l.numeroEdital, Orgao: l.orgao,
          UF: l.uf, Modalidade: l.modalidade, Objeto: l.objeto, Data_Abertura: l.dataAbertura,
          Valor_Estimado: Number(l.valorEstimado || 0), Link_Edital: l.link || '', Status_Acompanhamento: 'Monitorado'
        })),
        cursos: (AppState.cursos || []).map((c) => ({
          ID: c.id, Curso: c.nome, Instituicao: c.instituicao || '', Carga_Horaria: c.cargaHoraria || '', Status: c.status || 'Em andamento'
        })),
        disciplinas: (AppState.disciplinas || []).map((d) => ({
          ID: d.id, Curso_ID: d.cursoId, Disciplina: d.nome
        })),
        estudos: (AppState.atividadesEstudo || []).map((a) => {
          const disc = (AppState.disciplinas || []).find((d) => d.id === a.disciplinaId);
          return {
            ID: a.id, Data: a.data, Curso_ID: a.cursoId, Disciplina_ID: a.disciplinaId || '',
            Materia: disc ? disc.nome : '', Atividade: a.titulo, Status: a.status, Observacoes: ''
          };
        }),
        pmi: (AppState.servicosPmi || []).map((p) => ({
          ID: p.id, Data: p.data, Secretaria: p.secretaria, Servico: p.servico, Complemento: p.complemento || '',
          Valor: Number(p.valor || 0), Status_Pagamento: p.status, Numero_Empenho: p.empenho || '', Numero_NF: p.nf || ''
        })),
        os: (AppState.ordensServico || []).map((o) => ({
          Numero_OS: o.id, Data_Abertura: o.data, Cliente: o.clienteNome, Telefone: o.telefone || '',
          Equipamento: o.equipamento, Defeito_Relatado: o.defeito, Servico_Executado: o.servicoExecutado || '',
          Valor: Number(o.valor || 0), Status: o.status, Data_Conclusao: ''
        })),
        usuarios: (AppState.users || []).map((u) => ({
          ID: u.id, Usuario: u.username, Nome_Completo: u.name, Senha_Hash: u.password, Perfil: u.role, Ativo: 'Sim'
        }))

    }

    async function pullFromGas(silent = false) {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        if (!silent) showToast('Configure a URL /exec antes de puxar da nuvem.', 'warning');
        return;
      }
      if (isSyncBusy) return;
      isSyncBusy = true;
      updateSyncIndicator('syncing', 'Recebendo dados...');
      try {
        const res = await fetch(`${url}?action=readAll&_t=${Date.now()}`);
        const json = await res.json();
        if (!json.success || !json.data) {
          throw new Error(json.error || 'Resposta inválida do Google Sheets.');
        }
        const d = json.data;
        if (Array.isArray(d.contabeis)) AppState.clientesContabeis = d.contabeis.map((r) => mapSheetRowToClient(r, 'CC'));
        if (Array.isArray(d.gerais)) AppState.clientesGerais = d.gerais.map((r) => mapSheetRowToClient(r, 'CG'));
        if (Array.isArray(d.pagar)) {
          AppState.contasPagar = d.pagar.map((r) => ({
            id: String(r.ID || generateId('PAG')), descricao: String(r.Fornecedor_Descricao || ''),
            categoria: String(r.Categoria || 'Outros'), parcela: String(r.Parcela || '1/1'),
            vencimento: String(r.Vencimento || ''), valor: Number(r.Valor || 0),
            status: String(r.Status || 'Pendente'), dataPagamento: String(r.Data_Pagamento || '')
          }));
        }
        if (Array.isArray(d.receber)) {
          AppState.contasReceber = d.receber.map((r) => ({
            id: String(r.ID || generateId('REC')), cliente: String(r.Cliente || ''),
            descricao: String(r.Descricao_Servico || ''), parcela: String(r.Parcela || '1/1'),
            vencimento: String(r.Vencimento || ''), valor: Number(r.Valor || 0),
            status: String(r.Status || 'Pendente'), dataRecebimento: String(r.Data_Recebimento || '')
          }));
        }
        if (Array.isArray(d.tarefas)) {
          AppState.tarefas = d.tarefas.map((r) => ({
            id: String(r.ID || generateId('TAR')), titulo: String(r.Titulo || ''),
            area: String(r.Area || TAREFA_AREAS[0]), prioridade: String(r.Prioridade || 'Média'),
            prazo: String(r.Prazo || ''), status: String(r.Status || 'Pendente'), responsavel: String(r.Responsavel || '')
          }));
        }
        if (Array.isArray(d.licitacoes)) {
          AppState.licitacoes = d.licitacoes.map((r) => ({
            id: String(r.ID || generateId('LIC')), portal: String(r.Portal || TENDER_PORTALS_20[0].name),
            numeroEdital: String(r.Numero_Edital || ''), orgao: String(r.Orgao || ''), uf: String(r.UF || 'PB'),
            modalidade: String(r.Modalidade || 'Pregão Eletrônico'), objeto: String(r.Objeto || ''),
            dataAbertura: String(r.Data_Abertura || ''), valorEstimado: Number(r.Valor_Estimado || 0),
            link: String(r.Link_Edital || '')
          }));
        }
        if (Array.isArray(d.cursos)) {
          AppState.cursos = d.cursos.map((r) => ({
            id: String(r.ID || generateId('CUR')), nome: String(r.Curso || ''),
            instituicao: String(r.Instituicao || ''), cargaHoraria: String(r.Carga_Horaria || ''),
            status: String(r.Status || 'Em andamento')
          }));
        }
        if (Array.isArray(d.disciplinas)) {
          AppState.disciplinas = d.disciplinas.map((r) => ({
            id: String(r.ID || generateId('DIS')), cursoId: String(r.Curso_ID || ''), nome: String(r.Disciplina || '')
          }));
        }
        if (Array.isArray(d.estudos)) {
          AppState.atividadesEstudo = d.estudos.map((r) => ({
            id: String(r.ID || generateId('EST')), data: String(r.Data || ''),
            cursoId: String(r.Curso_ID || ''), disciplinaId: String(r.Disciplina_ID || ''),
            titulo: String(r.Atividade || ''), status: String(r.Status || 'Pendente')
          }));
        }
        if (Array.isArray(d.pmi)) {
          AppState.servicosPmi = d.pmi.map((r) => ({
            id: String(r.ID || generateId('PMI')), data: String(r.Data || ''),
            secretaria: String(r.Secretaria || ''), servico: String(r.Servico || ''),
            complemento: String(r.Complemento || ''), valor: Number(r.Valor || 0),
            status: String(r.Status_Pagamento || 'Pendente'), empenho: String(r.Numero_Empenho || ''),
            nf: String(r.Numero_NF || '')
          }));
        }
        if (Array.isArray(d.os)) {
          AppState.ordensServico = d.os.map((r) => ({
            id: String(r.Numero_OS || generateId('OS')), data: String(r.Data_Abertura || ''),
            clienteNome: String(r.Cliente || ''), telefone: String(r.Telefone || ''),
            equipamento: String(r.Equipamento || ''), defeito: String(r.Defeito_Relatado || ''),
            servicoExecutado: String(r.Servico_Executado || ''), valor: Number(r.Valor || 0),
            status: String(r.Status || 'Aberta')
          }));
        }
        if (Array.isArray(d.usuarios) && d.usuarios.length > 0) {
          AppState.users = d.usuarios.map((r) => ({
            id: String(r.ID || generateId('USR')), username: String(r.Usuario || ''),
            name: String(r.Nome_Completo || ''), password: String(r.Senha_Hash || ''),
            role: String(r.Perfil || 'Operador')
          }));
        }

        if (json.version) AppState.config.cloudVersion = String(json.version);
        AppState.config.lastSyncAt = new Date().toLocaleTimeString('pt-BR');
        AppState.config.lastSyncMessage = 'Dados atualizados a partir do Google Sheets.';
        saveState(true);
        updateSyncIndicator('online', `Sheets Ao Vivo • ${AppState.config.lastSyncAt}`);
        renderRoute(ActiveRoute);
        if (!silent) showToast('Dados puxados do Google Sheets com sucesso!');
      } catch (e) {
        updateSyncIndicator('error', 'Erro ao receber');
        if (!silent) showToast(e.message || 'Falha ao puxar dados do Google Sheets.', 'error');
      } finally {
        isSyncBusy = false;
      }
    }

    async function checkCloudDeltaAndPull() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url || AppState.config?.instantSync === false || isSyncBusy || instantPushTimer) return;
      try {
        const res = await fetch(`${url}?action=version&_t=${Date.now()}`);
        const json = await res.json();
        if (json.success && json.version && String(json.version) !== String(AppState.config.cloudVersion || '0')) {
          await pullFromGas(true);
          showToast('Atualização recebida do Google Sheets!');
        } else if (json.success) {
          updateSyncIndicator('online', `Sheets Ao Vivo${AppState.config.lastSyncAt ? ' • ' + AppState.config.lastSyncAt : ''}`);
        }
      } catch (e) {
        // Silencioso no polling em segundo plano
      }
    }

    async function testGasConnection() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        showToast('Informe a URL /exec do Google Apps Script.', 'warning');
        return;
      }
      updateSyncIndicator('syncing', 'Testando conexão...');
      try {
        const res = await fetch(`${url}?action=test&_t=${Date.now()}`);
        const json = await res.json();
        if (json.success) {
          AppState.config.lastSyncMessage = `Conectado: ${json.spreadsheet || 'Planilha CONTECH'}`;
          saveState(true);
          updateSyncIndicator('online', 'Sheets Conectado');
          renderRoute('administracao');
          showToast('Conexão com Google Sheets validada!');
        } else {
          updateSyncIndicator('error', 'Erro no Script');
          showToast(json.error || 'Falha na resposta do script.', 'error');
        }
      } catch (e) {
        updateSyncIndicator('error', 'Falha de Rede');
        showToast('Erro de rede ao conectar com o Apps Script.', 'error');
      }
    }

    async function syncAllToGas(silent = false) {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        if (!silent) showToast('Configure a URL /exec antes de sincronizar.', 'warning');
        return;
      }
      if (instantPushTimer) {
        clearTimeout(instantPushTimer);
        instantPushTimer = null;
      }
      if (isSyncBusy) {
        pendingPushAfterSync = true;
        return;
      }
      isSyncBusy = true;
      updateSyncIndicator('syncing', 'Sincronizando...');
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'syncAll', data: mapStateToSheetPayload() })
        });
        const json = await res.json();
        if (json.success) {
          if (json.version) AppState.config.cloudVersion = String(json.version);
          AppState.config.lastSyncAt = new Date().toLocaleTimeString('pt-BR');
          AppState.config.lastSyncMessage = json.message || 'Sincronizado instantaneamente.';
          saveState(true);
          updateSyncIndicator('online', `Sheets Ao Vivo • ${AppState.config.lastSyncAt}`);
          if (ActiveRoute === 'administracao') renderRoute('administracao');
          if (!silent) showToast('Todas as abas enviadas para o Google Sheets!');
        } else {
          updateSyncIndicator('error', 'Falha ao enviar');
          if (!silent) showToast(json.error || 'Erro ao enviar dados.', 'error');
        }
      } catch (e) {
        updateSyncIndicator('error', 'Offline / Erro');
        if (!silent) showToast('Falha ao enviar dados para o Google Apps Script.', 'error');
      } finally {
        isSyncBusy = false;
        if (pendingPushAfterSync) {
          pendingPushAfterSync = false;
          syncAllToGas(true);
        }
      }
    }

    async function triggerInstantBidirectionalSync() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        navigateTo('administracao');
        showToast('Cole a URL /exec do Google Apps Script para ativar o Sync.', 'warning');
        return;
      }
      await syncAllToGas(false);
    }

    function initInstantBidirectionalSync() {
      if (cloudPollTimer) clearInterval(cloudPollTimer);
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        updateSyncIndicator('offline', 'Sync Local');
        return;
      }
      updateSyncIndicator('online', 'Sheets Ao Vivo');
      if (AppState.config?.instantSync !== false) {
        checkCloudDeltaAndPull();
        const intervalMs = Math.max(3, Number(AppState.config?.pollSeconds || 5)) * 1000;
        cloudPollTimer = setInterval(checkCloudDeltaAndPull, intervalMs);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && AppState.config?.gasUrl && AppState.config?.instantSync !== false) {
        checkCloudDeltaAndPull();
      }
    });

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(AppState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_contech_erp_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackupJSON(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          AppState = { ...createInitialState(), ...parsed };
          saveState();
          renderRoute('administracao');
          showToast('Backup JSON restaurado com sucesso!');
        } catch (err) {
          showToast('Arquivo JSON inválido.', 'error');
        }
      };
      reader.readAsText(file);
    }

            <button type="button" onclick="openUserModal()" class="px-3.5 py-1.5 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">+ Novo Usuário</button>
          </div>
          <div class="divide-y divide-slate-100 text-xs">
            ${(AppState.users || []).map((u) => `
              <div class="py-2.5 flex items-center justify-between gap-2">
                <div><strong>${escapeHTML(u.name)}</strong> (<span class="font-mono">${escapeHTML(u.username)}</span>) • ${escapeHTML(u.role)}</div>
                <div class="space-x-1">
                  <button type="button" onclick="openUserModal('${u.id}')" class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 font-semibold cursor-pointer">Alterar Senha</button>
                  ${u.username !== 'admin' ? `<button type="button" onclick="AppState.users = AppState.users.filter(x => x.id !== '${u.id}'); saveState(); renderRoute('administracao');" class="px-2.5 py-1 rounded-lg bg-red-100 text-red-700 font-semibold cursor-pointer">Remover</button>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openUserModal(editId = null) {
      const item = editId ? (AppState.users || []).find((x) => x.id === editId) : null;
      const u = item || { name: '', username: '', password: '', role: 'Operador' };
      openModal(
        item ? 'Editar Usuário' : 'Novo Usuário',
        `<form id="user-form" class="space-y-3 text-xs">
          <div><label class="font-semibold">Nome Completo *</label><input name="name" required value="${escapeHTML(u.name)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Login *</label><input name="username" required value="${escapeHTML(u.username)}" ${item?.username === 'admin' ? 'readonly' : ''} class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Senha *</label><input type="password" name="password" required value="${escapeHTML(u.password)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Perfil</label><select name="role" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white"><option ${u.role === 'Administrador' ? 'selected' : ''}>Administrador</option><option ${u.role === 'Operador' ? 'selected' : ''}>Operador</option></select></div>
        </form>`,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="user-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar</button>`
      );
      document.getElementById('user-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const rec = { id: item ? item.id : generateId('USR'), name: fd.get('name').trim(), username: fd.get('username').trim(), password: fd.get('password'), role: fd.get('role') };
        if (item) {
          const idx = AppState.users.findIndex((x) => x.id === item.id);
          if (idx >= 0) AppState.users[idx] = rec;
        } else {
          AppState.users.push(rec);
        }
        saveState();
        closeModal();
        renderRoute('administracao');
        showToast('Usuário salvo!');
      };
    }

    // =========================================================================
    // 3. CADASTROS DE CLIENTES (26 CAMPOS COM ROLAGEM HORIZONTAL)
    // =========================================================================
    let ClientSearch = '';
    let ClientRegimeFilter = '';
    let ClientSortField = 'nomeRazao';
    let ClientSortDir = 'asc';

    function renderClientes(container, kind) {
      const isContabil = kind === 'contabeis';
      const list = isContabil ? (AppState.clientesContabeis || []) : (AppState.clientesGerais || []);
      const filtered = list
        .filter((c) => {
          const hay = `${c.id} ${c.idAlterdata} ${c.nomeRazao} ${c.cpf} ${c.cnpj} ${c.email} ${c.celular}`.toLowerCase();
          const okText = !ClientSearch || hay.includes(ClientSearch.toLowerCase());
          const okReg = !ClientRegimeFilter || c.regimeTributario === ClientRegimeFilter;
          return okText && okReg;
        })
        .sort((a, b) => {
          const mult = ClientSortDir === 'asc' ? 1 : -1;
          if (ClientSortField === 'capitalSocial') {
            return (Number(a.capitalSocial || 0) - Number(b.capitalSocial || 0)) * mult;
          }
          const getVal = (obj) => {
            if (ClientSortField === 'procuracoes') return (obj.procuracoes || obj.producoes || []).join(', ');
            if (ClientSortField === 'parcelamentos') return (obj.parcelamentos || []).join(', ');
            return String(obj[ClientSortField] ?? '');
          };
          return getVal(a).localeCompare(getVal(b), 'pt-BR', { numeric: true, sensitivity: 'base' }) * mult;
        });

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">${isContabil ? 'Clientes Contábeis' : 'Clientes Gerais & Suporte TI'}</h2>

          </div>
          <div class="flex flex-wrap gap-2 text-xs">
            <button type="button" onclick="exportClientesCSV('${kind}')" class="px-3.5 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold cursor-pointer">Exportar CSV</button>
            <button type="button" onclick="openClienteModal('${kind}')" class="px-4 py-2 rounded-xl bg-accent-500 hover:bg-accent-600 text-white font-bold cursor-pointer">+ Novo Cliente</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 border shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
          <input id="search-clientes-${kind}" type="text" value="${escapeHTML(ClientSearch)}" oninput="ClientSearch = this.value; renderRoute('${kind}');" placeholder="Pesquisar por Nome/Razão Social, CNPJ, CPF, ID ou Alterdata..." class="lg:col-span-2 px-3 py-2 rounded-xl border" />
          <select onchange="ClientRegimeFilter = this.value; renderRoute('${kind}');" class="px-3 py-2 rounded-xl border bg-white">
            <option value="">Todos os Regimes Tributários</option>
            ${REGIMES.map((r) => `<option value="${r}" ${ClientRegimeFilter === r ? 'selected' : ''}>${r}</option>`).join('')}
          </select>
          <div class="flex gap-1.5">
            <select onchange="ClientSortField = this.value; renderRoute('${kind}');" title="Ordenar por campo" class="flex-1 px-3 py-2 rounded-xl border bg-white">
              <option value="nomeRazao" ${ClientSortField === 'nomeRazao' ? 'selected' : ''}>Ordenar: Nome / Razão Social</option>
              <option value="id" ${ClientSortField === 'id' ? 'selected' : ''}>Ordenar: ID</option>
              <option value="idAlterdata" ${ClientSortField === 'idAlterdata' ? 'selected' : ''}>Ordenar: ID Alterdata</option>
              <option value="cpf" ${ClientSortField === 'cpf' ? 'selected' : ''}>Ordenar: CPF</option>
              <option value="cnpj" ${ClientSortField === 'cnpj' ? 'selected' : ''}>Ordenar: CNPJ</option>
              <option value="dataAbertura" ${ClientSortField === 'dataAbertura' ? 'selected' : ''}>Ordenar: Data Abertura</option>
              <option value="dataNascimento" ${ClientSortField === 'dataNascimento' ? 'selected' : ''}>Ordenar: Data Nascimento</option>
              <option value="regimeTributario" ${ClientSortField === 'regimeTributario' ? 'selected' : ''}>Ordenar: Regime Tributário</option>
              <option value="capitalSocial" ${ClientSortField === 'capitalSocial' ? 'selected' : ''}>Ordenar: Capital Social</option>
              <option value="procuracoes" ${ClientSortField === 'procuracoes' ? 'selected' : ''}>Ordenar: Procurações</option>
              <option value="certificadoVencimento" ${ClientSortField === 'certificadoVencimento' ? 'selected' : ''}>Ordenar: Venc. Certificado</option>
            </select>
            <button type="button" onclick="ClientSortDir = ClientSortDir === 'asc' ? 'desc' : 'asc'; renderRoute('${kind}');" title="Alternar ordem crescente/decrescente" class="px-3 py-2 rounded-xl border bg-slate-50 hover:bg-slate-100 font-extrabold text-navy-900 cursor-pointer">
              ${ClientSortDir === 'asc' ? 'A→Z' : 'Z→A'}
            </button>
          </div>
        </div>

        <div class="bg-white rounded-2xl border shadow-sm overflow-x-auto">
          <table class="min-w-[2950px] w-full text-xs text-left border-collapse">
            <thead class="bg-navy-900 text-white text-[11px] whitespace-nowrap">
              <tr>
                <th class="px-3 py-3">ID</th>
                <th class="px-3 py-3">ID ALTERDATA</th>
                <th class="px-3 py-3">NOME</th>
                <th class="px-3 py-3">CPF</th>
                <th class="px-3 py-3">SENHA GOV</th>
                <th class="px-3 py-3">CNPJ</th>
                <th class="px-3 py-3">IE</th>
                <th class="px-3 py-3">IM</th>
                <th class="px-3 py-3">DATA ABERTURA</th>
                <th class="px-3 py-3">DATA NASCIMENTO</th>
                <th class="px-3 py-3">VENC CERTIFICADO</th>
                <th class="px-3 py-3">REGIME</th>
                <th class="px-3 py-3">CAPITAL SOCIAL</th>
                <th class="px-3 py-3">PROCURACOES</th>
                <th class="px-3 py-3">PARCELAMENTO</th>
                <th class="px-3 py-3">EFD</th>
                <th class="px-3 py-3">MIT</th>
                <th class="px-3 py-3">DEFIS</th>
                <th class="px-3 py-3">DASN</th>
                <th class="px-3 py-3">CELULAR</th>
                <th class="px-3 py-3">RG</th>
                <th class="px-3 py-3">CNH</th>
                <th class="px-3 py-3">TITULO</th>
                <th class="px-3 py-3">EMAIL</th>
                <th class="px-3 py-3">SENHA NFSE</th>
                <th class="px-3 py-3">SENHA EMAIL</th>
                <th class="px-3 py-3 sticky right-0 bg-navy-900 text-right uppercase">Ações</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${filtered.length === 0 ? `<tr><td colspan="27" class="px-4 py-6 text-center text-slate-400">Nenhum cliente encontrado.</td></tr>` : filtered.map((c) => `
                <tr class="hover:bg-slate-50">
                  <td class="px-3 py-2.5 font-mono font-bold">${escapeHTML(c.id)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.idAlterdata)}</td>
                  <td class="px-3 py-2.5 font-bold text-navy-900">${escapeHTML(c.nomeRazao)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.cpf)}</td>
                  <td class="px-3 py-2.5 font-mono">${escapeHTML(c.senhas?.gov || '—')}</td>
                  <td class="px-3 py-2.5 font-mono">${escapeHTML(c.cnpj)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.inscricaoEstadual)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.inscricaoMunicipal)}</td>
                  <td class="px-3 py-2.5">${formatDateBR(c.dataAbertura)}</td>
                  <td class="px-3 py-2.5">${formatDateBR(c.dataNascimento)}</td>
                  <td class="px-3 py-2.5 font-semibold">${formatDateBR(c.certificadoVencimento)}</td>
                  <td class="px-3 py-2.5"><span class="px-2 py-0.5 rounded-full bg-blue-50 text-navy-800 font-semibold">${escapeHTML(c.regimeTributario)}</span></td>
                  <td class="px-3 py-2.5 font-semibold">${formatCurrency(c.capitalSocial)}</td>
                  <td class="px-3 py-2.5">${escapeHTML((c.procuracoes || c.producoes || []).join(', '))}</td>
                  <td class="px-3 py-2.5">${escapeHTML((c.parcelamentos || []).join(', ') || '—')}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.obrigacoes?.EFD || 'N/A')}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.obrigacoes?.MIT || 'N/A')}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.obrigacoes?.DEFIS || 'N/A')}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.obrigacoes?.DASN || 'N/A')}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.celular)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.rg)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.cnh)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.tituloEleitor)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(c.email)}</td>
                  <td class="px-3 py-2.5 font-mono">${escapeHTML(c.senhas?.nfse || '—')}</td>
                  <td class="px-3 py-2.5 font-mono">${escapeHTML(c.senhas?.email || '—')}</td>
                  <td class="px-3 py-2.5 sticky right-0 bg-white border-l border-slate-100 text-right whitespace-nowrap space-x-1">
                    <button type="button" onclick="openClienteFichaModal('${kind}', '${c.id}')" class="px-2 py-1 rounded-lg bg-blue-100 text-navy-900 font-bold cursor-pointer">Ficha</button>
                    <button type="button" onclick="openClienteModal('${kind}', '${c.id}')" class="px-2 py-1 rounded-lg bg-amber-100 text-amber-900 font-bold cursor-pointer">Editar</button>
                    <button type="button" onclick="deleteCliente('${kind}', '${c.id}')" class="px-2 py-1 rounded-lg bg-red-100 text-red-700 font-bold cursor-pointer">Excluir</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function openClienteFichaModal(kind, id) {
      const list = kind === 'contabeis' ? AppState.clientesContabeis : AppState.clientesGerais;
      const c = list.find((x) => x.id === id);
      if (!c) return;
      const copyBtn = (val, label) => val
        ? `<button type="button" onclick="navigator.clipboard.writeText('${escapeHTML(val)}'); showToast('${label} copiada!');" class="ml-2 px-2 py-0.5 rounded bg-navy-900 text-white text-[10px] font-bold cursor-pointer">Copiar</button>`
        : '';
      openModal(
        `Ficha Completa — ${c.nomeRazao}`,
        `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>01. ID / 02. ID Alterdata:</strong> ${escapeHTML(c.id)} / ${escapeHTML(c.idAlterdata || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>03. Nome / Razão Social:</strong> ${escapeHTML(c.nomeRazao)}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>04. CPF / 05. RG:</strong> ${escapeHTML(c.cpf || '—')} / ${escapeHTML(c.rg || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>06. CNH / 07. Título Eleitor:</strong> ${escapeHTML(c.cnh || '—')} / ${escapeHTML(c.tituloEleitor || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>08. Nascimento / 09. Celular:</strong> ${formatDateBR(c.dataNascimento)} / ${escapeHTML(c.celular || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>10. E-mail:</strong> ${escapeHTML(c.email || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>11. CNPJ:</strong> ${escapeHTML(c.cnpj || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>12. Insc. Estadual / 13. Insc. Municipal:</strong> ${escapeHTML(c.inscricaoEstadual || '—')} / ${escapeHTML(c.inscricaoMunicipal || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>14. Data Abertura / 15. Regime:</strong> ${formatDateBR(c.dataAbertura)} • ${escapeHTML(c.regimeTributario)}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>16. Capital Social:</strong> ${formatCurrency(c.capitalSocial)}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>17. Procurações / 18. Parcelamentos:</strong> ${escapeHTML((c.procuracoes || c.producoes || []).join(', ') || '—')} / ${escapeHTML((c.parcelamentos || []).join(', ') || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>23. Venc. Certificado:</strong> ${formatDateBR(c.certificadoVencimento)}</div>
            <div class="p-3 rounded-xl bg-slate-50 border sm:col-span-2"><strong>19-22. Obrigações:</strong> EFD: ${escapeHTML(c.obrigacoes?.EFD || 'N/A')} • MIT: ${escapeHTML(c.obrigacoes?.MIT || 'N/A')} • DEFIS: ${escapeHTML(c.obrigacoes?.DEFIS || 'N/A')} • DASN: ${escapeHTML(c.obrigacoes?.DASN || 'N/A')}</div>
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-200"><strong>24. Senha GOV:</strong> <span class="font-mono">${escapeHTML(c.senhas?.gov || '—')}</span> ${copyBtn(c.senhas?.gov, 'Senha GOV')}</div>
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-200"><strong>25. Senha NFSe:</strong> <span class="font-mono">${escapeHTML(c.senhas?.nfse || '—')}</span> ${copyBtn(c.senhas?.nfse, 'Senha NFSe')}</div>
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 sm:col-span-2"><strong>26. Senha E-mail:</strong> <span class="font-mono">${escapeHTML(c.senhas?.email || '—')}</span> ${copyBtn(c.senhas?.email, 'Senha E-mail')}</div>
          </div>
        `
      );
    }

    function openClienteModal(kind, editId = null) {
      const list = kind === 'contabeis' ? AppState.clientesContabeis : AppState.clientesGerais;
      const item = editId ? list.find((x) => x.id === editId) : null;

        idAlterdata: '', nomeRazao: '', cpf: '', rg: '', cnh: '', tituloEleitor: '', dataNascimento: '',
        celular: '', email: '', cnpj: '', inscricaoEstadual: '', inscricaoMunicipal: '', dataAbertura: '',
        regimeTributario: 'Simples Nacional', capitalSocial: 0, procuracoes: [], parcelamentos: [],
        obrigacoes: { EFD: 'N/A', MIT: 'N/A', DEFIS: 'N/A', DASN: 'N/A' },

            <div><label class="font-semibold">12. Insc. Estadual</label><input name="inscricaoEstadual" value="${escapeHTML(c.inscricaoEstadual)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>

            <div><label class="font-semibold">14. Data Abertura</label><input type="date" name="dataAbertura" value="${escapeHTML(c.dataAbertura)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">15. Regime Tributário</label><select name="regimeTributario" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${REGIMES.map((r) => `<option ${c.regimeTributario === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>

            <div><label class="font-semibold">25. Senha NFSe</label><input name="senhaNfse" value="${escapeHTML(c.senhas?.nfse || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">26. Senha E-mail</label><input name="senhaEmail" value="${escapeHTML(c.senhas?.email || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="cliente-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar Cliente</button>`
      );

      document.getElementById('cliente-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);

          id: item ? item.id : generateId(kind === 'contabeis' ? 'CC' : 'CG'),
          idAlterdata: fd.get('idAlterdata').trim(),
          nomeRazao: fd.get('nomeRazao').trim(),
          cpf: fd.get('cpf').trim(),
          rg: fd.get('rg').trim(),
          cnh: fd.get('cnh').trim(),
          tituloEleitor: fd.get('tituloEleitor').trim(),
          dataNascimento: fd.get('dataNascimento'),
          celular: fd.get('celular').trim(),
          email: fd.get('email').trim(),
          cnpj: fd.get('cnpj').trim(),
          inscricaoEstadual: fd.get('inscricaoEstadual').trim(),
          inscricaoMunicipal: fd.get('inscricaoMunicipal').trim(),
          dataAbertura: fd.get('dataAbertura'),
          regimeTributario: fd.get('regimeTributario'),
          capitalSocial: Number(fd.get('capitalSocial') || 0),
          procuracoes: fd.getAll('procuracoes'),
          parcelamentos: fd.getAll('parcelamentos'),
          obrigacoes: {
            EFD: fd.get('obr_EFD'),
            MIT: fd.get('obr_MIT'),
            DEFIS: fd.get('obr_DEFIS'),
            DASN: fd.get('obr_DASN')
          },

          senhas: {

            nfse: fd.get('senhaNfse').trim(),
            email: fd.get('senhaEmail').trim()
          }
        };

          if (idx >= 0) list[idx] = rec;
        } else {
          list.push(rec);
        }
        saveState();
        closeModal();
        renderRoute(kind);
        showToast('Cliente salvo com sucesso!');
      };
    }

    function deleteCliente(kind, id) {
      askConfirm('Excluir Cliente', 'Deseja realmente excluir este cadastro de cliente?', () => {
        if (kind === 'contabeis') AppState.clientesContabeis = AppState.clientesContabeis.filter((x) => x.id !== id);
        else AppState.clientesGerais = AppState.clientesGerais.filter((x) => x.id !== id);
        saveState();
        renderRoute(kind);
        showToast('Cliente excluído.');
      });
    }

        'ID', 'ID ALTERDATA', 'NOME', 'CPF', 'SENHA GOV', 'CNPJ', 'IE', 'IM',

                const phone = String(c.celular || '').replace(/\D/g, '');

    // =========================================================================
    // 5. GESTÃO FINANCEIRA (CONTAS A PAGAR & RECEBER COM EDIÇÃO EM LOTE)
    // =========================================================================
    let FinSelectedIds = new Set();

    function toggleFinSelect(id, checked) {
      if (checked) FinSelectedIds.add(id);
      else FinSelectedIds.delete(id);
      renderRoute(ActiveRoute);
    }

    function toggleFinSelectGroup(ids, checked) {
      ids.forEach((id) => {
        if (checked) FinSelectedIds.add(id);
        else FinSelectedIds.delete(id);
      });
      renderRoute(ActiveRoute);
    }

    function bulkUpdateFinanceiro(kind, updates) {
      const isPagar = kind === 'pagar';
      const list = isPagar ? AppState.contasPagar : AppState.contasReceber;
      const today = new Date().toISOString().slice(0, 10);
      list.forEach((item) => {
        if (!FinSelectedIds.has(item.id)) return;
        if (updates.status) {
          item.status = updates.status;
          if (isPagar) item.dataPagamento = updates.status === 'Pago' ? today : '';
          else item.dataRecebimento = updates.status === 'Recebido' ? today : '';
        }
        if (updates.vencimento) item.vencimento = updates.vencimento;
        if (updates.valor !== undefined && updates.valor !== '') item.valor = Number(updates.valor);
        if (updates.categoria && isPagar) item.categoria = updates.categoria;
      });
      FinSelectedIds.clear();
      saveState();
      renderRoute(kind);
      showToast('Lançamentos atualizados em lote!');
    }

    function bulkDeleteFinanceiro(kind) {
      askConfirm('Excluir em Lote', `Deseja excluir ${FinSelectedIds.size} lançamento(s) selecionado(s)?`, () => {
        if (kind === 'pagar') AppState.contasPagar = AppState.contasPagar.filter((x) => !FinSelectedIds.has(x.id));
        else AppState.contasReceber = AppState.contasReceber.filter((x) => !FinSelectedIds.has(x.id));
        FinSelectedIds.clear();
        saveState();
        renderRoute(kind);
        showToast('Lançamentos removidos em lote.');
      });
    }

    function openBulkFinEditModal(kind) {
      const isPagar = kind === 'pagar';
      openModal(
        `Alterar ${FinSelectedIds.size} Lançamento(s) em Lote`,
        `
          <form id="bulk-fin-form" class="space-y-3 text-xs">
            <p class="text-slate-500">Preencha apenas os campos que deseja sobrescrever nos itens selecionados.</p>
            <div><label class="font-semibold">Novo Vencimento</label><input type="date" name="vencimento" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Novo Valor (R$)</label><input type="number" step="0.01" name="valor" placeholder="Deixe vazio para manter" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            ${isPagar ? `<div><label class="font-semibold">Nova Categoria</label><select name="categoria" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white"><option value="">Manter atual</option>${DESPESA_CATEGORIAS.map((c) => `<option>${c}</option>`).join('')}</select></div>` : ''}
            <div><label class="font-semibold">Novo Status</label><select name="status" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white"><option value="">Manter atual</option><option>Pendente</option><option>${isPagar ? 'Pago' : 'Recebido'}</option></select></div>
          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="bulk-fin-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Aplicar Alterações</button>`
      );
      document.getElementById('bulk-fin-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        bulkUpdateFinanceiro(kind, {
          vencimento: fd.get('vencimento'),
          valor: fd.get('valor'),
          categoria: fd.get('categoria'),
          status: fd.get('status')
        });
        closeModal();
      };
    }

    function renderFinanceiro(container, kind) {
      const isPagar = kind === 'pagar';
      const list = isPagar ? (AppState.contasPagar || []) : (AppState.contasReceber || []);
      const doneStatus = isPagar ? 'Pago' : 'Recebido';

      const abertos = list.filter((x) => x.status !== doneStatus).sort((a, b) => (a.vencimento || '').localeCompare(b.vencimento || ''));
      const liquidados = list.filter((x) => x.status === doneStatus).sort((a, b) => (b.vencimento || '').localeCompare(a.vencimento || ''));

      const totalAberto = abertos.reduce((s, x) => s + Number(x.valor || 0), 0);
      const totalLiquidado = liquidados.reduce((s, x) => s + Number(x.valor || 0), 0);
      const selectedTotal = list.filter((x) => FinSelectedIds.has(x.id)).reduce((s, x) => s + Number(x.valor || 0), 0);

      const renderSectionTable = (title, items, badgeClass) => {
        const groupIds = items.map((x) => x.id);
        const allChecked = groupIds.length > 0 && groupIds.every((id) => FinSelectedIds.has(id));
        return `
          <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
            <div class="px-4 py-3 bg-slate-50 border-b flex items-center justify-between">
              <span class="text-xs font-extrabold text-navy-900">${title} (${items.length})</span>
              <span class="text-xs font-black ${badgeClass}">${formatCurrency(items.reduce((s, x) => s + Number(x.valor || 0), 0))}</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left">
                <thead class="bg-navy-900 text-white uppercase text-[11px]">
                  <tr>
                    <th class="px-3 py-2.5 w-8"><input type="checkbox" ${allChecked ? 'checked' : ''} onchange='toggleFinSelectGroup(${JSON.stringify(groupIds)}, this.checked)' /></th>
                    <th class="px-3 py-2.5">${isPagar ? 'Descrição / Fornecedor' : 'Cliente / Serviço'}</th>
                    <th class="px-3 py-2.5">${isPagar ? 'Categoria' : 'Descrição'}</th>
                    <th class="px-3 py-2.5">Parcela</th>
                    <th class="px-3 py-2.5">Vencimento</th>
                    <th class="px-3 py-2.5">Valor</th>
                    <th class="px-3 py-2.5">Status</th>
                    <th class="px-3 py-2.5 text-right">Ações</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${items.length === 0 ? `<tr><td colspan="8" class="px-4 py-5 text-center text-slate-400">Nenhum registro nesta seção.</td></tr>` : items.map((item) => `
                    <tr class="hover:bg-slate-50 ${FinSelectedIds.has(item.id) ? 'bg-amber-50/70' : ''}">
                      <td class="px-3 py-2.5"><input type="checkbox" ${FinSelectedIds.has(item.id) ? 'checked' : ''} onchange="toggleFinSelect('${item.id}', this.checked)" /></td>
                      <td class="px-3 py-2.5 font-bold text-navy-900">${escapeHTML(isPagar ? item.descricao : item.cliente)}</td>
                      <td class="px-3 py-2.5">${escapeHTML(isPagar ? item.categoria : item.descricao)}</td>
                      <td class="px-3 py-2.5">${escapeHTML(item.parcela || '1/1')}</td>
                      <td class="px-3 py-2.5">${formatDateBR(item.vencimento)}</td>
                      <td class="px-3 py-2.5 font-bold">${formatCurrency(item.valor)}</td>
                      <td class="px-3 py-2.5">
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${item.status === doneStatus ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}">${escapeHTML(item.status)}</span>
                      </td>
                      <td class="px-3 py-2.5 text-right whitespace-nowrap space-x-1">
                        <button type="button" onclick="toggleFinStatus('${kind}', '${item.id}')" class="px-2 py-1 rounded-lg ${item.status === doneStatus ? 'bg-slate-200 text-slate-800' : 'bg-emerald-600 text-white'} font-bold cursor-pointer">
                          ${item.status === doneStatus ? 'Estornar' : (isPagar ? 'Baixar Pago' : 'Receber')}
                        </button>
                        <button type="button" onclick="deleteFinItem('${kind}', '${item.id}')" class="px-2 py-1 rounded-lg bg-red-100 text-red-700 font-bold cursor-pointer">Excluir</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      };

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">${isPagar ? 'Contas a Pagar' : 'Contas a Receber'}</h2>
            <p class="text-xs sm:text-sm text-slate-600">Em aberto na parte superior • ${doneStatus}s na parte inferior • Alteração em lote.</p>
          </div>
          <button type="button" onclick="openFinModal('${kind}')" class="px-4 py-2 rounded-xl bg-accent-500 hover:bg-accent-600 text-white text-xs font-bold cursor-pointer">
            + ${isPagar ? 'Nova Despesa' : 'Novo Recebimento'}
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl p-4 border shadow-sm">
            <div class="text-xs font-bold text-slate-500 uppercase">Total Pendente / Em Aberto</div>
            <div class="text-2xl font-black text-amber-600 mt-1">${formatCurrency(totalAberto)}</div>
          </div>
          <div class="bg-white rounded-2xl p-4 border shadow-sm">
            <div class="text-xs font-bold text-slate-500 uppercase">Total ${doneStatus}</div>
            <div class="text-2xl font-black text-emerald-700 mt-1">${formatCurrency(totalLiquidado)}</div>
          </div>
        </div>

        ${FinSelectedIds.size > 0 ? `
          <div class="bg-navy-900 text-white rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3 text-xs shadow">
            <div><strong>${FinSelectedIds.size}</strong> item(ns) selecionado(s) • Soma: <strong>${formatCurrency(selectedTotal)}</strong></div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="bulkUpdateFinanceiro('${kind}', { status: '${doneStatus}' })" class="px-3 py-1.5 rounded-lg bg-emerald-600 font-bold cursor-pointer">Marcar ${doneStatus}</button>
              <button type="button" onclick="bulkUpdateFinanceiro('${kind}', { status: 'Pendente' })" class="px-3 py-1.5 rounded-lg bg-amber-600 font-bold cursor-pointer">Estornar Pendente</button>
              <button type="button" onclick="openBulkFinEditModal('${kind}')" class="px-3 py-1.5 rounded-lg bg-blue-600 font-bold cursor-pointer">Editar em Lote</button>
              <button type="button" onclick="bulkDeleteFinanceiro('${kind}')" class="px-3 py-1.5 rounded-lg bg-red-600 font-bold cursor-pointer">Excluir Lote</button>
              <button type="button" onclick="FinSelectedIds.clear(); renderRoute('${kind}');" class="px-2.5 py-1.5 rounded-lg bg-slate-700 cursor-pointer">Limpar</button>
            </div>
          </div>
        ` : ''}

        ${renderSectionTable('1. Lançamentos Pendentes / Em Aberto', abertos, 'text-amber-600')}
        ${renderSectionTable(`2. Lançamentos ${doneStatus}s`, liquidados, 'text-emerald-700')}
      `;
    }

    function openFinModal(kind) {
      const isPagar = kind === 'pagar';
      const allClients = [...(AppState.clientesContabeis || []), ...(AppState.clientesGerais || [])];
      openModal(
        isPagar ? 'Lançar Conta a Pagar' : 'Lançar Conta a Receber',
        `
          <form id="fin-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            ${isPagar
              ? `<div class="sm:col-span-2"><label class="font-semibold">Fornecedor / Descrição *</label><input name="descricao" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
                 <div><label class="font-semibold">Categoria</label><select name="categoria" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${DESPESA_CATEGORIAS.map((c) => `<option>${c}</option>`).join('')}</select></div>`
              : `<div class="sm:col-span-2"><label class="font-semibold">Cliente *</label><input list="clientes-datalist" name="cliente" required class="w-full mt-1 px-3 py-2 rounded-xl border" /><datalist id="clientes-datalist">${allClients.map((c) => `<option value="${escapeHTML(c.nomeRazao)}">`).join('')}</datalist></div>
                 <div><label class="font-semibold">Serviço / Honorário *</label><input name="descricao" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>`
            }
            <div><label class="font-semibold">Valor da Parcela (R$) *</label><input type="number" step="0.01" name="valor" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">1º Vencimento *</label><input type="date" name="vencimento" required value="${new Date().toISOString().slice(0, 10)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Qtd. Parcelas Mensais</label><input type="number" min="1" max="60" name="parcelas" value="1" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="fin-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Gerar Lançamento(s)</button>`
      );

      document.getElementById('fin-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const totalParcelas = Math.max(1, Number(fd.get('parcelas') || 1));
        const baseDate = fd.get('vencimento');
        const valor = Number(fd.get('valor') || 0);

        for (let i = 0; i < totalParcelas; i++) {
          const parcLabel = `${i + 1}/${totalParcelas}`;
          const venc = addMonthsISO(baseDate, i);
          if (isPagar) {
            AppState.contasPagar.push({
              id: generateId('PAG'),
              descricao: fd.get('descricao').trim(),
              categoria: fd.get('categoria'),
              parcela: parcLabel,
              vencimento: venc,
              valor,
              status: 'Pendente',
              dataPagamento: ''
            });
          } else {
            AppState.contasReceber.push({
              id: generateId('REC'),
              cliente: fd.get('cliente').trim(),
              descricao: fd.get('descricao').trim(),
              parcela: parcLabel,
              vencimento: venc,
              valor,
              status: 'Pendente',
              dataRecebimento: ''
            });
          }
        }
        saveState();
        closeModal();
        renderRoute(kind);
        showToast(`${totalParcelas} lançamento(s) gerado(s)!`);
      };
    }

    function toggleFinStatus(kind, id) {
      const isPagar = kind === 'pagar';
      const list = isPagar ? AppState.contasPagar : AppState.contasReceber;
      const done = isPagar ? 'Pago' : 'Recebido';
      const item = list.find((x) => x.id === id);
      if (!item) return;
      item.status = item.status === done ? 'Pendente' : done;
      const dt = item.status === done ? new Date().toISOString().slice(0, 10) : '';
      if (isPagar) item.dataPagamento = dt;
      else item.dataRecebimento = dt;
      saveState();
      renderRoute(kind);
    }

    // 7. BUSCA & MONITORAMENTO DE LICITAÇÕES (20 PORTAIS VIA API)
    // =========================================================================
    let TenderFilter = { q: '', uf: 'PB', portal: '', maxDate: '', sort: 'asc' };
    let LiveTenderResults = [];
    let TenderSearchLoading = false;
    let TenderSourceDiagnostics = [];

    function classifyTenderPortal(sigText) {
      const s = String(sigText || '').toLowerCase();
      if (s.includes('compras.gov') || s.includes('comprasnet') || s.includes('siasg')) return 'Compras.gov.br (ComprasNet)';
      if (s.includes('licitacoes-e') || s.includes('banco do brasil')) return 'Licitações-e (Banco do Brasil)';
      if (s.includes('caixa')) return 'Portal de Compras da Caixa';
      if (s.includes('portaldecompraspublicas') || s.includes('compras públicas') || s.includes('portal de compras')) return 'Portal de Compras Públicas';
      if (s.includes('bll')) return 'BLL Compras';
      if (s.includes('licitanet')) return 'Licitanet';
      if (s.includes('bnc') || s.includes('bolsa nacional')) return 'BNC (Bolsa Nacional de Compras)';
      if (s.includes('licitamais') || s.includes('licita+brasil')) return 'Licita+Brasil';
      if (s.includes('comprasbr')) return 'ComprasBR';
      if (s.includes('bbmnet')) return 'BBMNET';
      if (s.includes('bec.sp')) return 'BEC/SP (Bolsa Eletrônica de Compras de São Paulo)';
      if (s.includes('compras.mg')) return 'Portal de Compras MG';
      if (s.includes('compras.rs')) return 'Compras RS';
      if (s.includes('compras.rj')) return 'Compras RJ';
      if (s.includes('seap') || s.includes('comprasparana')) return 'SEAP-PR';
      if (s.includes('sislog')) return 'SISLOG (Goiás)';
      if (s.includes('compras.mt')) return 'Compras MT';
      if (s.includes('centraldecompras.pb') || s.includes('paraíba')) return 'Portal de Compras PB (Paraíba)';
      if (s.includes('tce.pb') || s.includes('tramita')) return 'TCE PB';
      return 'Portal Nacional de Contratações Públicas (PNCP)';
    }

    function parsePncpSearchItem(it, fallbackUf) {
      const cnpj = it.orgao_cnpj || it.cnpj || '';
      const ano = it.ano || it.anoCompra || '';
      const seq = it.numero_sequencial || it.sequencialCompra || '';
      const portal = classifyTenderPortal(`${it.fonte || ''} ${it.sistema_origem || ''} ${it.url_sistema_origem || ''} ${it.orgao_nome || ''}`);
      const rawDate = it.data_fim_vigencia || it.data_abertura_proposta || it.data_publicacao_pncp || it.createdAt || '';
      return {
        id: it.numero_controle_pncp || it.id || generateId('PNCP'),
        numeroEdital: `${it.numero || it.numeroCompra || 'S/N'}/${ano || new Date().getFullYear()}`,
        orgao: it.orgao_nome || it.unidade_nome || 'Órgão Público',
        portal,
        uf: it.uf || fallbackUf || 'BR',
        modalidade: it.modalidade_licitacao_nome || it.tipo_nome || 'Pregão Eletrônico',
        objeto: it.description || it.title || it.objeto || '',
        valorEstimado: Number(it.valor_global || it.valor_estimado || 0),
        dataAbertura: String(rawDate).slice(0, 10),
        link: it.url_sistema_origem || (cnpj && ano && seq ? `https://pncp.gov.br/app/editais/${cnpj}/${ano}/${seq}` : 'https://pncp.gov.br/app/editais')
      };
    }

    function parsePncpConsultaItem(it, fallbackUf) {
      const cnpj = it.orgaoEntidade?.cnpj || '';
      const ano = it.anoCompra || '';
      const seq = it.sequencialCompra || '';
      const portal = classifyTenderPortal(`${it.usuarioNome || ''} ${it.sistemaOrigem || ''} ${it.linkSistemaOrigem || ''}`);
      return {
        id: it.numeroControlePNCP || generateId('PNCP'),
        numeroEdital: `${it.numeroCompra || 'S/N'}/${ano || new Date().getFullYear()}`,
        orgao: it.orgaoEntidade?.razaoSocial || 'Órgão Público',
        portal,
        uf: it.unidadeOrgao?.ufSigla || fallbackUf || 'BR',
        modalidade: it.modalidadeNome || 'Pregão Eletrônico',
        objeto: it.objetoCompra || '',
        valorEstimado: Number(it.valorTotalEstimado || 0),
        dataAbertura: String(it.dataAberturaProposta || it.dataPublicacaoPncp || '').slice(0, 10),
        link: it.linkSistemaOrigem || (cnpj && ano && seq ? `https://pncp.gov.br/app/editais/${cnpj}/${ano}/${seq}` : 'https://pncp.gov.br/app/editais')
      };
    }

    async function searchAllTenderPortals() {
      TenderSearchLoading = true;
      TenderSourceDiagnostics = [];
      renderRoute('licitacoes');

      const collected = [];
      const uf = (TenderFilter.uf || '').trim().toUpperCase();
      const kw = (TenderFilter.q || '').trim();

      const tasks = [];

      // FONTE 1: PNCP API de Busca Nacional (/api/search/) - suporta todos os 20 portais integrados e status=recebendo_proposta
      tasks.push((async () => {
        try {
          const ufsParam = uf ? `&ufs=${encodeURIComponent(uf)}` : '';
          const qParam = kw ? `&q=${encodeURIComponent(kw)}` : '';
          let count = 0;
          for (let pag = 1; pag <= 3; pag++) {
            const url = `https://pncp.gov.br/api/search/?tipos_documento=edital&ordenacao=-data&status=recebendo_proposta${ufsParam}${qParam}&pagina=${pag}&tam_pagina=50`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const rows = json.items || json.data || [];
            if (!rows.length) break;
            rows.forEach((it) => { collected.push(parsePncpSearchItem(it, uf)); count++; });
            if (rows.length < 50) break;
          }
          TenderSourceDiagnostics.push({ source: 'PNCP Busca Unificada (20 Portais)', ok: true, count });
        } catch (err) {
          TenderSourceDiagnostics.push({ source: 'PNCP Busca Unificada', ok: false, count: 0, msg: err.message });
        }
      })());

      // FONTE 2: PNCP API Consulta (/api/consulta/v1/contratacoes/proposta) - limite oficial tamanhoPagina=50
      tasks.push((async () => {
        try {
          const dtFim = addDaysISO(90).replace(/-/g, '');
          const ufQ = uf ? `&uf=${encodeURIComponent(uf)}` : '';
          let count = 0;
          for (let pag = 1; pag <= 3; pag++) {
            const url = `https://pncp.gov.br/api/consulta/v1/contratacoes/proposta?dataFinal=${dtFim}${ufQ}&pagina=${pag}&tamanhoPagina=50`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const rows = json.data || [];
            if (!rows.length) break;
            rows.forEach((it) => { collected.push(parsePncpConsultaItem(it, uf)); count++; });
            if (rows.length < 50) break;
          }
          TenderSourceDiagnostics.push({ source: 'PNCP Propostas Abertas (v1)', ok: true, count });
        } catch (err) {
          TenderSourceDiagnostics.push({ source: 'PNCP Propostas Abertas (v1)', ok: false, count: 0, msg: err.message });
        }
      })());

      // FONTE 3: PNCP Publicações Recentes (Pregão Eletrônico = 6 e Dispensa = 8 nos últimos 15 dias)
      tasks.push((async () => {
        try {
          const dtIni = addDaysISO(-15).replace(/-/g, '');
          const dtFim = new Date().toISOString().slice(0, 10).replace(/-/g, '');
          const ufQ = uf ? `&uf=${encodeURIComponent(uf)}` : '';
          let count = 0;
          for (const mod of [6, 8]) {
            const url = `https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao?dataInicial=${dtIni}&dataFinal=${dtFim}&codigoModalidadeContratacao=${mod}${ufQ}&pagina=1&tamanhoPagina=50`;
            const res = await fetch(url);
            if (res.ok) {
              const json = await res.json();
              (json.data || []).forEach((it) => { collected.push(parsePncpConsultaItem(it, uf)); count++; });
            }
          }
          TenderSourceDiagnostics.push({ source: 'PNCP Publicações Recentes', ok: true, count });
        } catch (err) {
          TenderSourceDiagnostics.push({ source: 'PNCP Publicações Recentes', ok: false, count: 0, msg: err.message });
        }
      })());

      // FONTE 4: Querido Diário (Diários Oficiais Municipais - Pregões e Editais publicados)
      tasks.push((async () => {
        try {
          const qText = kw ? `${kw} licitacao` : 'pregao eletronico edital licitacao';
          const dtSince = addDaysISO(-20);
          const url = `https://queridodiario.ok.org.br/api/gazettes?querystring=${encodeURIComponent(qText)}&published_since=${dtSince}&size=30`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          let count = 0;
          (json.gazettes || []).forEach((g, idx) => {
            if (uf && g.state_code && g.state_code.toUpperCase() !== uf) return;
            const excerpt = (g.excerpts && g.excerpts[0]) ? g.excerpts[0].replace(/<[^>]+>/g, ' ').trim() : 'Publicação de aviso de licitação em Diário Oficial Municipal.';
            collected.push({
              id: `QD-${g.territory_id || idx}-${g.date || idx}`,
              numeroEdital: `DO ${g.edition || 'Oficial'}`,
              orgao: `Prefeitura Municipal de ${g.territory_name || 'Município'} (${g.state_code || uf || 'BR'})`,
              portal: g.state_code === 'PB' ? 'TCE PB' : 'Portal Nacional de Contratações Públicas (PNCP)',
              uf: g.state_code || uf || 'BR',
              modalidade: 'Diário Oficial / Aviso de Edital',
              objeto: excerpt.slice(0, 280),
              valorEstimado: 0,
              dataAbertura: String(g.date || '').slice(0, 10),
              link: g.url || g.txt_url || 'https://queridodiario.ok.org.br'
            });
            count++;
          });
          TenderSourceDiagnostics.push({ source: 'Diários Oficiais Municipais', ok: true, count });
        } catch (err) {
          TenderSourceDiagnostics.push({ source: 'Diários Oficiais Municipais', ok: false, count: 0, msg: err.message });
        }
      })());

      // FONTE 5: Backend Google Apps Script (agrega Compras.gov, TCE-PB, Portal PB e PNCP sem CORS)
      const gasUrl = AppState.config?.gasUrl?.trim();
      if (gasUrl) {
        tasks.push((async () => {
          try {
            const gRes = await fetch(`${gasUrl}?action=licitacoes&uf=${encodeURIComponent(uf)}&q=${encodeURIComponent(kw)}&portal=${encodeURIComponent(TenderFilter.portal)}&_t=${Date.now()}`);
            const gJson = await gRes.json();
            let count = 0;
            if (gJson.success && Array.isArray(gJson.items)) {
              gJson.items.forEach((it) => { collected.push(it); count++; });
            }
            TenderSourceDiagnostics.push({ source: 'Google Apps Script (Compras.gov + TCE-PB)', ok: true, count });
          } catch (err) {
            TenderSourceDiagnostics.push({ source: 'Google Apps Script', ok: false, count: 0, msg: err.message });
          }
        })());
      }

      await Promise.allSettled(tasks);

      const map = new Map();
      collected.forEach((it) => {
        if (it && it.id) map.set(it.id, it);
      });
      LiveTenderResults = Array.from(map.values());
      TenderSearchLoading = false;
      renderRoute('licitacoes');

      if (LiveTenderResults.length > 0) {
        showToast(`${LiveTenderResults.length} edital(is) encontrado(s) nas APIs!`);
      } else {
        showToast('Nenhum edital retornado para os filtros atuais. Tente limpar a UF ou palavra-chave.', 'warning');
      }
    }
