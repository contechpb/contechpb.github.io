    function renderFinanceiro(container, kind) {
      const isPagar = kind === 'pagar';
      const list = isPagar ? (AppState.contasPagar || []) : (AppState.contasReceber || []);
      const doneStatus = isPagar ? 'Pago' : 'Recebido';

      const abertos = list.filter((x) => x.status !== doneStatus).sort((a, b) => (a.vencimento || '').localeCompare(b.vencimento || ''));
      const liquidados = list.filter((x) => x.status === doneStatus).sort((a, b) => (b.vencimento || '').localeCompare(a.vencimento || ''));

      const totalAberto = abertos.reduce((s, x) => s + Number(x.valor || 0), 0);
      const totalLiquidado = liquidados.reduce((s, x) => s + Number(x.valor || 0), 0);
      const selectedTotal = list.filter((x) => FinSelectedIds.has(x.id)).reduce((s, x) => s + Number(x.valor || 0), 0);

      const renderSectionTable = (title, items, badgeClass) => {
        const groupIds = items.map((x) => x.id);
        const allChecked = groupIds.length > 0 && groupIds.every((id) => FinSelectedIds.has(id));
        return `
          <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
            <div class="px-4 py-3 bg-slate-50 border-b flex items-center justify-between">
              <span class="text-xs font-extrabold text-navy-900">${title} (${items.length})</span>
              <span class="text-xs font-black ${badgeClass}">${formatCurrency(items.reduce((s, x) => s + Number(x.valor || 0), 0))}</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left">
                <thead class="bg-navy-900 text-white uppercase text-[11px]">
                  <tr>
                    <th class="px-3 py-2.5 w-8"><input type="checkbox" ${allChecked ? 'checked' : ''} onchange='toggleFinSelectGroup(${JSON.stringify(groupIds)}, this.checked)' /></th>
                    <th class="px-3 py-2.5">${isPagar ? 'Descrição / Fornecedor' : 'Cliente / Serviço'}</th>
                    <th class="px-3 py-2.5">${isPagar ? 'Categoria' : 'Descrição'}</th>
                    <th class="px-3 py-2.5">Parcela</th>
                    <th class="px-3 py-2.5">Vencimento</th>
                    <th class="px-3 py-2.5">Valor</th>
                    <th class="px-3 py-2.5">Status</th>
                    <th class="px-3 py-2.5 text-right">Ações</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${items.length === 0 ? `<tr><td colspan="8" class="px-4 py-5 text-center text-slate-400">Nenhum registro nesta seção.</td></tr>` : items.map((item) => `
                    <tr class="hover:bg-slate-50 ${FinSelectedIds.has(item.id) ? 'bg-amber-50/70' : ''}">
                      <td class="px-3 py-2.5"><input type="checkbox" ${FinSelectedIds.has(item.id) ? 'checked' : ''} onchange="toggleFinSelect('${item.id}', this.checked)" /></td>
                      <td class="px-3 py-2.5 font-bold text-navy-900">${escapeHTML(isPagar ? item.descricao : item.cliente)}</td>
                      <td class="px-3 py-2.5">${escapeHTML(isPagar ? item.categoria : item.descricao)}</td>
                      <td class="px-3 py-2.5">${escapeHTML(item.parcela || '1/1')}</td>
                      <td class="px-3 py-2.5">${formatDateBR(item.vencimento)}</td>
                      <td class="px-3 py-2.5 font-bold">${formatCurrency(item.valor)}</td>
                      <td class="px-3 py-2.5">
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${item.status === doneStatus ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}">${escapeHTML(item.status)}</span>
                      </td>
                      <td class="px-3 py-2.5 text-right whitespace-nowrap space-x-1">
                        <button type="button" onclick="toggleFinStatus('${kind}', '${item.id}')" class="px-2 py-1 rounded-lg ${item.status === doneStatus ? 'bg-slate-200 text-slate-800' : 'bg-emerald-600 text-white'} font-bold cursor-pointer">
                          ${item.status === doneStatus ? 'Estornar' : (isPagar ? 'Baixar Pago' : 'Receber')}
                        </button>
                        <button type="button" onclick="deleteFinItem('${kind}', '${item.id}')" class="px-2 py-1 rounded-lg bg-red-100 text-red-700 font-bold cursor-pointer">Excluir</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      };

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">${isPagar ? 'Contas a Pagar' : 'Contas a Receber'}</h2>
            <p class="text-xs sm:text-sm text-slate-600">Em aberto na parte superior • ${doneStatus}s na parte inferior • Alteração em lote.</p>
          </div>
          <button type="button" onclick="openFinModal('${kind}')" class="px-4 py-2 rounded-xl bg-accent-500 hover:bg-accent-600 text-white text-xs font-bold cursor-pointer">
            + ${isPagar ? 'Nova Despesa' : 'Novo Recebimento'}
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl p-4 border shadow-sm">
            <div class="text-xs font-bold text-slate-500 uppercase">Total Pendente / Em Aberto</div>
            <div class="text-2xl font-black text-amber-600 mt-1">${formatCurrency(totalAberto)}</div>
          </div>
          <div class="bg-white rounded-2xl p-4 border shadow-sm">
            <div class="text-xs font-bold text-slate-500 uppercase">Total ${doneStatus}</div>
            <div class="text-2xl font-black text-emerald-700 mt-1">${formatCurrency(totalLiquidado)}</div>
          </div>
        </div>

        ${FinSelectedIds.size > 0 ? `
          <div class="bg-navy-900 text-white rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3 text-xs shadow">
            <div><strong>${FinSelectedIds.size}</strong> item(ns) selecionado(s) • Soma: <strong>${formatCurrency(selectedTotal)}</strong></div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="bulkUpdateFinanceiro('${kind}', { status: '${doneStatus}' })" class="px-3 py-1.5 rounded-lg bg-emerald-600 font-bold cursor-pointer">Marcar ${doneStatus}</button>
              <button type="button" onclick="bulkUpdateFinanceiro('${kind}', { status: 'Pendente' })" class="px-3 py-1.5 rounded-lg bg-amber-600 font-bold cursor-pointer">Estornar Pendente</button>
              <button type="button" onclick="openBulkFinEditModal('${kind}')" class="px-3 py-1.5 rounded-lg bg-blue-600 font-bold cursor-pointer">Editar em Lote</button>
              <button type="button" onclick="bulkDeleteFinanceiro('${kind}')" class="px-3 py-1.5 rounded-lg bg-red-600 font-bold cursor-pointer">Excluir Lote</button>
              <button type="button" onclick="FinSelectedIds.clear(); renderRoute('${kind}');" class="px-2.5 py-1.5 rounded-lg bg-slate-700 cursor-pointer">Limpar</button>
            </div>
          </div>
        ` : ''}

        ${renderSectionTable('1. Lançamentos Pendentes / Em Aberto', abertos, 'text-amber-600')}
        ${renderSectionTable(`2. Lançamentos ${doneStatus}s`, liquidados, 'text-emerald-700')}
      `;
    }

    function openFinModal(kind) {
      const isPagar = kind === 'pagar';
      const allClients = [...(AppState.clientesContabeis || []), ...(AppState.clientesGerais || [])];
      openModal(
        isPagar ? 'Lançar Conta a Pagar' : 'Lançar Conta a Receber',
        `
          <form id="fin-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            ${isPagar
              ? `<div class="sm:col-span-2"><label class="font-semibold">Fornecedor / Descrição *</label><input name="descricao" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
                 <div><label class="font-semibold">Categoria</label><select name="categoria" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${DESPESA_CATEGORIAS.map((c) => `<option>${c}</option>`).join('')}</select></div>`
              : `<div class="sm:col-span-2"><label class="font-semibold">Cliente *</label><input list="clientes-datalist" name="cliente" required class="w-full mt-1 px-3 py-2 rounded-xl border" /><datalist id="clientes-datalist">${allClients.map((c) => `<option value="${escapeHTML(c.nomeRazao)}">`).join('')}</datalist></div>
                 <div><label class="font-semibold">Serviço / Honorário *</label><input name="descricao" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>`
            }
            <div><label class="font-semibold">Valor da Parcela (R$) *</label><input type="number" step="0.01" name="valor" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">1º Vencimento *</label><input type="date" name="vencimento" required value="${new Date().toISOString().slice(0, 10)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Qtd. Parcelas Mensais</label><input type="number" min="1" max="60" name="parcelas" value="1" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="fin-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Gerar Lançamento(s)</button>`
      );

      document.getElementById('fin-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const totalParcelas = Math.max(1, Number(fd.get('parcelas') || 1));
        const baseDate = fd.get('vencimento');
        const valor = Number(fd.get('valor') || 0);

        for (let i = 0; i < totalParcelas; i++) {
          const parcLabel = `${i + 1}/${totalParcelas}`;
          const venc = addMonthsISO(baseDate, i);
          if (isPagar) {
            AppState.contasPagar.push({
              id: generateId('PAG'),
              descricao: fd.get('descricao').trim(),
              categoria: fd.get('categoria'),
              parcela: parcLabel,
              vencimento: venc,
              valor,
              status: 'Pendente',
              dataPagamento: ''
            });
          } else {
            AppState.contasReceber.push({
              id: generateId('REC'),
              cliente: fd.get('cliente').trim(),
              descricao: fd.get('descricao').trim(),
              parcela: parcLabel,
              vencimento: venc,
              valor,
              status: 'Pendente',
              dataRecebimento: ''
            });
          }
        }
        saveState();
        closeModal();
        renderRoute(kind);
        showToast(`${totalParcelas} lançamento(s) gerado(s)!`);
      };
    }

    function toggleFinStatus(kind, id) {
      const isPagar = kind === 'pagar';
      const list = isPagar ? AppState.contasPagar : AppState.contasReceber;
      const done = isPagar ? 'Pago' : 'Recebido';
      const item = list.find((x) => x.id === id);
      if (!item) return;
      item.status = item.status === done ? 'Pendente' : done;
      const dt = item.status === done ? new Date().toISOString().slice(0, 10) : '';
      if (isPagar) item.dataPagamento = dt;
      else item.dataRecebimento = dt;
      saveState();
      renderRoute(kind);
    }

    function deleteFinItem(kind, id) {
      askConfirm('Excluir Lançamento', 'Confirma a exclusão deste lançamento financeiro?', () => {
        if (kind === 'pagar') AppState.contasPagar = AppState.contasPagar.filter((x) => x.id !== id);
        else AppState.contasReceber = AppState.contasReceber.filter((x) => x.id !== id);
        saveState();
        renderRoute(kind);
      });
    }

    // =========================================================================
    // 6. TAREFAS & PRAZOS
    // =========================================================================
    let TarefaSearch = '';
    let TarefaAreaFilter = '';

    function renderTarefas(container) {
      const list = AppState.tarefas || [];
      const filtered = list.filter((t) => {
        const hay = `${t.titulo} ${t.area} ${t.prioridade} ${t.status} ${formatDateBR(t.prazo)}`.toLowerCase();
        const okText = !TarefaSearch || hay.includes(TarefaSearch.toLowerCase());
        const okArea = !TarefaAreaFilter || t.area === TarefaAreaFilter;
        return okText && okArea;
      });
      const ativas = filtered.filter((t) => t.status !== 'Concluído');
      const concluidas = filtered.filter((t) => t.status === 'Concluído');

      const renderTaskCard = (t) => `
        <div class="p-3.5 rounded-xl border bg-white flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs">
          <div>
            <div class="font-extrabold text-navy-900">${escapeHTML(t.titulo)}</div>
            <div class="text-[11px] text-slate-500">${escapeHTML(t.area)} • Prazo: ${formatDateBR(t.prazo)} • Prioridade: <strong>${escapeHTML(t.prioridade)}</strong></div>
          </div>
          <div class="flex items-center gap-1.5">
            <select onchange="updateTaskStatus('${t.id}', this.value)" class="px-2.5 py-1 rounded-lg border bg-slate-50 font-semibold">
              ${['Pendente', 'Em andamento', 'Concluído'].map((st) => `<option ${t.status === st ? 'selected' : ''}>${st}</option>`).join('')}
            </select>
            <button type="button" onclick="openTarefaModal('${t.id}')" class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 font-bold cursor-pointer">Editar</button>
            <button type="button" onclick="deleteTarefa('${t.id}')" class="px-2.5 py-1 rounded-lg bg-red-100 text-red-700 font-bold cursor-pointer">Excluir</button>
          </div>
        </div>
      `;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">Tarefas &amp; Prazos Operacionais</h2>
            <p class="text-xs sm:text-sm text-slate-600">Controle de demandas fiscais, certificações, TI, licitações e administrativo.</p>
          </div>
          <button type="button" onclick="openTarefaModal()" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">+ Nova Tarefa</button>
        </div>

        <div class="bg-white rounded-2xl p-4 border shadow-sm flex flex-col sm:flex-row gap-3 text-xs">
          <input id="search-tarefas" type="text" value="${escapeHTML(TarefaSearch)}" oninput="TarefaSearch = this.value; renderRoute('tarefas');" placeholder="Buscar tarefa por título, área, prioridade, prazo ou status..." class="flex-1 px-3 py-2 rounded-xl border" />
          <select onchange="TarefaAreaFilter = this.value; renderRoute('tarefas');" class="px-3 py-2 rounded-xl border bg-white">
            <option value="">Todas as Áreas</option>
            ${TAREFA_AREAS.map((a) => `<option value="${a}" ${TarefaAreaFilter === a ? 'selected' : ''}>${a}</option>`).join('')}
          </select>
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-extrabold uppercase text-navy-900">Tarefas Ativas (${ativas.length})</h3>
          ${ativas.length === 0 ? '<p class="text-xs text-slate-400">Nenhuma tarefa ativa.</p>' : ativas.map(renderTaskCard).join('')}
        </div>

        <div class="space-y-2 pt-3">
          <h3 class="text-xs font-extrabold uppercase text-emerald-700">Tarefas Concluídas (${concluidas.length})</h3>
          ${concluidas.length === 0 ? '<p class="text-xs text-slate-400">Nenhuma tarefa concluída.</p>' : concluidas.map(renderTaskCard).join('')}
        </div>
      `;
    }

    function updateTaskStatus(id, status) {
      const t = (AppState.tarefas || []).find((x) => x.id === id);
      if (t) {
        t.status = status;
        saveState();
        renderRoute('tarefas');
      }
    }

    function openTarefaModal(editId = null, preset = null) {
      const item = editId ? (AppState.tarefas || []).find((x) => x.id === editId) : null;
      const t = item || preset || { titulo: '', area: TAREFA_AREAS[0], prioridade: 'Alta', prazo: addDaysISO(3), status: 'Pendente' };
      openModal(
        item ? 'Editar Tarefa' : 'Nova Tarefa',
        `
          <form id="tarefa-form" class="space-y-3 text-xs">
            <div><label class="font-semibold">Descrição da Tarefa *</label><input name="titulo" required value="${escapeHTML(t.titulo)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div><label class="font-semibold">Área</label><select name="area" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${TAREFA_AREAS.map((a) => `<option ${t.area === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
              <div><label class="font-semibold">Prioridade</label><select name="prioridade" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${['Alta', 'Média', 'Baixa'].map((p) => `<option ${t.prioridade === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
              <div><label class="font-semibold">Prazo</label><input type="date" name="prazo" value="${escapeHTML(t.prazo)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            </div>
          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="tarefa-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar Tarefa</button>`
      );
      document.getElementById('tarefa-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const rec = {
          id: item ? item.id : generateId('TAR'),
          titulo: fd.get('titulo').trim(),
          area: fd.get('area'),
          prioridade: fd.get('prioridade'),
          prazo: fd.get('prazo'),
          status: item ? item.status : 'Pendente'
        };
        if (item) {
          const idx = AppState.tarefas.findIndex((x) => x.id === item.id);
          if (idx >= 0) AppState.tarefas[idx] = rec;
        } else {
          AppState.tarefas.push(rec);
        }
        saveState();
        closeModal();
        renderRoute('tarefas');
        showToast('Tarefa salva!');
      };
    }

    function deleteTarefa(id) {
      askConfirm('Excluir Tarefa', 'Deseja excluir esta tarefa?', () => {
        AppState.tarefas = AppState.tarefas.filter((x) => x.id !== id);
        saveState();
        renderRoute('tarefas');
      });
    }

    function openPortalsDirectoryModal() {
      openModal(
        'Plataformas Eletrônicas & Portais Integrados via PNCP',
        `
          <div class="space-y-3 text-xs">
            <p class="text-slate-600 bg-blue-50 border border-blue-200 rounded-xl p-3">
              <strong>Coleta Otimizada:</strong> A consulta às APIs é feita diretamente na base nacional unificada do <strong>PNCP</strong> e nas APIs diretas (<strong>Compras.gov.br</strong> e <strong>Central PB</strong>), evitando requisições duplicadas e identificando automaticamente a plataforma onde ocorrerá o pregão.
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${TENDER_PORTALS_20.map((p, idx) => `
                <a href="${p.url}" target="_blank" class="p-2.5 rounded-xl border hover:border-navy-800 flex items-center justify-between gap-2">
                  <div>
                    <div class="font-bold text-navy-900">${idx + 1}. ${escapeHTML(p.name)}</div>
                    <div class="text-[10px] text-slate-500">${escapeHTML(p.apiMode)}</div>
                  </div>
                  <span class="text-accent-600 font-bold">Abrir ↗</span>
                </a>
              `).join('')}
            </div>
          </div>
        `
      );
    }

    function openManualTenderModal() {
      openModal(
        'Cadastrar Edital Manualmente',
        `
          <form id="manual-tender-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div><label class="font-semibold">Portal *</label><select name="portal" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${TENDER_PORTALS_20.map((p) => `<option>${escapeHTML(p.name)}</option>`).join('')}</select></div>
            <div><label class="font-semibold">Nº Edital / Processo *</label><input name="numeroEdital" required placeholder="ex: PE 014/2026" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div class="sm:col-span-2"><label class="font-semibold">Órgão / Prefeitura *</label><input name="orgao" required placeholder="ex: Prefeitura Municipal de Itaporanga" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">UF</label><input name="uf" maxlength="2" value="PB" class="w-full mt-1 px-3 py-2 rounded-xl border uppercase" /></div>
            <div><label class="font-semibold">Data de Abertura *</label><input type="date" name="dataAbertura" required value="${addDaysISO(7)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Modalidade</label><input name="modalidade" value="Pregão Eletrônico" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Valor Estimado (R$)</label><input type="number" step="0.01" name="valorEstimado" value="0" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div class="sm:col-span-2"><label class="font-semibold">Objeto *</label><textarea name="objeto" required rows="2" class="w-full mt-1 px-3 py-2 rounded-xl border"></textarea></div>
            <div class="sm:col-span-2"><label class="font-semibold">Link do Edital</label><input type="url" name="link" placeholder="https://..." class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="manual-tender-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar Edital</button>`
      );
      document.getElementById('manual-tender-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        AppState.licitacoes.push({
          id: generateId('LIC'),
          portal: fd.get('portal'),
          numeroEdital: fd.get('numeroEdital').trim(),
          orgao: fd.get('orgao').trim(),
          uf: fd.get('uf').trim().toUpperCase() || 'PB',
          modalidade: fd.get('modalidade').trim(),
          objeto: fd.get('objeto').trim(),
          dataAbertura: fd.get('dataAbertura'),
          valorEstimado: Number(fd.get('valorEstimado') || 0),
          link: fd.get('link').trim()
        });
        saveState();
        closeModal();
        renderRoute('licitacoes');
        showToast('Edital adicionado ao monitoramento!');
      };
    }

    function saveTenderToLocal(id) {
      const found = LiveTenderResults.find((x) => x.id === id);
      if (!found) return;
      if (!(AppState.licitacoes || []).some((x) => x.id === id)) {
        AppState.licitacoes.push(found);
        saveState();
        renderRoute('licitacoes');
        showToast('Edital salvo no monitoramento!');
      }
    }

    function convertTenderToTask(id) {
      const found = [...(AppState.licitacoes || []), ...LiveTenderResults].find((x) => x.id === id);
      if (!found) return;
      openTarefaModal(null, {
        titulo: `Licitação ${found.numeroEdital} — ${found.orgao}`,
        area: 'Licitações',
        prioridade: 'Alta',
        prazo: found.dataAbertura || addDaysISO(3),
        status: 'Pendente'
      });
    }

    function renderLicitacoes(container) {
      const todayIso = getTodayLocalISO();
      const combined = [...(AppState.licitacoes || []), ...LiveTenderResults];
      const dedup = Array.from(new Map(combined.map((x) => [x.id, x])).values());

      const filtered = dedup
        .filter((l) => {
          if (!isFutureOrTodayOpening(l.dataAbertura, todayIso)) return false;
          const hay = `${l.numeroEdital} ${l.orgao} ${l.objeto} ${l.portal}`.toLowerCase();
          if (TenderFilter.q && !hay.includes(TenderFilter.q.toLowerCase())) return false;
          if (TenderFilter.uf && String(l.uf || '').toUpperCase() !== TenderFilter.uf.toUpperCase()) return false;
          if (TenderFilter.portal && l.portal !== TenderFilter.portal) return false;
          if (TenderFilter.maxDate && l.dataAbertura && l.dataAbertura > TenderFilter.maxDate) return false;
          return true;
        })
        .sort((a, b) => TenderFilter.sort === 'asc'
          ? (a.dataAbertura || '9999').localeCompare(b.dataAbertura || '9999')
          : (b.dataAbertura || '').localeCompare(a.dataAbertura || '')
        );

      const visibleRows = filtered.slice(0, TenderVisibleLimit);
      const hasMoreRows = filtered.length > visibleRows.length;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">Busca &amp; Monitoramento de Licitações</h2>
            <p class="text-xs sm:text-sm text-slate-600">Somente editais com data de abertura igual ou posterior a hoje (${formatDateBR(todayIso)}) nos 20 portais monitorados.</p>
          </div>
          <div class="flex flex-wrap gap-2 text-xs">
            <button type="button" onclick="openManualTenderModal()" class="px-3.5 py-2 rounded-xl bg-navy-900 text-white font-bold cursor-pointer">+ Incluir Manual</button>
            <button type="button" onclick="openPortalsDirectoryModal()" class="px-3.5 py-2 rounded-xl bg-slate-200 text-slate-800 font-bold cursor-pointer">Ver 20 Portais</button>
            <button type="button" onclick="searchAllTenderPortals()" class="px-4 py-2 rounded-xl bg-accent-500 text-white font-bold cursor-pointer">
              ${TenderSearchLoading ? 'Consultando APIs...' : 'Buscar nas APIs Agora'}
            </button>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 border shadow-sm space-y-3 text-xs">
          <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
            <input id="search-licitacoes" type="text" value="${escapeHTML(TenderFilter.q)}" oninput="TenderFilter.q = this.value; TenderVisibleLimit = 250; renderRoute('licitacoes');" placeholder="Palavra-chave / Objeto..." class="sm:col-span-2 px-3 py-2 rounded-xl border" />
            <select onchange="TenderFilter.uf = this.value; TenderVisibleLimit = 250; renderRoute('licitacoes');" class="px-3 py-2 rounded-xl border bg-white">
              <option value="" ${TenderFilter.uf === '' ? 'selected' : ''}>Todos os Estados (Brasil)</option>
              ${ESTADOS_BR.map((st) => `<option value="${st.uf}" ${TenderFilter.uf === st.uf ? 'selected' : ''}>${st.nome}</option>`).join('')}
            </select>
            <select onchange="TenderFilter.portal = this.value; TenderVisibleLimit = 250; renderRoute('licitacoes');" class="px-3 py-2 rounded-xl border bg-white">
              <option value="">Todos os 20 Portais</option>
              ${TENDER_PORTALS_20.map((p) => `<option value="${escapeHTML(p.name)}" ${TenderFilter.portal === p.name ? 'selected' : ''}>${escapeHTML(p.name)}</option>`).join('')}
            </select>
            <select onchange="TenderFilter.sort = this.value; renderRoute('licitacoes');" class="px-3 py-2 rounded-xl border bg-white">
              <option value="asc" ${TenderFilter.sort === 'asc' ? 'selected' : ''}>Abertura: Próximos → Distantes</option>
              <option value="desc" ${TenderFilter.sort === 'desc' ? 'selected' : ''}>Abertura: Distantes → Próximos</option>
            </select>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
            <div>Exibindo <strong>${visibleRows.length}</strong> de <strong>${filtered.length}</strong> edital(is) com abertura a partir de <strong>${formatDateBR(todayIso)}</strong> • Selecione <strong>"Todos os Estados"</strong> para buscar em todo o Brasil.</div>
            ${TenderSourceDiagnostics.length > 0 ? `
              <div class="flex flex-wrap gap-1.5">
                ${TenderSourceDiagnostics.map((d) => `
                  <span class="px-2 py-0.5 rounded-full font-semibold ${d.ok ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}">
                    ${escapeHTML(d.source)}: ${d.ok ? `${d.count} itens` : (d.msg || 'falha')}
                  </span>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>

        <div class="space-y-3">
          ${filtered.length === 0 ? `<div class="bg-white rounded-2xl p-6 border text-center text-xs text-slate-500">Nenhum edital com abertura a partir de ${formatDateBR(todayIso)} exibido. Clique em <strong>"Buscar nas APIs Agora"</strong> (dica: selecione <strong>"Todos os Estados"</strong> para ampliar a consulta nos 20 portais).</div>` : visibleRows.map((l) => `
            <div class="bg-white rounded-2xl p-4 border shadow-sm flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 text-xs">
              <div class="space-y-1">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-full bg-navy-900 text-white font-bold text-[10px]">${escapeHTML(l.portal)}</span>
                  <span class="font-extrabold text-navy-900">${escapeHTML(l.numeroEdital)} • ${escapeHTML(l.orgao)} (${escapeHTML(l.uf)})</span>
                </div>
                <p class="text-slate-700">${escapeHTML(l.objeto)}</p>
                <div class="text-[11px] text-slate-500">Abertura: <strong>${formatDateBR(l.dataAbertura)}</strong> • Modalidade: ${escapeHTML(l.modalidade)} • Valor Est.: <strong>${formatCurrency(l.valorEstimado)}</strong></div>
              </div>
              <div class="flex flex-wrap gap-1.5 shrink-0">
                ${l.link ? `<a href="${escapeHTML(l.link)}" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-navy-900 font-bold">Edital ↗</a>` : ''}
                <button type="button" onclick="saveTenderToLocal('${escapeHTML(l.id)}')" class="px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-800 font-bold cursor-pointer">Salvar</button>
                <button type="button" onclick="convertTenderToTask('${escapeHTML(l.id)}')" class="px-3 py-1.5 rounded-lg bg-amber-100 text-amber-900 font-bold cursor-pointer">+ Tarefa</button>
              </div>
            </div>
          `).join('')}

          ${hasMoreRows ? `
            <div class="bg-white rounded-2xl p-4 border shadow-sm flex flex-wrap items-center justify-center gap-3 text-xs">
              <span class="text-slate-600">Mostrando <strong>${visibleRows.length}</strong> de <strong>${filtered.length}</strong> licitações encontradas.</span>
              <button type="button" onclick="TenderVisibleLimit += 250; renderRoute('licitacoes');" class="px-4 py-2 rounded-xl bg-navy-900 hover:bg-navy-800 text-white font-bold cursor-pointer">
                Carregar +250 Editais
              </button>
              <button type="button" onclick="TenderVisibleLimit = ${filtered.length}; renderRoute('licitacoes');" class="px-4 py-2 rounded-xl bg-accent-500 hover:bg-accent-600 text-white font-bold cursor-pointer">
                Exibir Todos os ${filtered.length} Editais
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    // =========================================================================
    // 8. ESTUDO & CURSOS
    // =========================================================================
    let EstudoSearch = '';

    function renderEstudo(container) {
      const cursos = AppState.cursos || [];
      const disciplinas = AppState.disciplinas || [];
      const ativs = AppState.atividadesEstudo || [];
      const concluidasCount = ativs.filter((a) => a.status === 'Concluída').length;

      const q = EstudoSearch.trim().toLowerCase();
      const filteredAtivs = ativs.filter((a) => {
        if (!q) return true;
        const curso = cursos.find((c) => c.id === a.cursoId);
        const disc = disciplinas.find((d) => d.id === a.disciplinaId);
        const hay = `${a.titulo} ${curso?.nome || ''} ${disc?.nome || ''} ${a.status} ${formatDateBR(a.data)}`.toLowerCase();
        return hay.includes(q);
      });

      const pendentes = filteredAtivs
        .filter((a) => a.status !== 'Concluída')
        .sort((a, b) => (a.data || '9999').localeCompare(b.data || '9999'));
      const concluidas = filteredAtivs
        .filter((a) => a.status === 'Concluída')
        .sort((a, b) => (b.data || '').localeCompare(a.data || ''));

      const renderAtividadeRow = (a) => {
        const curso = cursos.find((c) => c.id === a.cursoId);
        const disc = disciplinas.find((d) => d.id === a.disciplinaId);
        const diff = a.status !== 'Concluída' ? daysUntil(a.data) : null;
        let prazoAlert = '';
        if (diff !== null) {
          if (diff < 0) {
            prazoAlert = `<span class="px-2 py-0.5 rounded-full bg-red-100 text-red-700 font-bold text-[10px]">Vencida há ${Math.abs(diff)}d</span>`;
          } else if (diff === 0) {
            prazoAlert = `<span class="px-2 py-0.5 rounded-full bg-red-100 text-red-700 font-bold text-[10px]">Vence Hoje!</span>`;
          } else if (diff <= 3) {
            prazoAlert = `<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-bold text-[10px]">Vence em ${diff}d</span>`;
          }
        }
        return `
          <div class="p-3 rounded-xl border ${diff !== null && diff <= 3 ? (diff <= 0 ? 'border-red-300 bg-red-50/40' : 'border-amber-300 bg-amber-50/40') : 'bg-white'} flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs">
            <div class="space-y-0.5">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-bold text-slate-800">${escapeHTML(a.titulo)}</span>
                ${prazoAlert}
              </div>
              <div class="text-[11px] text-slate-500">
                Prazo: <strong>${formatDateBR(a.data)}</strong> • Curso: <strong>${escapeHTML(curso ? curso.nome : 'Não vinculado')}</strong> • Disciplina: <strong>${escapeHTML(disc ? disc.nome : 'Não vinculada')}</strong>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <select onchange="updateEstudoStatus('${a.id}', this.value)" class="px-2.5 py-1 rounded-lg border bg-slate-50 font-semibold">
                ${['Pendente', 'Em Andamento', 'Concluída'].map((st) => `<option ${a.status === st ? 'selected' : ''}>${st}</option>`).join('')}
              </select>
              <button type="button" onclick="deleteEstudoAtiv('${a.id}')" class="px-2 py-1 rounded-lg bg-red-100 text-red-700 font-bold cursor-pointer">Excluir</button>
            </div>
          </div>
        `;
      };

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">Estudo &amp; Capacitação</h2>
            <p class="text-xs sm:text-sm text-slate-600">Cursos, disciplinas obrigatórias e cronograma de atividades (${concluidasCount}/${ativs.length} concluídas).</p>
          </div>
          <div class="flex flex-wrap gap-2 text-xs">
            <button type="button" onclick="openCursoModal()" class="px-3.5 py-2 rounded-xl bg-navy-900 text-white font-bold cursor-pointer">+ Curso</button>
            <button type="button" onclick="openDisciplinaModal()" class="px-3.5 py-2 rounded-xl bg-navy-700 text-white font-bold cursor-pointer">+ Disciplina</button>
            <button type="button" onclick="openEstudoAtivModal()" class="px-4 py-2 rounded-xl bg-accent-500 text-white font-bold cursor-pointer">+ Atividade</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 border shadow-sm text-xs">
          <input id="search-estudo" type="text" value="${escapeHTML(EstudoSearch)}" oninput="EstudoSearch = this.value; renderRoute('estudo');" placeholder="Buscar por atividade, curso, disciplina ou data..." class="w-full px-3 py-2 rounded-xl border" />
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="space-y-4">
            <div class="bg-white rounded-2xl p-4 border shadow-sm space-y-2">
              <h3 class="text-xs font-extrabold uppercase text-navy-900">Cursos (${cursos.length})</h3>
              ${cursos.length === 0 ? '<p class="text-xs text-slate-400">Nenhum curso cadastrado.</p>' : cursos.map((c) => `
                <div class="p-3 rounded-xl bg-slate-50 border text-xs flex items-center justify-between gap-2">
                  <div>
                    <div class="font-bold text-navy-900">${escapeHTML(c.nome)}</div>
                    <div class="text-[11px] text-slate-500">${escapeHTML(c.instituicao || '—')} • ${escapeHTML(c.cargaHoraria || '—')}</div>
                  </div>
                  <button type="button" onclick="deleteCurso('${c.id}')" class="px-2 py-1 rounded-lg bg-red-100 text-red-700 font-bold text-[11px] cursor-pointer">Excluir</button>
                </div>
              `).join('')}
            </div>

            <div class="bg-white rounded-2xl p-4 border shadow-sm space-y-2">
              <h3 class="text-xs font-extrabold uppercase text-navy-900">Disciplinas (${disciplinas.length})</h3>
              ${disciplinas.length === 0 ? '<p class="text-xs text-slate-400">Nenhuma disciplina cadastrada.</p>' : disciplinas.map((d) => {
                const c = cursos.find((x) => x.id === d.cursoId);
                return `
                  <div class="p-3 rounded-xl bg-slate-50 border text-xs flex items-center justify-between gap-2">
                    <div>
                      <div class="font-bold text-navy-900">${escapeHTML(d.nome)}</div>
                      <div class="text-[11px] text-slate-500">Curso: ${escapeHTML(c ? c.nome : 'Não encontrado')}</div>
                    </div>
                    <button type="button" onclick="deleteDisciplina('${d.id}')" class="px-2 py-1 rounded-lg bg-red-100 text-red-700 font-bold text-[11px] cursor-pointer">Excluir</button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="lg:col-span-2 space-y-4">
            <div class="bg-white rounded-2xl p-4 border shadow-sm space-y-2">
              <h3 class="text-xs font-extrabold uppercase text-amber-700">Atividades Pendentes / Em Andamento (${pendentes.length})</h3>
              ${pendentes.length === 0 ? '<p class="text-xs text-slate-400">Nenhuma atividade pendente.</p>' : pendentes.map(renderAtividadeRow).join('')}
            </div>

            <div class="bg-white rounded-2xl p-4 border shadow-sm space-y-2">
              <h3 class="text-xs font-extrabold uppercase text-emerald-700">Atividades Concluídas (${concluidas.length})</h3>
              ${concluidas.length === 0 ? '<p class="text-xs text-slate-400">Nenhuma atividade concluída.</p>' : concluidas.map(renderAtividadeRow).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function updateEstudoStatus(id, status) {
      const a = (AppState.atividadesEstudo || []).find((x) => x.id === id);
      if (a) { a.status = status; saveState(); renderRoute('estudo'); }
    }

    function deleteCurso(id) {
      const hasDisc = (AppState.disciplinas || []).some((d) => d.cursoId === id);
      if (hasDisc) {
        showToast('Remova primeiro as disciplinas vinculadas a este curso.', 'warning');
        return;
      }
      askConfirm('Excluir Curso', 'Deseja excluir este curso?', () => {
        AppState.cursos = AppState.cursos.filter((x) => x.id !== id);
        saveState();
        renderRoute('estudo');
      });
    }

    function deleteDisciplina(id) {
      const hasAtiv = (AppState.atividadesEstudo || []).some((a) => a.disciplinaId === id);
      if (hasAtiv) {
        showToast('Remova primeiro as atividades vinculadas a esta disciplina.', 'warning');
        return;
      }
      askConfirm('Excluir Disciplina', 'Deseja excluir esta disciplina?', () => {
        AppState.disciplinas = AppState.disciplinas.filter((x) => x.id !== id);
        saveState();
        renderRoute('estudo');
      });
    }

    function deleteEstudoAtiv(id) {
      askConfirm('Excluir Atividade', 'Deseja excluir esta atividade de estudo?', () => {
        AppState.atividadesEstudo = AppState.atividadesEstudo.filter((x) => x.id !== id);
        saveState();
        renderRoute('estudo');
      });
    }

    function openCursoModal() {
      openModal(
        'Novo Curso',
        `<form id="curso-form" class="space-y-3 text-xs">
          <div><label class="font-semibold">Nome do Curso *</label><input name="nome" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="font-semibold">Instituição</label><input name="instituicao" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Carga Horária</label><input name="cargaHoraria" placeholder="ex: 40h" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          </div>
        </form>`,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="curso-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar</button>`
      );
      document.getElementById('curso-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        AppState.cursos.push({ id: generateId('CUR'), nome: fd.get('nome').trim(), instituicao: fd.get('instituicao').trim(), cargaHoraria: fd.get('cargaHoraria').trim(), status: 'Em andamento' });
        saveState();
        closeModal();
        renderRoute('estudo');
      };
    }

    function openDisciplinaModal() {
      const cursos = AppState.cursos || [];
      if (cursos.length === 0) {
        showToast('Cadastre pelo menos um Curso antes de criar uma Disciplina.', 'warning');
        return;
      }
      openModal(
        'Nova Disciplina',
        `<form id="disciplina-form" class="space-y-3 text-xs">
          <div>
            <label class="font-semibold">Curso Vinculado *</label>
            <select name="cursoId" required class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">
              <option value="">Selecione um curso...</option>
              ${cursos.map((c) => `<option value="${c.id}">${escapeHTML(c.nome)}</option>`).join('')}
            </select>
          </div>
          <div><label class="font-semibold">Nome da Disciplina *</label><input name="nome" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
        </form>`,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>

          <div class="grid grid-cols-2 gap-2">
            <div><strong>Cliente:</strong> ${escapeHTML(o.clienteNome)}</div>
            <div><strong>Telefone:</strong> ${escapeHTML(o.telefone || '—')}</div>
            <div class="col-span-2"><strong>Equipamento:</strong> ${escapeHTML(o.equipamento)}</div>
            <div class="col-span-2"><strong>Defeito Relatado:</strong> ${escapeHTML(o.defeito)}</div>
            <div class="col-span-2"><strong>Serviço Executado:</strong> ${escapeHTML(o.servicoExecutado || '—')}</div>
            <div><strong>Status:</strong> ${escapeHTML(o.status)}</div>
            <div class="text-right text-sm font-black">Valor Total: ${formatCurrency(o.valor)}</div>
          </div>
          <div class="grid grid-cols-2 gap-8 pt-10 text-center">
            <div class="border-t border-slate-600 pt-1">CONTECH Contabilidade &amp; Informática</div>
            <div class="border-t border-slate-600 pt-1">Assinatura do Cliente</div>
          </div>
        </div>
      `;
      window.print();
    }

    // =========================================================================
    // 11. CENTRAL DE RELATÓRIOS
    // =========================================================================
    let ReportFilter = {
      type: 'fluxo',
      q: '',
      startDate: '',
      endDate: '',
      status: '',
      secretaria: ''
    };

    function resetReportFilters() {
      ReportFilter = {
        type: ReportFilter.type,
        q: '',
        startDate: '',
        endDate: '',
        status: '',
        secretaria: ''
      };
      renderRoute('relatorios');
    }

    function renderRelatorios(container) {
      const { type, q, startDate, endDate, status, secretaria } = ReportFilter;
      const query = q.trim().toLowerCase();
      const inDateRange = (iso) => {
        if (!startDate && !endDate) return true;
        if (!iso) return false;
        const d = String(iso).slice(0, 10);
        if (startDate && d < startDate) return false;
        if (endDate && d > endDate) return false;
        return true;
      };
      const matchesText = (fields) => !query || fields.join(' ').toLowerCase().includes(query);

      let headers = [];
      let rows = [];
      let statusOptions = [];
      let totalResumo = '';

      if (type === 'fluxo') {
        statusOptions = ['Pendente', 'Pago', 'Recebido'];
        headers = ['Tipo', 'ID', 'Cliente / Fornecedor', 'Descrição / Categoria', 'Vencimento', 'Valor', 'Status'];
        const entradas = (AppState.contasReceber || [])
          .filter((r) => inDateRange(r.vencimento) && (!status || r.status === status) && matchesText(['Entrada', r.id, r.cliente, r.descricao, r.status]))
          .map((r) => ({ tipo: 'Entrada (+)', id: r.id, pessoa: r.cliente, desc: r.descricao, data: r.vencimento, valor: Number(r.valor || 0), status: r.status }));
        const saidas = (AppState.contasPagar || [])
          .filter((p) => inDateRange(p.vencimento) && (!status || p.status === status) && matchesText(['Saída', p.id, p.descricao, p.categoria, p.status]))
          .map((p) => ({ tipo: 'Saída (-)', id: p.id, pessoa: p.descricao, desc: p.categoria, data: p.vencimento, valor: Number(p.valor || 0), status: p.status }));
        const all = [...entradas, ...saidas].sort((a, b) => (a.data || '').localeCompare(b.data || ''));
        const totEnt = entradas.reduce((s, x) => s + x.valor, 0);
        const totSai = saidas.reduce((s, x) => s + x.valor, 0);
        totalResumo = `Entradas: ${formatCurrency(totEnt)} • Saídas: ${formatCurrency(totSai)} • Saldo Líquido: ${formatCurrency(totEnt - totSai)}`;
        rows = all.map((x) => [x.tipo, x.id, x.pessoa, x.desc, formatDateBR(x.data), formatCurrency(x.valor), x.status]);
      } else if (type === 'receber') {
        statusOptions = ['Pendente', 'Recebido'];
        headers = ['ID', 'Cliente', 'Descrição', 'Parcela', 'Vencimento', 'Valor', 'Status'];
        const list = (AppState.contasReceber || [])
          .filter((r) => inDateRange(r.vencimento) && (!status || r.status === status) && matchesText([r.id, r.cliente, r.descricao, r.parcela, r.status]));
        const tot = list.reduce((s, x) => s + Number(x.valor || 0), 0);
        totalResumo = `Registros: ${list.length} • Valor Total Filtrado: ${formatCurrency(tot)}`;
        rows = list.map((r) => [r.id, r.cliente, r.descricao, r.parcela || '1/1', formatDateBR(r.vencimento), formatCurrency(r.valor), r.status]);
      } else if (type === 'pagar') {
        statusOptions = ['Pendente', 'Pago'];
        headers = ['ID', 'Descrição', 'Categoria', 'Parcela', 'Vencimento', 'Valor', 'Status'];
        const list = (AppState.contasPagar || [])
          .filter((p) => inDateRange(p.vencimento) && (!status || p.status === status) && matchesText([p.id, p.descricao, p.categoria, p.parcela, p.status]));
        const tot = list.reduce((s, x) => s + Number(x.valor || 0), 0);
        totalResumo = `Registros: ${list.length} • Valor Total Filtrado: ${formatCurrency(tot)}`;
        rows = list.map((p) => [p.id, p.descricao, p.categoria, p.parcela || '1/1', formatDateBR(p.vencimento), formatCurrency(p.valor), p.status]);
      } else if (type === 'contabeis' || type === 'gerais') {
        statusOptions = REGIMES;
        const source = type === 'contabeis' ? (AppState.clientesContabeis || []) : (AppState.clientesGerais || []);
        headers = ['ID', 'ID Alterdata', 'Nome / Razão Social', 'CNPJ / CPF', 'Regime Tributário', 'Celular', 'Venc. Certificado'];
        const list = source.filter((c) => inDateRange(c.dataAbertura) && (!status || c.regimeTributario === status) && matchesText([c.id, c.idAlterdata, c.nomeRazao, c.cnpj, c.cpf, c.regimeTributario, c.celular, c.email]));
        totalResumo = `Total de Clientes Filtrados: ${list.length}`;
        rows = list.map((c) => [c.id, c.idAlterdata || '—', c.nomeRazao, c.cnpj || c.cpf || '—', c.regimeTributario, c.celular || '—', formatDateBR(c.certificadoVencimento)]);
      } else if (type === 'certificados') {
        statusOptions = ['Vencido', 'A Vencer (≤ 30d)', 'Em Dia'];
        headers = ['Cliente / Razão Social', 'CNPJ / CPF', 'Origem', 'Vencimento', 'Situação'];
        const all = [
          ...(AppState.clientesContabeis || []).map((c) => ({ ...c, origem: 'Contábil' })),
          ...(AppState.clientesGerais || []).map((c) => ({ ...c, origem: 'Geral / TI' }))
        ]
          .filter((c) => c.certificadoVencimento && inDateRange(c.certificadoVencimento))
          .map((c) => {
            const diff = daysUntil(c.certificadoVencimento);
            const sit = diff < 0 ? 'Vencido' : diff <= 30 ? 'A Vencer (≤ 30d)' : 'Em Dia';
            return { ...c, diff, sit };
          })
          .filter((c) => (!status || c.sit === status) && matchesText([c.nomeRazao, c.cnpj, c.cpf, c.origem, c.sit]));
        totalResumo = `Total de Certificados Filtrados: ${all.length}`;
        rows = all.map((c) => [c.nomeRazao, c.cnpj || c.cpf || '—', c.origem, formatDateBR(c.certificadoVencimento), `${c.sit} (${c.diff}d)`]);
      } else if (type === 'pmi') {
        statusOptions = PMI_STATUSES;
        headers = ['Data', 'Secretaria', 'Serviço', 'Complemento', 'Empenho / NF', 'Valor', 'Status'];
        const list = (AppState.servicosPmi || [])
          .filter((p) => inDateRange(p.data) && (!status || p.status === status) && (!secretaria || p.secretaria === secretaria) && matchesText([p.secretaria, p.servico, p.complemento, p.empenho, p.nf, p.status]));
        const tot = list.reduce((s, x) => s + Number(x.valor || 0), 0);
        totalResumo = `Serviços Filtrados: ${list.length} • Valor Total: ${formatCurrency(tot)}`;
        rows = list.map((p) => [formatDateBR(p.data), p.secretaria, p.servico, p.complemento || '—', `${p.empenho || '—'} / ${p.nf || '—'}`, formatCurrency(p.valor), p.status]);
      } else if (type === 'os') {
        statusOptions = OS_STATUSES;
        headers = ['Nº OS', 'Data', 'Cliente', 'Equipamento', 'Serviço Executado', 'Valor', 'Status'];
        const list = (AppState.ordensServico || [])
          .filter((o) => inDateRange(o.data) && (!status || o.status === status) && matchesText([o.id, o.clienteNome, o.equipamento, o.defeito, o.servicoExecutado, o.status]));
        const tot = list.reduce((s, x) => s + Number(x.valor || 0), 0);
        totalResumo = `Ordens Filtradas: ${list.length} • Faturamento Total: ${formatCurrency(tot)}`;
        rows = list.map((o) => [o.id, formatDateBR(o.data), o.clienteNome, o.equipamento, o.servicoExecutado || o.defeito, formatCurrency(o.valor), o.status]);
      } else if (type === 'tarefas') {
        statusOptions = ['Pendente', 'Em andamento', 'Concluído'];
        headers = ['Tarefa', 'Área', 'Prioridade', 'Prazo', 'Status'];
        const list = (AppState.tarefas || [])
          .filter((t) => inDateRange(t.prazo) && (!status || t.status === status) && matchesText([t.titulo, t.area, t.prioridade, t.status]));
        totalResumo = `Total de Tarefas Filtradas: ${list.length}`;
        rows = list.map((t) => [t.titulo, t.area, t.prioridade, formatDateBR(t.prazo), t.status]);
      } else {
        statusOptions = ['Pendente', 'Em Andamento', 'Concluída'];
        headers = ['Data', 'Curso', 'Disciplina', 'Atividade', 'Status'];
        const list = (AppState.atividadesEstudo || [])
          .filter((a) => inDateRange(a.data) && (!status || a.status === status) && matchesText([a.titulo, a.status]))
          .map((a) => {
            const c = (AppState.cursos || []).find((x) => x.id === a.cursoId);
            const d = (AppState.disciplinas || []).find((x) => x.id === a.disciplinaId);
            return [formatDateBR(a.data), c ? c.nome : '—', d ? d.nome : '—', a.titulo, a.status];
          });
        totalResumo = `Total de Atividades Filtradas: ${list.length}`;
        rows = list;
      }

      const secretariasUnicas = Array.from(new Set((AppState.servicosPmi || []).map((p) => p.secretaria).filter(Boolean)));
      const reportTitleObj = REPORT_TYPES.find((r) => r.id === type);

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">Central de Relatórios</h2>
            <p class="text-xs sm:text-sm text-slate-600">Filtre por módulo, período, status e palavra-chave para gerar prévia, CSV ou PDF.</p>
          </div>
          <div class="flex flex-wrap gap-2 text-xs">
            <button type="button" onclick="resetReportFilters()" class="px-3.5 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold cursor-pointer">Limpar Filtros</button>
            <button type="button" onclick='downloadCSV("relatorio_${type}.csv", ${JSON.stringify(headers)}, ${JSON.stringify(rows)})' class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold cursor-pointer">Exportar CSV</button>
            <button type="button" onclick="printCurrentReport()" class="px-3.5 py-2 rounded-xl bg-navy-900 text-white font-bold cursor-pointer">Imprimir / PDF</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 border shadow-sm space-y-3 text-xs">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
            <div class="lg:col-span-2">
              <label class="font-bold block mb-1 text-slate-700">Tipo de Relatório</label>
              <select onchange="ReportFilter.type = this.value; ReportFilter.status = ''; ReportFilter.secretaria = ''; renderRoute('relatorios');" class="w-full px-3 py-2 rounded-xl border bg-white font-semibold">
                ${REPORT_TYPES.map((r) => `<option value="${r.id}" ${type === r.id ? 'selected' : ''}>${r.label}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold block mb-1 text-slate-700">Data Inicial</label>
              <input type="date" value="${escapeHTML(startDate)}" onchange="ReportFilter.startDate = this.value; renderRoute('relatorios');" class="w-full px-3 py-2 rounded-xl border" />
            </div>
            <div>
              <label class="font-bold block mb-1 text-slate-700">Data Final</label>
              <input type="date" value="${escapeHTML(endDate)}" onchange="ReportFilter.endDate = this.value; renderRoute('relatorios');" class="w-full px-3 py-2 rounded-xl border" />
            </div>
            <div>
              <label class="font-bold block mb-1 text-slate-700">${type === 'contabeis' || type === 'gerais' ? 'Regime Tributário' : 'Status / Situação'}</label>
              <select onchange="ReportFilter.status = this.value; renderRoute('relatorios');" class="w-full px-3 py-2 rounded-xl border bg-white">
                <option value="">Todos</option>
                ${statusOptions.map((st) => `<option value="${escapeHTML(st)}" ${status === st ? 'selected' : ''}>${escapeHTML(st)}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="${type === 'pmi' ? 'sm:col-span-2' : 'sm:col-span-3'}">
              <label class="font-bold block mb-1 text-slate-700">Busca Textual no Relatório</label>
              <input id="search-relatorios" type="text" value="${escapeHTML(q)}" oninput="ReportFilter.q = this.value; renderRoute('relatorios');" placeholder="Filtrar por nome, cliente, descrição, documento, equipamento..." class="w-full px-3 py-2 rounded-xl border" />
            </div>
            ${type === 'pmi' ? `
              <div>
                <label class="font-bold block mb-1 text-slate-700">Secretaria (PMI)</label>
                <select onchange="ReportFilter.secretaria = this.value; renderRoute('relatorios');" class="w-full px-3 py-2 rounded-xl border bg-white">
                  <option value="">Todas as Secretarias</option>
                  ${secretariasUnicas.map((sec) => `<option value="${escapeHTML(sec)}" ${secretaria === sec ? 'selected' : ''}>${escapeHTML(sec)}</option>`).join('')}
                </select>
              </div>
            ` : ''}
          </div>
        </div>

        <div id="report-preview-box" class="bg-white rounded-2xl border shadow-sm overflow-hidden">
          <div class="px-4 py-3 bg-slate-50 border-b flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 text-xs">
            <span class="font-extrabold text-navy-900">${escapeHTML(reportTitleObj ? reportTitleObj.label : 'Relatório')}</span>
            <span class="font-bold text-emerald-700">${escapeHTML(totalResumo)}</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs text-left">
              <thead class="bg-navy-900 text-white uppercase text-[11px]">
                <tr>${headers.map((h) => `<th class="px-4 py-3">${escapeHTML(h)}</th>`).join('')}</tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${rows.length === 0 ? `<tr><td colspan="${headers.length}" class="px-4 py-6 text-center text-slate-400">Nenhum registro encontrado para os filtros selecionados.</td></tr>` : rows.map((r) => `<tr>${r.map((cell) => `<td class="px-4 py-2.5">${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function printCurrentReport() {
      const box = document.getElementById('report-preview-box');
      const area = document.getElementById('print-area');
      if (!box || !area) return;
      const periodoTxt = (ReportFilter.startDate || ReportFilter.endDate)
        ? `Período: ${formatDateBR(ReportFilter.startDate)} a ${formatDateBR(ReportFilter.endDate)}`
        : 'Período: Geral';
      area.innerHTML = `<div class="space-y-4"><div class="flex items-center justify-between border-b pb-3">${getContechLogoSVG(true)}<div class="text-right text-xs font-bold"><div>Relatório Gerencial • ${formatDateBR(new Date().toISOString().slice(0, 10))}</div><div class="text-[11px] font-normal text-slate-600">${periodoTxt}</div></div></div>${box.innerHTML}</div>`;
      window.print();
    }

    // Inicialização segura após carregamento completo da página
    function bootstrapApp() {
      try {
        syncAuthScreen();
      } catch (err) {
        console.error('Erro ao inicializar CONTECH ERP:', err);
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(SESSION_KEY);
        AppState = createInitialState();
        syncAuthScreen();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrapApp);
    } else {
      bootstrapApp();
    }
  </script>
</body>
</html>
