    function generateId(prefix = 'ID') {
      return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.floor(100 + Math.random() * 900)}`;
    }

    function addDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function addMonthsISO(isoDate, monthsToAdd) {
      const [y, m, d] = (isoDate || new Date().toISOString().slice(0, 10)).split('-').map(Number);
      const dt = new Date(y, m - 1 + monthsToAdd, d);
      return dt.toISOString().slice(0, 10);
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDateBR(iso) {
      if (!iso) return '—';
      const parts = String(iso).slice(0, 10).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : iso;
    }

    function daysUntil(iso) {
      if (!iso) return null;
      const target = new Date(`${String(iso).slice(0, 10)}T00:00:00`);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    function showToast(msg, type = 'success') {
      const box = document.getElementById('toast-container');
      if (!box) return;
      const el = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-600' : 'bg-navy-900';
      el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 pointer-events-auto`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function openModal(title, bodyHTML, footerHTML = '') {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHTML;
      document.getElementById('modal-footer').innerHTML =
        footerHTML || `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-navy-900 text-white text-xs font-bold cursor-pointer">Fechar</button>`;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function askConfirm(title, message, onConfirm) {
      openModal(
        title,
        `<p class="text-xs sm:text-sm text-slate-700">${escapeHTML(message)}</p>`,

    function downloadCSV(filename, headers, rows) {
      const csv = [headers, ...rows]
        .map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'))
        .join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function syncAuthScreen() {
      const loginLogo = document.getElementById('login-logo-box');
      if (loginLogo && !loginLogo.innerHTML) loginLogo.innerHTML = getContechLogoSVG(false);
      const sideLogo = document.getElementById('sidebar-logo-box');
      if (sideLogo && !sideLogo.innerHTML) sideLogo.innerHTML = getContechLogoSVG(true);

      const session = getActiveSession();
      const authEl = document.getElementById('auth-screen');
      const shellEl = document.getElementById('app-shell');

      if (!session) {
        authEl.classList.remove('hidden');
        shellEl.classList.add('hidden');
        return;
      }

      authEl.classList.add('hidden');
      shellEl.classList.remove('hidden');
      document.getElementById('current-user-name').textContent = session.name || session.username;
      document.getElementById('current-user-role').textContent = session.role || 'Operador';
      renderSidebar();
      renderRoute(ActiveRoute);
      setupAutoSync();
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const errBox = document.getElementById('login-error');

      const found = (AppState.users || []).find((u) => u.username === username && u.password === password);
      if (!found) {
        errBox.textContent = 'Usuário ou senha inválidos.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      const sessionData = JSON.stringify({ id: found.id, username: found.username, name: found.name, role: found.role });
      if (remember) {
        localStorage.setItem(SESSION_KEY, sessionData);
        sessionStorage.removeItem(SESSION_KEY);
      } else {
        sessionStorage.setItem(SESSION_KEY, sessionData);
        localStorage.removeItem(SESSION_KEY);
      }
      syncAuthScreen();
    });

    function logoutUser() {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      syncAuthScreen();

    function openClientFicha(kind, id) {

        `Ficha Completa — ${c.nomeRazao}`,

        id: generateId(isContabil ? 'CC' : 'CG'),
        idAlterdata: '', nomeRazao: '', cpf: '', rg: '', cnh: '', tituloEleitor: '', dataNascimento: '',
        celular: '', email: '', cnpj: '', inscricaoEstadual: '', inscricaoMunicipal: '', dataAbertura: '',
        regimeTributario: 'Simples Nacional', capitalSocial: 0, producoes: [], parcelamentos: [],
        obrigacoes: { EFD: 'Pendente', MIT: 'N/A', DEFIS: 'Pendente', DASN: 'N/A' },
        certificadoVencimento: '', senhas: { gov: '', nfse: '', email: '' }
      };

      openModal(

            <div><label class="font-semibold">CNPJ</label><input name="cnpj" value="${escapeHTML(c.cnpj || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">CPF</label><input name="cpf" value="${escapeHTML(c.cpf || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">RG</label><input name="rg" value="${escapeHTML(c.rg || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">CNH</label><input name="cnh" value="${escapeHTML(c.cnh || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Título de Eleitor</label><input name="tituloEleitor" value="${escapeHTML(c.tituloEleitor || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>

            <div><label class="font-semibold">Senha NFSe</label><input name="senhaNfse" value="${escapeHTML(c.senhas?.nfse || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>

        const fd = new FormData(e.target);
        const rec = {
          id: fd.get('id').trim(),
          idAlterdata: fd.get('idAlterdata').trim(),
          nomeRazao: fd.get('nomeRazao').trim(),
          cpf: fd.get('cpf').trim(),
          rg: fd.get('rg').trim(),
          cnh: fd.get('cnh').trim(),
          tituloEleitor: fd.get('tituloEleitor').trim(),
          dataNascimento: fd.get('dataNascimento'),
          celular: fd.get('celular').trim(),
          email: fd.get('email').trim(),
          cnpj: fd.get('cnpj').trim(),
          inscricaoEstadual: fd.get('inscricaoEstadual').trim(),
          inscricaoMunicipal: fd.get('inscricaoMunicipal').trim(),
          dataAbertura: fd.get('dataAbertura'),
          regimeTributario: fd.get('regimeTributario'),

          producoes: fd.getAll('producoes'),

        };
        const targetArr = isContabil ? AppState.clientesContabeis : AppState.clientesGerais;

          const idx = targetArr.findIndex((x) => x.id === editId);
          if (idx >= 0) targetArr[idx] = rec;
        } else {
          targetArr.unshift(rec);
        }
        saveState();
        closeModal();
        renderRoute(kind);
        showToast('Cadastro salvo com sucesso!');
      };
    }

    function deleteClient(kind, id) {
      askConfirm('Excluir Cliente', 'Deseja excluir este cadastro?', () => {
        if (kind === 'contabeis') AppState.clientesContabeis = AppState.clientesContabeis.filter((x) => x.id !== id);
        else AppState.clientesGerais = AppState.clientesGerais.filter((x) => x.id !== id);
        saveState();
        renderRoute(kind);
      });
    }

    function exportClientsCSV(kind) {
      const list = kind === 'contabeis' ? AppState.clientesContabeis : AppState.clientesGerais;
      const headers = ['ID', 'ID_Alterdata', 'Nome_Razao', 'CPF', 'CNPJ', 'Regime', 'Celular', 'Email', 'Certificado'];
      const rows = (list || []).map((c) => [c.id, c.idAlterdata, c.nomeRazao, c.cpf, c.cnpj, c.regimeTributario, c.celular, c.email, c.certificadoVencimento]);
      downloadCSV(`clientes_${kind}_contech.csv`, headers, rows);
    }

    // =========================================================================
    // 4. GESTÃO FINANCEIRA (CONTAS A PAGAR & RECEBER COM ALTERAÇÃO EM LOTE)
    // =========================================================================
    let selectedFinIds = { pagar: new Set(), receber: new Set() };

    function toggleFinSelection(kind, id, checked) {
      if (checked) selectedFinIds[kind].add(id);
      else selectedFinIds[kind].delete(id);
      renderRoute(kind);
    }

    function toggleFinSectionAll(kind, ids, checked) {
      ids.forEach((id) => {
        if (checked) selectedFinIds[kind].add(id);
        else selectedFinIds[kind].delete(id);
      });
      renderRoute(kind);
    }

    function batchSettleFin(kind, targetStatus) {
      const isPagar = kind === 'pagar';
      const arr = isPagar ? AppState.contasPagar : AppState.contasReceber;
      const today = new Date().toISOString().slice(0, 10);
      arr.forEach((item) => {
        if (selectedFinIds[kind].has(item.id)) {
          item.status = targetStatus;
          if (isPagar) item.dataPagamento = targetStatus === 'Pago' ? today : '';
          else item.dataRecebimento = targetStatus === 'Recebido' ? today : '';
        }
      });
      selectedFinIds[kind].clear();
      saveState();
      renderRoute(kind);
      showToast(`Lançamentos atualizados para ${targetStatus}!`);
    }

    function batchDeleteFin(kind) {
      const count = selectedFinIds[kind].size;
      if (!count) return;
      askConfirm('Excluir em Lote', `Deseja excluir ${count} lançamento(s) selecionado(s)?`, () => {
        if (kind === 'pagar') AppState.contasPagar = AppState.contasPagar.filter((x) => !selectedFinIds.pagar.has(x.id));
        else AppState.contasReceber = AppState.contasReceber.filter((x) => !selectedFinIds.receber.has(x.id));
        selectedFinIds[kind].clear();
        saveState();
        renderRoute(kind);
        showToast(`${count} lançamento(s) excluído(s).`);
      });
    }

    function openBatchEditFinModal(kind) {
      const isPagar = kind === 'pagar';
      const count = selectedFinIds[kind].size;
      if (!count) return;
      openModal(
        `Alterar ${count} Lançamento(s) em Lote`,
        `

            <div><label class="font-semibold">Novo Vencimento</label><input type="date" name="vencimento" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Novo Valor (R$)</label><input type="number" step="0.01" name="valor" placeholder="Deixe vazio para manter" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            ${isPagar ? `<div><label class="font-semibold">Nova Categoria</label><select name="categoria" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white"><option value="">Manter atual</option>${DESPESA_CATEGORIAS.map((c) => `<option>${c}</option>`).join('')}</select></div>` : ''}

          </form>
        `,
        `

    // =========================================================================
    // 7. BUSCA & MONITORAMENTO DE LICITAÇÕES (20 PORTAIS INTEGRADOS)
    // =========================================================================
    let licitacaoFilter = {
      query: '',
      uf: 'PB',
      portal: '',
      modalidade: '',
      maxDate: '',
      minVal: '',
      maxVal: '',
      sort: 'recentes'
    };
    let liveTenderResults = [];
    let liveTenderSources = [];
    let isFetchingTenders = false;

    function detectTenderPortal(it) {
      const sig = [
        it.usuarioNome || '',
        it.sistemaOrigem || '',
        it.linkSistemaOrigem || '',
        it.orgaoEntidade?.razaoSocial || '',
        it.unidadeOrgao?.ufSigla || ''
      ].join(' ').toLowerCase();

      if (sig.includes('compras.gov') || sig.includes('comprasnet') || sig.includes('siasg')) return 'Compras.gov.br (ComprasNet)';
      if (sig.includes('licitacoes-e') || sig.includes('banco do brasil')) return 'Licitações-e (Banco do Brasil)';
      if (sig.includes('caixa')) return 'Portal de Compras da Caixa';
      if (sig.includes('portaldecompraspublicas') || sig.includes('compras públicas')) return 'Portal de Compras Públicas';
      if (sig.includes('bll')) return 'BLL Compras';
      if (sig.includes('licitanet')) return 'Licitanet';
      if (sig.includes('bnc') || sig.includes('bolsa nacional')) return 'BNC (Bolsa Nacional de Compras)';
      if (sig.includes('licitamais') || sig.includes('licita+brasil')) return 'Licita+Brasil';
      if (sig.includes('comprasbr')) return 'ComprasBR';
      if (sig.includes('bbmnet')) return 'BBMNET';
      if (sig.includes('bec.sp') || sig.includes('bolsa eletrônica de compras')) return 'BEC/SP (Bolsa Eletrônica de Compras de São Paulo)';
      if (sig.includes('compras.mg')) return 'Portal de Compras MG';
      if (sig.includes('compras.rs') || sig.includes('celic')) return 'Compras RS';
      if (sig.includes('compras.rj') || sig.includes('siga')) return 'Compras RJ';
      if (sig.includes('seap') || sig.includes('comprasparana')) return 'SEAP-PR';
      if (sig.includes('sislog') || sig.includes('comprasnet.go')) return 'SISLOG (Goiás)';
      if (sig.includes('compras.mt') || sig.includes('siag')) return 'Compras MT';
      if (sig.includes('centraldecompras.pb') || sig.includes('paraíba') || sig.includes('governo do estado da paraiba')) return 'Portal de Compras PB (Paraíba)';
      if (sig.includes('tce.pb') || sig.includes('tramita')) return 'TCE PB';
      return 'Portal Nacional de Contratações Públicas (PNCP)';
    }

    async function fetchAllTendersFromAPIs() {
      if (isFetchingTenders) return;
      isFetchingTenders = true;
      liveTenderSources = [];
      renderRoute('licitacoes');

      const uf = licitacaoFilter.uf.trim().toUpperCase();
      const kw = licitacaoFilter.query.trim().toLowerCase();
      const aggregated = [];

      const tasks = [];

      // 1. PNCP - Propostas Abertas (paginado até 3 páginas)
      tasks.push((async () => {
        try {
          const dataFinal = addDaysISO(90).replace(/-/g, '');
          const ufQuery = uf ? `&uf=${encodeURIComponent(uf)}` : '';
          let count = 0;
          for (let pag = 1; pag <= 3; pag++) {
            const url = `https://pncp.gov.br/api/consulta/v1/contratacoes/proposta?dataFinal=${dataFinal}${ufQuery}&pagina=${pag}&tamanhoPagina=100`;
            const res = await fetch(url);
            if (!res.ok) break;
            const json = await res.json();
            const rows = json.data || [];
            if (!rows.length) break;
            rows.forEach((it) => {
              const cnpj = it.orgaoEntidade?.cnpj || '';
              const ano = it.anoCompra || '';
              const seq = it.sequencialCompra || '';
              aggregated.push({
                id: it.numeroControlePNCP || `PNCP-${cnpj}-${ano}-${seq}`,
                numeroEdital: `${it.numeroCompra || 'S/N'}/${ano || new Date().getFullYear()}`,
                orgao: it.orgaoEntidade?.razaoSocial || 'Órgão Público',
                municipio: it.unidadeOrgao?.municipioNome || '',
                portal: detectTenderPortal(it),
                uf: it.unidadeOrgao?.ufSigla || uf || 'BR',
                modalidade: it.modalidadeNome || 'Pregão Eletrônico',
                objeto: it.objetoCompra || '',
                valorEstimado: Number(it.valorTotalEstimado || 0),
                dataAbertura: String(it.dataAberturaProposta || it.dataPublicacaoPncp || '').slice(0, 10),
                link: it.linkSistemaOrigem || (cnpj && ano && seq ? `https://pncp.gov.br/app/editais/${cnpj}/${ano}/${seq}` : 'https://pncp.gov.br/app/editais')
              });
              count++;
            });
            if (rows.length < 100) break;
          }
          liveTenderSources.push({ label: 'PNCP (Propostas + Portais Integrados)', count, ok: true });
        } catch (err) {
          liveTenderSources.push({ label: 'PNCP (Propostas)', count: 0, ok: false });
        }
      })());

      // 2. PNCP - Publicações Recentes (Pregão = 6 e Dispensa = 8)
      tasks.push((async () => {
        try {
          const dtIni = addDaysISO(-10).replace(/-/g, '');
          const dtFim = addDaysISO(0).replace(/-/g, '');
          const ufQuery = uf ? `&uf=${encodeURIComponent(uf)}` : '';
          let count = 0;
          for (const mod of [6, 8]) {
            const url = `https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao?dataInicial=${dtIni}&dataFinal=${dtFim}&codigoModalidadeContratacao=${mod}${ufQuery}&pagina=1&tamanhoPagina=80`;
            const res = await fetch(url);
            if (!res.ok) continue;
            const json = await res.json();
            (json.data || []).forEach((it) => {
              const cnpj = it.orgaoEntidade?.cnpj || '';
              const ano = it.anoCompra || '';
              const seq = it.sequencialCompra || '';
              aggregated.push({
                id: it.numeroControlePNCP || `PNCP-PUB-${cnpj}-${ano}-${seq}`,
                numeroEdital: `${it.numeroCompra || 'S/N'}/${ano || new Date().getFullYear()}`,
                orgao: it.orgaoEntidade?.razaoSocial || 'Órgão Público',
                municipio: it.unidadeOrgao?.municipioNome || '',
                portal: detectTenderPortal(it),
                uf: it.unidadeOrgao?.ufSigla || uf || 'BR',
                modalidade: it.modalidadeNome || (mod === 6 ? 'Pregão Eletrônico' : 'Dispensa'),
                objeto: it.objetoCompra || '',
                valorEstimado: Number(it.valorTotalEstimado || 0),
                dataAbertura: String(it.dataAberturaProposta || it.dataPublicacaoPncp || '').slice(0, 10),
                link: it.linkSistemaOrigem || (cnpj && ano && seq ? `https://pncp.gov.br/app/editais/${cnpj}/${ano}/${seq}` : 'https://pncp.gov.br/app/editais')
              });
              count++;
            });
          }
          liveTenderSources.push({ label: 'PNCP (Publicações Recentes)', count, ok: true });
        } catch (err) {
          liveTenderSources.push({ label: 'PNCP (Publicações)', count: 0, ok: false });
        }
      })());

      // 3. Compras.gov.br (ComprasNet)
      tasks.push((async () => {
        try {
          const dataMin = addDaysISO(-20);
          const ufQuery = uf ? `&uf=${encodeURIComponent(uf)}` : '';
          const url = `https://compras.dados.gov.br/licitacoes/v1/licitacoes.json?data_publicacao_min=${dataMin}${ufQuery}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const json = await res.json();
          const rows = json._embedded?.licitacoes || [];
          rows.slice(0, 60).forEach((lic, idx) => {
            aggregated.push({
              id: `COMPRASGOV-${lic.identificador || idx}`,
              numeroEdital: `Aviso ${lic.numero_aviso || idx + 1}`,
              orgao: `UASG ${lic.uasg || ''} — Compras.gov.br`,
              municipio: '',
              portal: 'Compras.gov.br (ComprasNet)',
              uf: lic.uf || uf || 'BR',
              modalidade: lic.modalidade ? `Modalidade ${lic.modalidade}` : 'Pregão Eletrônico',
              objeto: lic.objeto || 'Licitação publicada no portal Compras.gov.br.',
              valorEstimado: Number(lic.valor_estimado_total || 0),
              dataAbertura: String(lic.data_abertura_proposta || lic.data_publicacao || '').slice(0, 10),
              link: 'https://www.gov.br/compras/pt-br'
            });
          });
          liveTenderSources.push({ label: 'Compras.gov.br', count: rows.slice(0, 60).length, ok: true });
        } catch (err) {
          liveTenderSources.push({ label: 'Compras.gov.br', count: 0, ok: false });
        }
      })());

      // 4. TCE-PB & Portal de Compras PB (quando UF for PB ou vazio)
      if (!uf || uf === 'PB') {
        tasks.push((async () => {
          try {
            const url = 'https://dados.tce.pb.gov.br/api/3/action/package_search?q=licitacoes&rows=15';
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            const pkgs = json.result?.results || [];
            pkgs.forEach((pkg, idx) => {
              const resUrl = pkg.resources?.[0]?.url || 'https://tramita.tce.pb.gov.br';
              aggregated.push({
                id: `TCEPB-${pkg.id || idx}`,
                numeroEdital: pkg.name || `TCE-PB-${idx + 1}`,
                orgao: 'TCE-PB — Tribunal de Contas do Estado da Paraíba',
                municipio: 'Paraíba',
                portal: 'TCE PB',
                uf: 'PB',
                modalidade: 'Mural / Dados Abertos TCE-PB',
                objeto: `${pkg.title}${pkg.notes ? ' — ' + pkg.notes.slice(0, 160) : ''}`,
                valorEstimado: 0,
                dataAbertura: String(pkg.metadata_modified || '').slice(0, 10),
                link: resUrl
              });
            });
            liveTenderSources.push({ label: 'TCE-PB (Tramita / Dados Abertos)', count: pkgs.length, ok: true });
          } catch (err) {
            liveTenderSources.push({ label: 'TCE-PB', count: 0, ok: false });
          }
        })());

        tasks.push((async () => {
          try {
            const dtIniPb = addDaysISO(-30).replace(/-/g, '');
            const dtFimPb = addDaysISO(0).replace(/-/g, '');
            const url = `https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao?dataInicial=${dtIniPb}&dataFinal=${dtFimPb}&cnpj=08761124000100&pagina=1&tamanhoPagina=50`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            const rows = json.data || [];
            rows.forEach((it) => {
              const ano = it.anoCompra || '';
              const seq = it.sequencialCompra || '';
              aggregated.push({
                id: it.numeroControlePNCP || `COMPRA-PB-${ano}-${seq}`,
                numeroEdital: `${it.numeroCompra || 'S/N'}/${ano}`,
                orgao: it.orgaoEntidade?.razaoSocial || 'Governo do Estado da Paraíba',
                municipio: it.unidadeOrgao?.municipioNome || 'João Pessoa',
                portal: 'Portal de Compras PB (Paraíba)',
                uf: 'PB',
                modalidade: it.modalidadeNome || 'Pregão Eletrônico',
                objeto: it.objetoCompra || '',
                valorEstimado: Number(it.valorTotalEstimado || 0),
                dataAbertura: String(it.dataAberturaProposta || it.dataPublicacaoPncp || '').slice(0, 10),
                link: it.linkSistemaOrigem || 'https://centraldecompras.pb.gov.br'
              });
            });
            liveTenderSources.push({ label: 'Portal de Compras PB', count: rows.length, ok: true });
          } catch (err) {
            liveTenderSources.push({ label: 'Portal de Compras PB', count: 0, ok: false });
          }
        })());
      }

      // 5. Google Apps Script Proxy (se configurado)
      if (AppState.config?.gasUrl) {
        tasks.push((async () => {
          try {
            const url = `${AppState.config.gasUrl}?action=licitacoes&uf=${encodeURIComponent(uf)}&q=${encodeURIComponent(kw)}`;
            const res = await fetch(url);
            const json = await res.json();
            if (json.success && Array.isArray(json.items)) {
              json.items.forEach((it) => aggregated.push(it));
              liveTenderSources.push({ label: 'Google Apps Script (20 Portais)', count: json.items.length, ok: true });
            }
          } catch (err) {
            liveTenderSources.push({ label: 'Apps Script Proxy', count: 0, ok: false });
          }
        })());
      }

      await Promise.all(tasks);

      const dedup = new Map();
      aggregated.forEach((item) => {
        if (item.id && !dedup.has(item.id)) dedup.set(item.id, item);
      });
      liveTenderResults = Array.from(dedup.values());
      isFetchingTenders = false;
      renderRoute('licitacoes');
      showToast(`${liveTenderResults.length} licitações encontradas nos portais!`);
    }

    function filterTenderList(items) {
      const q = licitacaoFilter.query.trim().toLowerCase();
      const uf = licitacaoFilter.uf.trim().toUpperCase();
      const portal = licitacaoFilter.portal;
      const mod = licitacaoFilter.modalidade.trim().toLowerCase();
      const maxDate = licitacaoFilter.maxDate;
      const minVal = licitacaoFilter.minVal !== '' ? Number(licitacaoFilter.minVal) : null;
      const maxVal = licitacaoFilter.maxVal !== '' ? Number(licitacaoFilter.maxVal) : null;

      return items
        .filter((it) => {
          if (uf && String(it.uf || '').toUpperCase() !== uf) return false;
          if (portal && it.portal !== portal) return false;
          if (mod && !String(it.modalidade || '').toLowerCase().includes(mod)) return false;
          if (maxDate && it.dataAbertura && it.dataAbertura > maxDate) return false;
          if (minVal !== null && Number(it.valorEstimado || 0) < minVal) return false;
          if (maxVal !== null && Number(it.valorEstimado || 0) > maxVal) return false;
          if (q) {
            const hay = `${it.objeto} ${it.orgao} ${it.municipio || ''} ${it.numeroEdital} ${it.portal}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => {
          const da = String(a.dataAbertura || '');
          const db = String(b.dataAbertura || '');
          return licitacaoFilter.sort === 'longe' ? db.localeCompare(da) : da.localeCompare(db);
        });
    }

    function saveTenderToLocal(idx) {
      const filteredLive = filterTenderList(liveTenderResults);
      const item = filteredLive[idx];
      if (!item) return;
      if ((AppState.licitacoes || []).some((x) => x.id === item.id)) {
        showToast('Este edital já está salvo na sua base.', 'warning');
        return;
      }
      AppState.licitacoes.unshift({ ...item });
      saveState();
      renderRoute('licitacoes');
      showToast('Edital salvo na base monitorada!');
    }

    let reportFilter = { type: 'fluxo', startDate: '', endDate: '', status: '' };

    function buildReportDataset() {
      const { type, startDate, endDate, status } = reportFilter;
      const inRange = (d) => (!startDate || !d || d >= startDate) && (!endDate || !d || d <= endDate);

      if (type === 'receber') {
        const rows = (AppState.contasReceber || []).filter((r) => inRange(r.vencimento) && (!status || r.status === status));
        return {
          title: 'Relatório de Contas a Receber',
          headers: ['Cliente', 'Descrição', 'Parcela', 'Vencimento', 'Valor', 'Status'],
          rows: rows.map((r) => [r.cliente, r.descricao, r.parcela, formatDateBR(r.vencimento), formatCurrency(r.valor), r.status]),
          total: formatCurrency(rows.reduce((s, r) => s + Number(r.valor || 0), 0))
        };
      }
      if (type === 'pagar') {
        const rows = (AppState.contasPagar || []).filter((r) => inRange(r.vencimento) && (!status || r.status === status));
        return {
          title: 'Relatório de Contas a Pagar',
          headers: ['Descrição', 'Categoria', 'Parcela', 'Vencimento', 'Valor', 'Status'],
          rows: rows.map((r) => [r.descricao, r.categoria, r.parcela, formatDateBR(r.vencimento), formatCurrency(r.valor), r.status]),
          total: formatCurrency(rows.reduce((s, r) => s + Number(r.valor || 0), 0))
        };
      }
      if (type === 'contabeis' || type === 'gerais') {
        const src = type === 'contabeis' ? AppState.clientesContabeis || [] : AppState.clientesGerais || [];
        return {
          title: type === 'contabeis' ? 'Relatório de Clientes Contábeis' : 'Relatório de Clientes Gerais & TI',
          headers: ['ID', 'Nome / Razão Social', 'CNPJ / CPF', 'Regime', 'Celular', 'Certificado'],
          rows: src.map((c) => [c.id, c.nomeRazao, c.cnpj || c.cpf, c.regimeTributario, c.celular, formatDateBR(c.certificadoVencimento)]),
          total: `${src.length} cliente(s)`
        };
      }
      if (type === 'certificados') {
        const rows = getAllCertificates().filter((c) => inRange(c.vencimento));
        return {
          title: 'Relatório de Certificados Digitais',
          headers: ['Tipo', 'Cliente', 'Documento', 'Vencimento', 'Celular'],
          rows: rows.map((c) => [c.tipo, c.cliente, c.doc, formatDateBR(c.vencimento), c.celular]),
          total: `${rows.length} certificado(s)`
        };
      }
      if (type === 'pmi') {
        const rows = (AppState.servicosPmi || []).filter((r) => inRange(r.data) && (!status || r.status === status));
        return {
          title: 'Relatório de Serviços PMI — Prefeitura de Itaporanga',
          headers: ['Data', 'Secretaria', 'Serviço', 'Empenho / NF', 'Valor', 'Status'],
          rows: rows.map((r) => [formatDateBR(r.data), r.secretaria, r.servico, `${r.empenho || '-'} / ${r.nf || '-'}`, formatCurrency(r.valor), r.status]),
          total: formatCurrency(rows.reduce((s, r) => s + Number(r.valor || 0), 0))
        };
      }
      if (type === 'os') {
        const rows = (AppState.ordensServico || []).filter((o) => inRange(o.data) && (!status || o.status === status));
        return {
          title: 'Relatório de Ordens de Serviço (OS)',
          headers: ['Nº OS', 'Data', 'Cliente', 'Equipamento', 'Valor', 'Status'],
          rows: rows.map((o) => [o.id, formatDateBR(o.data), o.clienteNome, o.equipamento, formatCurrency(o.valor), o.status]),
          total: formatCurrency(rows.reduce((s, o) => s + Number(o.valor || 0), 0))
        };
      }
      if (type === 'tarefas') {
        const rows = (AppState.tarefas || []).filter((t) => inRange(t.prazo) && (!status || t.status === status));
        return {
          title: 'Relatório de Tarefas & Prazos',
          headers: ['Título', 'Área', 'Prioridade', 'Prazo', 'Status'],
          rows: rows.map((t) => [t.titulo, t.area, t.prioridade, formatDateBR(t.prazo), t.status]),
          total: `${rows.length} tarefa(s)`
        };
      }
      if (type === 'estudo') {
        const rows = (AppState.atividadesEstudo || []).filter((a) => inRange(a.data) && (!status || a.status === status));
        return {
          title: 'Relatório de Estudo & Capacitação',
          headers: ['Data', 'Atividade', 'Status'],
          rows: rows.map((a) => [formatDateBR(a.data), a.titulo, a.status]),
          total: `${rows.length} atividade(s)`
        };
      }

      // Fluxo Financeiro Consolidado
      const entries = [
        ...(AppState.contasReceber || []).map((r) => ({ data: r.vencimento, tipo: 'Entrada', desc: `${r.cliente} — ${r.descricao}`, valor: Number(r.valor || 0), status: r.status })),
        ...(AppState.contasPagar || []).map((p) => ({ data: p.vencimento, tipo: 'Saída', desc: p.descricao, valor: -Number(p.valor || 0), status: p.status }))
      ].filter((e) => inRange(e.data) && (!status || e.status === status));

      return {
        title: 'Fluxo Financeiro Consolidado',
        headers: ['Data', 'Tipo', 'Descrição', 'Valor', 'Status'],
        rows: entries.map((e) => [formatDateBR(e.data), e.tipo, e.desc, formatCurrency(e.valor), e.status]),
        total: formatCurrency(entries.reduce((s, e) => s + e.valor, 0))
      };
    }

    async function testGasConnection() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        showToast('Informe a URL /exec do Google Apps Script.', 'warning');
        return;
      }
      try {
        const res = await fetch(`${url}?action=test`);
        const json = await res.json();
        if (json.success) {
          AppState.config.lastSyncMessage = `Conectado: ${json.spreadsheet || 'Planilha CONTECH'}`;
          saveState();
          renderRoute('administracao');
          showToast('Conexão com Google Sheets validada!');
        } else {
          showToast(json.error || 'Falha na resposta do script.', 'error');
        }
      } catch (e) {
        showToast('Erro de rede ao conectar com o Apps Script.', 'error');
      }
    }

    async function syncAllToGas() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        showToast('Configure a URL /exec antes de sincronizar.', 'warning');
        return;
      }
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'syncAll', data: mapStateToSheetPayload() })
        });
        const json = await res.json();
        if (json.success) {
          AppState.config.lastSyncAt = new Date().toLocaleString('pt-BR');
          AppState.config.lastSyncMessage = json.message || 'Sincronizado com sucesso.';
          saveState();
          renderRoute('administracao');
          showToast('Todas as abas enviadas para o Google Sheets!');
        } else {
          showToast(json.error || 'Erro ao enviar dados.', 'error');
        }
      } catch (e) {
        showToast('Falha ao enviar dados para o Google Apps Script.', 'error');
      }
    }

    function setupAutoSync() {
      if (autoSyncTimer) clearInterval(autoSyncTimer);
      const mins = Number(AppState.config?.autoSyncMinutes || 0);
      if (mins > 0 && AppState.config?.gasUrl) {
        autoSyncTimer = setInterval(() => syncAllToGas(), mins * 60000);
      }
    }

      const blob = new Blob([JSON.stringify(AppState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_contech_erp_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackupJSON(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          AppState = { ...createInitialState(), ...parsed };
          saveState();
          renderRoute('administracao');
          showToast('Backup JSON restaurado com sucesso!');
        } catch (err) {
          showToast('Arquivo JSON inválido.', 'error');
        }
      };
      reader.readAsText(file);
    }

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl p-5 border shadow-sm space-y-4">
            <h3 class="text-sm font-extrabold text-navy-900">Integração Google Sheets (Apps Script /exec)</h3>
            <div class="space-y-2 text-xs">
              <label class="font-semibold block">URL do Web App (/exec)</label>
              <input type="url" value="${escapeHTML(cfg.gasUrl || '')}" onchange="AppState.config.gasUrl = this.value.trim(); saveState();" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 rounded-xl border" />
              <div class="text-[11px] text-slate-500">${escapeHTML(cfg.lastSyncMessage || '')} ${cfg.lastSyncAt ? `(${cfg.lastSyncAt})` : ''}</div>
            </div>
            <div class="flex flex-wrap gap-2 text-xs">
              <button type="button" onclick="testGasConnection()" class="px-3.5 py-2 rounded-xl bg-navy-800 text-white font-bold cursor-pointer">Testar Conexão</button>
              <button type="button" onclick="syncAllToGas()" class="px-4 py-2 rounded-xl bg-accent-500 text-white font-bold cursor-pointer">Enviar Tudo para Planilha</button>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-5 border shadow-sm space-y-4">
            <h3 class="text-sm font-extrabold text-navy-900">Backup &amp; Restauração de Dados</h3>
            <p class="text-xs text-slate-600">Exporte uma cópia integral em JSON ou restaure um arquivo anterior.</p>
            <div class="flex flex-wrap gap-2 text-xs">
              <button type="button" onclick="exportBackupJSON()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold cursor-pointer">Exportar Backup JSON</button>
              <label class="px-4 py-2 rounded-xl bg-slate-200 text-slate-800 font-bold cursor-pointer">
                Restaurar JSON
                <input type="file" accept=".json" onchange="importBackupJSON(this.files[0])" class="hidden" />
              </label>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-5 border shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-navy-900">Usuários Autorizados (${(AppState.users || []).length})</h3>
            <button type="button" onclick="openUserModal()" class="px-3.5 py-1.5 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">+ Novo Usuário</button>
          </div>
          <div class="divide-y divide-slate-100 text-xs">
            ${(AppState.users || []).map((u) => `
              <div class="py-2.5 flex items-center justify-between gap-2">
                <div><strong>${escapeHTML(u.name)}</strong> (<span class="font-mono">${escapeHTML(u.username)}</span>) • ${escapeHTML(u.role)}</div>
                <div class="space-x-1">
                  <button type="button" onclick="openUserModal('${u.id}')" class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 font-semibold cursor-pointer">Alterar Senha</button>
                  ${u.username !== 'admin' ? `<button type="button" onclick="AppState.users = AppState.users.filter(x => x.id !== '${u.id}'); saveState(); renderRoute('administracao');" class="px-2.5 py-1 rounded-lg bg-red-100 text-red-700 font-semibold cursor-pointer">Remover</button>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openUserModal(editId = null) {
      const item = editId ? (AppState.users || []).find((x) => x.id === editId) : null;
      const u = item || { name: '', username: '', password: '', role: 'Operador' };
      openModal(
        item ? 'Editar Usuário' : 'Novo Usuário',
        `<form id="user-form" class="space-y-3 text-xs">
          <div><label class="font-semibold">Nome Completo *</label><input name="name" required value="${escapeHTML(u.name)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Login *</label><input name="username" required value="${escapeHTML(u.username)}" ${item?.username === 'admin' ? 'readonly' : ''} class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Senha *</label><input type="password" name="password" required value="${escapeHTML(u.password)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Perfil</label><select name="role" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white"><option ${u.role === 'Administrador' ? 'selected' : ''}>Administrador</option><option ${u.role === 'Operador' ? 'selected' : ''}>Operador</option></select></div>
        </form>`,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="user-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar</button>`
      );
      document.getElementById('user-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const rec = { id: item ? item.id : generateId('USR'), name: fd.get('name').trim(), username: fd.get('username').trim(), password: fd.get('password'), role: fd.get('role') };
        if (item) {
          const idx = AppState.users.findIndex((x) => x.id === item.id);
          if (idx >= 0) AppState.users[idx] = rec;
        } else {
          AppState.users.push(rec);
        }
        saveState();
        closeModal();
        renderRoute('administracao');
        showToast('Usuário salvo!');
      };
    }

    // Inicialização
    syncAuthScreen();
  </script>
</body>
</html>
