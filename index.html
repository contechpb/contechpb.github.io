    function generateId(prefix = 'ID') {
      return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.floor(100 + Math.random() * 900)}`;
    }

    function addDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function addMonthsISO(isoDate, monthsToAdd) {
      const [y, m, d] = (isoDate || new Date().toISOString().slice(0, 10)).split('-').map(Number);
      const dt = new Date(y, m - 1 + monthsToAdd, d);
      return dt.toISOString().slice(0, 10);
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDateBR(iso) {
      if (!iso) return '—';
      const parts = String(iso).slice(0, 10).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : iso;
    }

    function daysUntil(iso) {
      if (!iso) return null;
      const target = new Date(`${String(iso).slice(0, 10)}T00:00:00`);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    function showToast(msg, type = 'success') {
      const box = document.getElementById('toast-container');
      if (!box) return;
      const el = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-600' : 'bg-navy-900';
      el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 pointer-events-auto`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function openModal(title, bodyHTML, footerHTML = '') {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHTML;
      document.getElementById('modal-footer').innerHTML =
        footerHTML || `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-navy-900 text-white text-xs font-bold cursor-pointer">Fechar</button>`;
      document.getElementById('modal-backdrop').classList.remove('hidden');

    function downloadCSV(filename, headers, rows) {
      const csv = [headers, ...rows]
        .map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'))
        .join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function getActiveSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;

    function syncAuthScreen() {
      const loginLogo = document.getElementById('login-logo-box');
      if (loginLogo && !loginLogo.innerHTML) loginLogo.innerHTML = getContechLogoSVG(false);
      const sideLogo = document.getElementById('sidebar-logo-box');
      if (sideLogo && !sideLogo.innerHTML) sideLogo.innerHTML = getContechLogoSVG(true);

      const session = getActiveSession();
      const authEl = document.getElementById('auth-screen');
      const shellEl = document.getElementById('app-shell');

      if (!session) {
        authEl.classList.remove('hidden');
        shellEl.classList.add('hidden');
        return;
      }

      authEl.classList.add('hidden');
      shellEl.classList.remove('hidden');
      document.getElementById('current-user-name').textContent = session.name || session.username;
      document.getElementById('current-user-role').textContent = session.role || 'Operador';
      renderSidebar();
      renderRoute(ActiveRoute);
      initInstantBidirectionalSync();
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const errBox = document.getElementById('login-error');

      const found = (AppState.users || []).find((u) => u.username === username && u.password === password);
      if (!found) {
        errBox.textContent = 'Usuário ou senha inválidos.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      const sessionData = JSON.stringify({ id: found.id, username: found.username, name: found.name, role: found.role });
      if (remember) {
        localStorage.setItem(SESSION_KEY, sessionData);
        sessionStorage.removeItem(SESSION_KEY);
      } else {
        sessionStorage.setItem(SESSION_KEY, sessionData);
        localStorage.removeItem(SESSION_KEY);
      }
      syncAuthScreen();
    });

    function logoutUser() {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      syncAuthScreen();
    }

          valor: Number(o.Valor || 0),
          status: String(o.Status || 'Aberta')
        }));
      }

      if (Array.isArray(cloudData.usuarios) && cloudData.usuarios.length > 0) {
        AppState.users = cloudData.usuarios.map((u) => ({
          id: String(u.ID || generateId('USR')),
          username: String(u.Usuario || ''),
          name: String(u.Nome_Completo || ''),
          password: String(u.Senha_Hash || ''),
          role: String(u.Perfil || 'Operador')
        }));
      }

      if (cloudVersion) AppState.config.cloudVersion = String(cloudVersion);
      AppState.config.lastSyncAt = new Date().toLocaleTimeString('pt-BR');
      AppState.config.lastSyncMessage = 'Sincronizado bidirecionalmente com Google Sheets';
      saveState(true);
    }

    function scheduleInstantPush() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url || AppState.config?.instantSync === false) return;
      updateSyncIndicator('syncing', 'Enviando alterações...');
      if (instantPushTimer) clearTimeout(instantPushTimer);
      instantPushTimer = setTimeout(() => {
        syncAllToGas(true);
      }, 450);
    }

    async function pullFromGas(silent = false) {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        if (!silent) showToast('Configure a URL /exec antes de puxar da nuvem.', 'warning');
        return;
      }
      if (isSyncBusy) return;
      isSyncBusy = true;
      updateSyncIndicator('syncing', 'Puxando da planilha...');
      try {
        const res = await fetch(`${url}?action=readAll&_t=${Date.now()}`);
        const json = await res.json();
        if (json.success && json.data) {
          applyCloudPayloadToState(json.data, json.version);
          updateSyncIndicator('online', `Sheets Ao Vivo • ${AppState.config.lastSyncAt}`);
          if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA' && document.activeElement?.tagName !== 'SELECT') {
            renderRoute(ActiveRoute);
          }
          if (!silent) showToast('Dados atualizados a partir do Google Sheets!');
        } else {
          updateSyncIndicator('error', 'Erro na leitura');
          if (!silent) showToast(json.error || 'Erro ao puxar dados.', 'error');
        }
      } catch (e) {
        updateSyncIndicator('error', 'Offline / Erro CORS');
        if (!silent) showToast('Falha de conexão com o Google Sheets.', 'error');
      } finally {
        isSyncBusy = false;
        if (pendingPushAfterSync) {
          pendingPushAfterSync = false;
          syncAllToGas(true);
        }
      }
    }

    async function checkCloudDeltaAndPull() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url || AppState.config?.instantSync === false || isSyncBusy || instantPushTimer) return;
      try {
        const res = await fetch(`${url}?action=version&_t=${Date.now()}`);
        const json = await res.json();
        if (json.success && json.version && String(json.version) !== String(AppState.config.cloudVersion || '0')) {
          await pullFromGas(true);
          showToast('Atualização recebida do Google Sheets!');
        } else if (json.success) {
          updateSyncIndicator('online', `Sheets Ao Vivo${AppState.config.lastSyncAt ? ' • ' + AppState.config.lastSyncAt : ''}`);
        }
      } catch (e) {
        // Silencioso no polling em segundo plano
      }
    }

    async function testGasConnection() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        showToast('Informe a URL /exec do Google Apps Script.', 'warning');
        return;
      }
      updateSyncIndicator('syncing', 'Testando conexão...');
      try {
        const res = await fetch(`${url}?action=test&_t=${Date.now()}`);
        const json = await res.json();
        if (json.success) {
          AppState.config.lastSyncMessage = `Conectado: ${json.spreadsheet || 'Planilha CONTECH'}`;
          saveState(true);
          updateSyncIndicator('online', 'Sheets Conectado');
          renderRoute('administracao');
          showToast('Conexão com Google Sheets validada!');
        } else {
          updateSyncIndicator('error', 'Erro no Script');
          showToast(json.error || 'Falha na resposta do script.', 'error');
        }
      } catch (e) {
        updateSyncIndicator('error', 'Falha de Rede');
        showToast('Erro de rede ao conectar com o Apps Script.', 'error');
      }
    }

    async function syncAllToGas(silent = false) {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        if (!silent) showToast('Configure a URL /exec antes de sincronizar.', 'warning');
        return;
      }
      if (instantPushTimer) {
        clearTimeout(instantPushTimer);
        instantPushTimer = null;
      }
      if (isSyncBusy) {
        pendingPushAfterSync = true;
        return;
      }
      isSyncBusy = true;
      updateSyncIndicator('syncing', 'Sincronizando...');
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'syncAll', data: mapStateToSheetPayload() })
        });
        const json = await res.json();
        if (json.success) {
          if (json.version) AppState.config.cloudVersion = String(json.version);
          AppState.config.lastSyncAt = new Date().toLocaleTimeString('pt-BR');
          AppState.config.lastSyncMessage = json.message || 'Sincronizado instantaneamente.';
          saveState(true);
          updateSyncIndicator('online', `Sheets Ao Vivo • ${AppState.config.lastSyncAt}`);
          if (ActiveRoute === 'administracao') renderRoute('administracao');
          if (!silent) showToast('Todas as abas enviadas para o Google Sheets!');
        } else {
          updateSyncIndicator('error', 'Falha ao enviar');
          if (!silent) showToast(json.error || 'Erro ao enviar dados.', 'error');
        }
      } catch (e) {
        updateSyncIndicator('error', 'Offline / Erro');
        if (!silent) showToast('Falha ao enviar dados para o Google Apps Script.', 'error');
      } finally {
        isSyncBusy = false;
        if (pendingPushAfterSync) {
          pendingPushAfterSync = false;
          syncAllToGas(true);
        }
      }
    }

    async function triggerInstantBidirectionalSync() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        navigateTo('administracao');
        showToast('Cole a URL /exec do Google Apps Script para ativar o Sync.', 'warning');
        return;
      }
      await syncAllToGas(false);
    }

    function initInstantBidirectionalSync() {
      if (cloudPollTimer) clearInterval(cloudPollTimer);
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        updateSyncIndicator('offline', 'Sync Local');
        return;
      }
      updateSyncIndicator('online', 'Sheets Ao Vivo');
      if (AppState.config?.instantSync !== false) {
        checkCloudDeltaAndPull();
        const intervalMs = Math.max(3, Number(AppState.config?.pollSeconds || 5)) * 1000;
        cloudPollTimer = setInterval(checkCloudDeltaAndPull, intervalMs);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && AppState.config?.gasUrl && AppState.config?.instantSync !== false) {
        checkCloudDeltaAndPull();
      }
    });

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(AppState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_contech_erp_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackupJSON(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          AppState = { ...createInitialState(), ...parsed };
          saveState();
          renderRoute('administracao');
          showToast('Backup JSON restaurado com sucesso!');
        } catch (err) {
          showToast('Arquivo JSON inválido.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function openClienteFichaModal(kind, id) {
      const list = kind === 'contabeis' ? AppState.clientesContabeis : AppState.clientesGerais;
      const c = list.find((x) => x.id === id);
      if (!c) return;
      const copyBtn = (val, label) => val
        ? `<button type="button" onclick="navigator.clipboard.writeText('${escapeHTML(val)}'); showToast('${label} copiada!');" class="ml-2 px-2 py-0.5 rounded bg-navy-900 text-white text-[10px] font-bold cursor-pointer">Copiar</button>`
        : '';
      openModal(
        `Ficha Completa — ${c.nomeRazao}`,
        `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>ID / Alterdata:</strong> ${escapeHTML(c.id)} / ${escapeHTML(c.idAlterdata || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>CNPJ / CPF:</strong> ${escapeHTML(c.cnpj || '—')} / ${escapeHTML(c.cpf || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>RG / CNH / Título:</strong> ${escapeHTML(c.rg || '—')} | ${escapeHTML(c.cnh || '—')} | ${escapeHTML(c.tituloEleitor || '—')}</div>

            <div class="p-3 rounded-xl bg-slate-50 border"><strong>Celular / E-mail:</strong> ${escapeHTML(c.celular || '—')} / ${escapeHTML(c.email || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>IE / IM:</strong> ${escapeHTML(c.inscricaoEstadual || '—')} / ${escapeHTML(c.inscricaoMunicipal || '—')}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>Regime / Capital:</strong> ${escapeHTML(c.regimeTributario)} • ${formatCurrency(c.capitalSocial)}</div>
            <div class="p-3 rounded-xl bg-slate-50 border"><strong>Certificado Digital:</strong> ${formatDateBR(c.certificadoVencimento)}</div>
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 sm:col-span-2 space-y-1.5">
              <div class="font-extrabold text-amber-900">Credenciais de Acesso</div>
              <div><strong>Senha GOV:</strong> <span class="font-mono">${escapeHTML(c.senhas?.gov || '—')}</span> ${copyBtn(c.senhas?.gov, 'Senha GOV')}</div>
              <div><strong>Senha NFSe:</strong> <span class="font-mono">${escapeHTML(c.senhas?.nfse || '—')}</span> ${copyBtn(c.senhas?.nfse, 'Senha NFSe')}</div>
              <div><strong>Senha E-mail:</strong> <span class="font-mono">${escapeHTML(c.senhas?.email || '—')}</span> ${copyBtn(c.senhas?.email, 'Senha E-mail')}</div>
            </div>
          </div>
        `
      );
    }

    function openClienteModal(kind, editId = null) {
      const list = kind === 'contabeis' ? AppState.clientesContabeis : AppState.clientesGerais;
      const item = editId ? list.find((x) => x.id === editId) : null;
      const c = item || {
        idAlterdata: '', nomeRazao: '', cpf: '', rg: '', cnh: '', tituloEleitor: '', dataNascimento: '',
        celular: '', email: '', cnpj: '', inscricaoEstadual: '', inscricaoMunicipal: '', dataAbertura: '',
        regimeTributario: 'Simples Nacional', capitalSocial: 0, producoes: [], parcelamentos: [],
        obrigacoes: { EFD: 'N/A', MIT: 'N/A', DEFIS: 'N/A', DASN: 'N/A' },
        certificadoVencimento: '', senhas: { gov: '', nfse: '', email: '' }
      };

      openModal(
        item ? `Editar Cliente (${c.id})` : 'Novo Cadastro de Cliente (25 Campos)',
        `
          <form id="cliente-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
            <div><label class="font-semibold">ID Alterdata</label><input name="idAlterdata" value="${escapeHTML(c.idAlterdata)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div class="sm:col-span-2"><label class="font-semibold">Nome / Razão Social *</label><input name="nomeRazao" required value="${escapeHTML(c.nomeRazao)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">CPF</label><input name="cpf" value="${escapeHTML(c.cpf)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>

            <div><label class="font-semibold">CNH</label><input name="cnh" value="${escapeHTML(c.cnh)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>

            <div><label class="font-semibold">Data de Nascimento</label><input type="date" name="dataNascimento" value="${escapeHTML(c.dataNascimento)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Celular / WhatsApp</label><input name="celular" value="${escapeHTML(c.celular)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div class="sm:col-span-2"><label class="font-semibold">E-mail</label><input type="email" name="email" value="${escapeHTML(c.email)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">CNPJ</label><input name="cnpj" value="${escapeHTML(c.cnpj)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Inscrição Estadual</label><input name="inscricaoEstadual" value="${escapeHTML(c.inscricaoEstadual)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Inscrição Municipal</label><input name="inscricaoMunicipal" value="${escapeHTML(c.inscricaoMunicipal)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Data de Abertura</label><input type="date" name="dataAbertura" value="${escapeHTML(c.dataAbertura)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Regime Tributário</label><select name="regimeTributario" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${REGIMES.map((r) => `<option ${c.regimeTributario === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
            <div><label class="font-semibold">Capital Social (R$)</label><input type="number" step="0.01" name="capitalSocial" value="${Number(c.capitalSocial || 0)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>

            <div class="sm:col-span-3 flex flex-wrap gap-4 p-2.5 rounded-xl bg-slate-50 border">

              <span class="font-bold ml-4">Parcelamentos:</span>

            </div>

            ${OBRIGACOES_KEYS.map((k) => `
              <div>
                <label class="font-semibold">Obrigação ${k}</label>
                <select name="obr_${k}" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">

          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>

      document.getElementById('cliente-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const rec = {
          id: item ? item.id : generateId(kind === 'contabeis' ? 'CC' : 'CG'),
          idAlterdata: fd.get('idAlterdata').trim(),
          nomeRazao: fd.get('nomeRazao').trim(),
          cpf: fd.get('cpf').trim(),
          rg: fd.get('rg').trim(),
          cnh: fd.get('cnh').trim(),
          tituloEleitor: fd.get('tituloEleitor').trim(),
          dataNascimento: fd.get('dataNascimento'),
          celular: fd.get('celular').trim(),
          email: fd.get('email').trim(),
          cnpj: fd.get('cnpj').trim(),
          inscricaoEstadual: fd.get('inscricaoEstadual').trim(),
          inscricaoMunicipal: fd.get('inscricaoMunicipal').trim(),
          dataAbertura: fd.get('dataAbertura'),
          regimeTributario: fd.get('regimeTributario'),

            DEFIS: fd.get('obr_DEFIS'),
            DASN: fd.get('obr_DASN')
          },
          certificadoVencimento: fd.get('certificadoVencimento'),
          senhas: {
            gov: fd.get('senhaGov').trim(),
            nfse: fd.get('senhaNfse').trim(),
            email: fd.get('senhaEmail').trim()
          }
        };
        if (item) {
          const idx = list.findIndex((x) => x.id === item.id);
          if (idx >= 0) list[idx] = rec;
        } else {
          list.push(rec);
        }
        saveState();
        closeModal();
        renderRoute(kind);
        showToast('Cliente salvo com sucesso!');
      };
    }

    function deleteCliente(kind, id) {
      askConfirm('Excluir Cliente', 'Deseja realmente excluir este cadastro de cliente?', () => {
        if (kind === 'contabeis') AppState.clientesContabeis = AppState.clientesContabeis.filter((x) => x.id !== id);
        else AppState.clientesGerais = AppState.clientesGerais.filter((x) => x.id !== id);
        saveState();
        renderRoute(kind);
        showToast('Cliente excluído.');
      });
    }

    function exportClientesCSV(kind) {
      const list = kind === 'contabeis' ? AppState.clientesContabeis : AppState.clientesGerais;
      const headers = ['ID', 'ID_Alterdata', 'Nome_Razao_Social', 'CPF', 'RG', 'CNH', 'Titulo_Eleitor', 'Data_Nascimento', 'Celular', 'Email', 'CNPJ', 'Inscricao_Estadual', 'Inscricao_Municipal', 'Data_Abertura', 'Regime_Tributario', 'Capital_Social', 'Producoes', 'Parcelamentos', 'EFD', 'MIT', 'DEFIS', 'DASN', 'Vencimento_Certificado', 'Senha_GOV', 'Senha_NFSe_Email'];
      const rows = list.map((c) => [
        c.id, c.idAlterdata, c.nomeRazao, c.cpf, c.rg, c.cnh, c.tituloEleitor, c.dataNascimento, c.celular, c.email,

    // =========================================================================

                const phone = String(c.celular || '').replace(/\D/g, '');
                const msg = encodeURIComponent(`Olá ${c.nomeRazao}, aqui é da CONTECH Contabilidade & Informática. Lembramos que o seu Certificado Digital vence em ${formatDateBR(c.certificadoVencimento)}. Podemos agendar a renovação?`);

    // =========================================================================
    // 5. GESTÃO FINANCEIRA (CONTAS A PAGAR & RECEBER COM EDIÇÃO EM LOTE)
    // =========================================================================
    let FinSelectedIds = new Set();

    function toggleFinSelect(id, checked) {
      if (checked) FinSelectedIds.add(id);
      else FinSelectedIds.delete(id);
      renderRoute(ActiveRoute);
    }

    function toggleFinSelectGroup(ids, checked) {
      ids.forEach((id) => {
        if (checked) FinSelectedIds.add(id);
        else FinSelectedIds.delete(id);
      });
      renderRoute(ActiveRoute);
    }

    function bulkUpdateFinanceiro(kind, updates) {
      const isPagar = kind === 'pagar';
      const list = isPagar ? AppState.contasPagar : AppState.contasReceber;
      const today = new Date().toISOString().slice(0, 10);
      list.forEach((item) => {
        if (!FinSelectedIds.has(item.id)) return;
        if (updates.status) {
          item.status = updates.status;
          if (isPagar) item.dataPagamento = updates.status === 'Pago' ? today : '';
          else item.dataRecebimento = updates.status === 'Recebido' ? today : '';
        }
        if (updates.vencimento) item.vencimento = updates.vencimento;
        if (updates.valor !== undefined && updates.valor !== '') item.valor = Number(updates.valor);
        if (updates.categoria && isPagar) item.categoria = updates.categoria;
      });
      FinSelectedIds.clear();
      saveState();
      renderRoute(kind);
      showToast('Lançamentos atualizados em lote!');
    }

    function bulkDeleteFinanceiro(kind) {
      askConfirm('Excluir em Lote', `Deseja excluir ${FinSelectedIds.size} lançamento(s) selecionado(s)?`, () => {
        if (kind === 'pagar') AppState.contasPagar = AppState.contasPagar.filter((x) => !FinSelectedIds.has(x.id));
        else AppState.contasReceber = AppState.contasReceber.filter((x) => !FinSelectedIds.has(x.id));
        FinSelectedIds.clear();
        saveState();
        renderRoute(kind);
        showToast('Lançamentos removidos em lote.');
      });
    }

    function openBulkFinEditModal(kind) {
      const isPagar = kind === 'pagar';
      openModal(
        `Alterar ${FinSelectedIds.size} Lançamento(s) em Lote`,
        `
          <form id="bulk-fin-form" class="space-y-3 text-xs">
            <p class="text-slate-500">Preencha apenas os campos que deseja sobrescrever nos itens selecionados.</p>
            <div><label class="font-semibold">Novo Vencimento</label><input type="date" name="vencimento" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Novo Valor (R$)</label><input type="number" step="0.01" name="valor" placeholder="Deixe vazio para manter" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            ${isPagar ? `<div><label class="font-semibold">Nova Categoria</label><select name="categoria" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white"><option value="">Manter atual</option>${DESPESA_CATEGORIAS.map((c) => `<option>${c}</option>`).join('')}</select></div>` : ''}
            <div><label class="font-semibold">Novo Status</label><select name="status" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white"><option value="">Manter atual</option><option>Pendente</option><option>${isPagar ? 'Pago' : 'Recebido'}</option></select></div>
          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="bulk-fin-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Aplicar Alterações</button>`
      );
      document.getElementById('bulk-fin-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        bulkUpdateFinanceiro(kind, {
          vencimento: fd.get('vencimento'),
          valor: fd.get('valor'),
          categoria: fd.get('categoria'),
          status: fd.get('status')
        });
        closeModal();
      };
    }

    function renderFinanceiro(container, kind) {
      const isPagar = kind === 'pagar';
      const list = isPagar ? (AppState.contasPagar || []) : (AppState.contasReceber || []);
      const doneStatus = isPagar ? 'Pago' : 'Recebido';

      const abertos = list.filter((x) => x.status !== doneStatus).sort((a, b) => (a.vencimento || '').localeCompare(b.vencimento || ''));
      const liquidados = list.filter((x) => x.status === doneStatus).sort((a, b) => (b.vencimento || '').localeCompare(a.vencimento || ''));

      const totalAberto = abertos.reduce((s, x) => s + Number(x.valor || 0), 0);
      const totalLiquidado = liquidados.reduce((s, x) => s + Number(x.valor || 0), 0);
      const selectedTotal = list.filter((x) => FinSelectedIds.has(x.id)).reduce((s, x) => s + Number(x.valor || 0), 0);

      const renderSectionTable = (title, items, badgeClass) => {
        const groupIds = items.map((x) => x.id);
        const allChecked = groupIds.length > 0 && groupIds.every((id) => FinSelectedIds.has(id));
        return `
          <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
            <div class="px-4 py-3 bg-slate-50 border-b flex items-center justify-between">
              <span class="text-xs font-extrabold text-navy-900">${title} (${items.length})</span>
              <span class="text-xs font-black ${badgeClass}">${formatCurrency(items.reduce((s, x) => s + Number(x.valor || 0), 0))}</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left">
                <thead class="bg-navy-900 text-white uppercase text-[11px]">
                  <tr>
                    <th class="px-3 py-2.5 w-8"><input type="checkbox" ${allChecked ? 'checked' : ''} onchange='toggleFinSelectGroup(${JSON.stringify(groupIds)}, this.checked)' /></th>
                    <th class="px-3 py-2.5">${isPagar ? 'Descrição / Fornecedor' : 'Cliente / Serviço'}</th>
                    <th class="px-3 py-2.5">${isPagar ? 'Categoria' : 'Descrição'}</th>
                    <th class="px-3 py-2.5">Parcela</th>
                    <th class="px-3 py-2.5">Vencimento</th>
                    <th class="px-3 py-2.5">Valor</th>
                    <th class="px-3 py-2.5">Status</th>
                    <th class="px-3 py-2.5 text-right">Ações</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${items.length === 0 ? `<tr><td colspan="8" class="px-4 py-5 text-center text-slate-400">Nenhum registro nesta seção.</td></tr>` : items.map((item) => `
                    <tr class="hover:bg-slate-50 ${FinSelectedIds.has(item.id) ? 'bg-amber-50/70' : ''}">
                      <td class="px-3 py-2.5"><input type="checkbox" ${FinSelectedIds.has(item.id) ? 'checked' : ''} onchange="toggleFinSelect('${item.id}', this.checked)" /></td>
                      <td class="px-3 py-2.5 font-bold text-navy-900">${escapeHTML(isPagar ? item.descricao : item.cliente)}</td>
                      <td class="px-3 py-2.5">${escapeHTML(isPagar ? item.categoria : item.descricao)}</td>
                      <td class="px-3 py-2.5">${escapeHTML(item.parcela || '1/1')}</td>
                      <td class="px-3 py-2.5">${formatDateBR(item.vencimento)}</td>
                      <td class="px-3 py-2.5 font-bold">${formatCurrency(item.valor)}</td>
                      <td class="px-3 py-2.5">
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${item.status === doneStatus ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}">${escapeHTML(item.status)}</span>
                      </td>
                      <td class="px-3 py-2.5 text-right whitespace-nowrap space-x-1">
                        <button type="button" onclick="toggleFinStatus('${kind}', '${item.id}')" class="px-2 py-1 rounded-lg ${item.status === doneStatus ? 'bg-slate-200 text-slate-800' : 'bg-emerald-600 text-white'} font-bold cursor-pointer">
                          ${item.status === doneStatus ? 'Estornar' : (isPagar ? 'Baixar Pago' : 'Receber')}
                        </button>
                        <button type="button" onclick="deleteFinItem('${kind}', '${item.id}')" class="px-2 py-1 rounded-lg bg-red-100 text-red-700 font-bold cursor-pointer">Excluir</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      };

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">${isPagar ? 'Contas a Pagar' : 'Contas a Receber'}</h2>
            <p class="text-xs sm:text-sm text-slate-600">Em aberto na parte superior • ${doneStatus}s na parte inferior • Alteração em lote.</p>
          </div>
          <button type="button" onclick="openFinModal('${kind}')" class="px-4 py-2 rounded-xl bg-accent-500 hover:bg-accent-600 text-white text-xs font-bold cursor-pointer">
            + ${isPagar ? 'Nova Despesa' : 'Novo Recebimento'}
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl p-4 border shadow-sm">
            <div class="text-xs font-bold text-slate-500 uppercase">Total Pendente / Em Aberto</div>
            <div class="text-2xl font-black text-amber-600 mt-1">${formatCurrency(totalAberto)}</div>
          </div>
          <div class="bg-white rounded-2xl p-4 border shadow-sm">
            <div class="text-xs font-bold text-slate-500 uppercase">Total ${doneStatus}</div>
            <div class="text-2xl font-black text-emerald-700 mt-1">${formatCurrency(totalLiquidado)}</div>
          </div>
        </div>

        ${FinSelectedIds.size > 0 ? `
          <div class="bg-navy-900 text-white rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3 text-xs shadow">
            <div><strong>${FinSelectedIds.size}</strong> item(ns) selecionado(s) • Soma: <strong>${formatCurrency(selectedTotal)}</strong></div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="bulkUpdateFinanceiro('${kind}', { status: '${doneStatus}' })" class="px-3 py-1.5 rounded-lg bg-emerald-600 font-bold cursor-pointer">Marcar ${doneStatus}</button>
              <button type="button" onclick="bulkUpdateFinanceiro('${kind}', { status: 'Pendente' })" class="px-3 py-1.5 rounded-lg bg-amber-600 font-bold cursor-pointer">Estornar Pendente</button>
              <button type="button" onclick="openBulkFinEditModal('${kind}')" class="px-3 py-1.5 rounded-lg bg-blue-600 font-bold cursor-pointer">Editar em Lote</button>
              <button type="button" onclick="bulkDeleteFinanceiro('${kind}')" class="px-3 py-1.5 rounded-lg bg-red-600 font-bold cursor-pointer">Excluir Lote</button>
              <button type="button" onclick="FinSelectedIds.clear(); renderRoute('${kind}');" class="px-2.5 py-1.5 rounded-lg bg-slate-700 cursor-pointer">Limpar</button>
            </div>
          </div>
        ` : ''}

        ${renderSectionTable('1. Lançamentos Pendentes / Em Aberto', abertos, 'text-amber-600')}
        ${renderSectionTable(`2. Lançamentos ${doneStatus}s`, liquidados, 'text-emerald-700')}
      `;
    }

    function openFinModal(kind) {
      const isPagar = kind === 'pagar';
      const allClients = [...(AppState.clientesContabeis || []), ...(AppState.clientesGerais || [])];
      openModal(
        isPagar ? 'Lançar Conta a Pagar' : 'Lançar Conta a Receber',
        `
          <form id="fin-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            ${isPagar
              ? `<div class="sm:col-span-2"><label class="font-semibold">Fornecedor / Descrição *</label><input name="descricao" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
                 <div><label class="font-semibold">Categoria</label><select name="categoria" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${DESPESA_CATEGORIAS.map((c) => `<option>${c}</option>`).join('')}</select></div>`
              : `<div class="sm:col-span-2"><label class="font-semibold">Cliente *</label><input list="clientes-datalist" name="cliente" required class="w-full mt-1 px-3 py-2 rounded-xl border" /><datalist id="clientes-datalist">${allClients.map((c) => `<option value="${escapeHTML(c.nomeRazao)}">`).join('')}</datalist></div>
                 <div><label class="font-semibold">Serviço / Honorário *</label><input name="descricao" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>`
            }
            <div><label class="font-semibold">Valor da Parcela (R$) *</label><input type="number" step="0.01" name="valor" required class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">1º Vencimento *</label><input type="date" name="vencimento" required value="${new Date().toISOString().slice(0, 10)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-semibold">Qtd. Parcelas Mensais</label><input type="number" min="1" max="60" name="parcelas" value="1" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          </form>
        `,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="fin-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Gerar Lançamento(s)</button>`
      );

      document.getElementById('fin-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const totalParcelas = Math.max(1, Number(fd.get('parcelas') || 1));
        const baseDate = fd.get('vencimento');
        const valor = Number(fd.get('valor') || 0);

        for (let i = 0; i < totalParcelas; i++) {
          const parcLabel = `${i + 1}/${totalParcelas}`;
          const venc = addMonthsISO(baseDate, i);
          if (isPagar) {
            AppState.contasPagar.push({
              id: generateId('PAG'),
              descricao: fd.get('descricao').trim(),
              categoria: fd.get('categoria'),
              parcela: parcLabel,
              vencimento: venc,
              valor,
              status: 'Pendente',
              dataPagamento: ''
            });
          } else {
            AppState.contasReceber.push({
              id: generateId('REC'),
              cliente: fd.get('cliente').trim(),
              descricao: fd.get('descricao').trim(),
              parcela: parcLabel,
              vencimento: venc,
              valor,
              status: 'Pendente',
              dataRecebimento: ''
            });
          }
        }
        saveState();
        closeModal();
        renderRoute(kind);
        showToast(`${totalParcelas} lançamento(s) gerado(s)!`);
      };
    }

    function toggleFinStatus(kind, id) {
      const isPagar = kind === 'pagar';
      const list = isPagar ? AppState.contasPagar : AppState.contasReceber;
      const done = isPagar ? 'Pago' : 'Recebido';
      const item = list.find((x) => x.id === id);
      if (!item) return;
      item.status = item.status === done ? 'Pendente' : done;
      const dt = item.status === done ? new Date().toISOString().slice(0, 10) : '';
      if (isPagar) item.dataPagamento = dt;
      else item.dataRecebimento = dt;
      saveState();
      renderRoute(kind);
    }

    function deleteFinItem(kind, id) {
      askConfirm('Excluir Lançamento', 'Confirma a exclusão deste lançamento financeiro?', () => {
        if (kind === 'pagar') AppState.contasPagar = AppState.contasPagar.filter((x) => x.id !== id);
        else AppState.contasReceber = AppState.contasReceber.filter((x) => x.id !== id);
        saveState();
        renderRoute(kind);
      });
    }

    // 6. TAREFAS & PRAZOS
    // =========================================================================

            <div class="font-extrabold text-navy-900">${escapeHTML(t.titulo)}</div>

              ${['Pendente', 'Em andamento', 'Concluído'].map((st) => `<option ${t.status === st ? 'selected' : ''}>${st}</option>`).join('')}
            </select>
            <button type="button" onclick="openTarefaModal('${t.id}')" class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 font-bold cursor-pointer">Editar</button>

            <p class="text-xs sm:text-sm text-slate-600">Controle de demandas fiscais, certificações, TI, licitações e administrativo.</p>

    let TenderFilter = { q: '', uf: 'PB', portal: '', maxDate: '', sort: 'asc' };
    let LiveTenderResults = [];
    let TenderSearchLoading = false;

    function classifyTenderPortal(sigText) {
      const s = String(sigText || '').toLowerCase();
      if (s.includes('compras.gov') || s.includes('comprasnet') || s.includes('siasg')) return 'Compras.gov.br (ComprasNet)';
      if (s.includes('licitacoes-e') || s.includes('banco do brasil')) return 'Licitações-e (Banco do Brasil)';
      if (s.includes('caixa')) return 'Portal de Compras da Caixa';
      if (s.includes('portaldecompraspublicas') || s.includes('compras públicas')) return 'Portal de Compras Públicas';
      if (s.includes('bll')) return 'BLL Compras';
      if (s.includes('licitanet')) return 'Licitanet';
      if (s.includes('bnc') || s.includes('bolsa nacional')) return 'BNC (Bolsa Nacional de Compras)';
      if (s.includes('licitamais') || s.includes('licita+brasil')) return 'Licita+Brasil';
      if (s.includes('comprasbr')) return 'ComprasBR';
      if (s.includes('bbmnet')) return 'BBMNET';
      if (s.includes('bec.sp')) return 'BEC/SP (Bolsa Eletrônica de Compras de São Paulo)';
      if (s.includes('compras.mg')) return 'Portal de Compras MG';
      if (s.includes('compras.rs')) return 'Compras RS';
      if (s.includes('compras.rj')) return 'Compras RJ';
      if (s.includes('seap') || s.includes('comprasparana')) return 'SEAP-PR';
      if (s.includes('sislog')) return 'SISLOG (Goiás)';
      if (s.includes('compras.mt')) return 'Compras MT';
      if (s.includes('centraldecompras.pb') || s.includes('paraíba')) return 'Portal de Compras PB (Paraíba)';
      if (s.includes('tce.pb') || s.includes('tramita')) return 'TCE PB';
      return 'Portal Nacional de Contratações Públicas (PNCP)';
    }

    async function searchAllTenderPortals() {
      TenderSearchLoading = true;
      renderRoute('licitacoes');
      const collected = [];
      const uf = (TenderFilter.uf || '').trim().toUpperCase();

      try {
        // 1. PNCP Contratações com Propostas Abertas
        const dtFim = addDaysISO(90).replace(/-/g, '');
        const ufQ = uf ? `&uf=${encodeURIComponent(uf)}` : '';
        const pncpRes = await fetch(`https://pncp.gov.br/api/consulta/v1/contratacoes/proposta?dataFinal=${dtFim}${ufQ}&pagina=1&tamanhoPagina=100`);
        if (pncpRes.ok) {
          const pncpJson = await pncpRes.json();
          (pncpJson.data || []).forEach((it) => {
            const cnpj = it.orgaoEntidade?.cnpj || '';
            const ano = it.anoCompra || '';
            const seq = it.sequencialCompra || '';
            const portal = classifyTenderPortal(`${it.usuarioNome || ''} ${it.sistemaOrigem || ''} ${it.linkSistemaOrigem || ''}`);
            collected.push({
              id: it.numeroControlePNCP || generateId('PNCP'),
              numeroEdital: `${it.numeroCompra || 'S/N'}/${ano}`,
              orgao: it.orgaoEntidade?.razaoSocial || 'Órgão Público',
              portal,
              uf: it.unidadeOrgao?.ufSigla || uf || 'BR',
              modalidade: it.modalidadeNome || 'Pregão Eletrônico',
              objeto: it.objetoCompra || '',
              valorEstimado: Number(it.valorTotalEstimado || 0),
              dataAbertura: String(it.dataAberturaProposta || it.dataPublicacaoPncp || '').slice(0, 10),
              link: it.linkSistemaOrigem || (cnpj && ano && seq ? `https://pncp.gov.br/app/editais/${cnpj}/${ano}/${seq}` : 'https://pncp.gov.br/app/editais')
            });
          });
        }
      } catch (e) { console.warn('PNCP fetch:', e); }

      // 2. Backend Google Apps Script (agrega PNCP + Compras.gov + TCE-PB + Portal PB + demais portais sem CORS)
      const gasUrl = AppState.config?.gasUrl?.trim();
      if (gasUrl) {
        try {
          const gRes = await fetch(`${gasUrl}?action=licitacoes&uf=${encodeURIComponent(uf)}&q=${encodeURIComponent(TenderFilter.q)}&portal=${encodeURIComponent(TenderFilter.portal)}`);
          const gJson = await gRes.json();
          if (gJson.success && Array.isArray(gJson.items)) {
            gJson.items.forEach((it) => collected.push(it));
          }
        } catch (e) { console.warn('GAS licitacoes:', e); }
      }

      const map = new Map();
      collected.forEach((it) => { if (it.id) map.set(it.id, it); });
      LiveTenderResults = Array.from(map.values());
      TenderSearchLoading = false;
      renderRoute('licitacoes');
      showToast(`${LiveTenderResults.length} edital(is) carregado(s) dos portais.`);
    }

                    <td class="px-3 py-2.5">${formatDateBR(p.data)}</td>
                    <td class="px-3 py-2.5 font-bold text-navy-900">${escapeHTML(p.secretaria)}</td>
                    <td class="px-3 py-2.5">${escapeHTML(p.servico)} ${p.complemento ? `<span class="text-slate-400">(${escapeHTML(p.complemento)})</span>` : ''}</td>
                    <td class="px-3 py-2.5 font-mono">${escapeHTML(p.empenho || '—')} / ${escapeHTML(p.nf || '—')}</td>
                    <td class="px-3 py-2.5 font-bold">${formatCurrency(p.valor)}</td>
                    <td class="px-3 py-2.5">
                      <select onchange="updatePmiStatus('${p.id}', this.value)" class="px-2 py-1 rounded-lg border bg-slate-50 font-semibold">
                        ${PMI_STATUSES.map((st) => `<option ${p.status === st ? 'selected' : ''}>${st}</option>`).join('')}
                      </select>
                    </td>
                    <td class="px-3 py-2.5 text-right space-x-1">
                      <button type="button" onclick="openPmiModal('${p.id}')" class="px-2 py-1 rounded-lg bg-amber-100 text-amber-900 font-bold cursor-pointer">Editar</button>
                      <button type="button" onclick="deletePmi('${p.id}')" class="px-2 py-1 rounded-lg bg-red-100 text-red-700 font-bold cursor-pointer">Excluir</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">Serviços PMI — Prefeitura de Itaporanga</h2>
            <p class="text-xs sm:text-sm text-slate-600">Controle de empenhos, notas fiscais e pagamentos por secretaria.</p>
          </div>
          <button type="button" onclick="openPmiModal()" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">+ Novo Serviço PMI</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white rounded-2xl p-4 border shadow-sm"><div class="text-xs text-slate-500 font-bold uppercase">Total Geral</div><div class="text-xl font-black text-navy-900 mt-1">${formatCurrency(totAberto + totPago)}</div></div>
          <div class="bg-white rounded-2xl p-4 border shadow-sm"><div class="text-xs text-slate-500 font-bold uppercase">Em Aberto</div><div class="text-xl font-black text-amber-600 mt-1">${formatCurrency(totAberto)}</div></div>
          <div class="bg-white rounded-2xl p-4 border shadow-sm"><div class="text-xs text-slate-500 font-bold uppercase">Total Pago</div><div class="text-xl font-black text-emerald-700 mt-1">${formatCurrency(totPago)}</div></div>
        </div>

        ${tableHTML('Serviços Pendentes / Em Aberto', abertos)}
        ${tableHTML('Serviços Pagos', pagos)}
      `;
    }

    function updatePmiStatus(id, status) {
      const p = (AppState.servicosPmi || []).find((x) => x.id === id);
      if (p) { p.status = status; saveState(); renderRoute('pmi'); }
    }

    function openPmiModal(editId = null) {
      const item = editId ? (AppState.servicosPmi || []).find((x) => x.id === editId) : null;
      const p = item || { data: new Date().toISOString().slice(0, 10), secretaria: '', servico: '', complemento: '', valor: 0, status: 'Pendente', empenho: '', nf: '' };
      openModal(
        item ? 'Editar Serviço PMI' : 'Novo Serviço PMI',
        `<form id="pmi-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div><label class="font-semibold">Data *</label><input type="date" name="data" required value="${escapeHTML(p.data)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Secretaria *</label><input name="secretaria" required value="${escapeHTML(p.secretaria)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div class="sm:col-span-2"><label class="font-semibold">Serviço *</label><input name="servico" required value="${escapeHTML(p.servico)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Complemento</label><input name="complemento" value="${escapeHTML(p.complemento)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Valor (R$) *</label><input type="number" step="0.01" name="valor" required value="${Number(p.valor || 0)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Nº Empenho</label><input name="empenho" value="${escapeHTML(p.empenho)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Nº Nota Fiscal</label><input name="nf" value="${escapeHTML(p.nf)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Status</label><select name="status" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${PMI_STATUSES.map((st) => `<option ${p.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></div>
        </form>`,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="pmi-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar</button>`
      );
      document.getElementById('pmi-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const rec = { id: item ? item.id : generateId('PMI'), data: fd.get('data'), secretaria: fd.get('secretaria').trim(), servico: fd.get('servico').trim(), complemento: fd.get('complemento').trim(), valor: Number(fd.get('valor') || 0), empenho: fd.get('empenho').trim(), nf: fd.get('nf').trim(), status: fd.get('status') };
        if (item) { const idx = AppState.servicosPmi.findIndex((x) => x.id === item.id); if (idx >= 0) AppState.servicosPmi[idx] = rec; }
        else AppState.servicosPmi.push(rec);
        saveState(); closeModal(); renderRoute('pmi');
      };
    }

    function deletePmi(id) {
      askConfirm('Excluir Serviço PMI', 'Confirma a exclusão deste registro?', () => {
        AppState.servicosPmi = AppState.servicosPmi.filter((x) => x.id !== id);
        saveState(); renderRoute('pmi');
      });
    }

    // =========================================================================
    // 10. ORDENS DE SERVIÇO (OS)
    // =========================================================================
    function renderOrdensServico(container) {
      const list = AppState.ordensServico || [];
      const abertas = list.filter((o) => !['Concluída', 'Entregue / Faturada'].includes(o.status)).length;
      const concluidas = list.length - abertas;
      const faturamento = list.reduce((s, o) => s + Number(o.valor || 0), 0);

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">Ordens de Serviço — Suporte TI</h2>
            <p class="text-xs sm:text-sm text-slate-600">Atendimentos técnicos, manutenção de equipamentos e comprovante de impressão.</p>
          </div>
          <button type="button" onclick="openOsModal()" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">+ Nova OS</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white rounded-2xl p-4 border shadow-sm"><div class="text-xs text-slate-500 font-bold uppercase">OS Abertas / Execução</div><div class="text-xl font-black text-amber-600 mt-1">${abertas}</div></div>
          <div class="bg-white rounded-2xl p-4 border shadow-sm"><div class="text-xs text-slate-500 font-bold uppercase">OS Concluídas</div><div class="text-xl font-black text-emerald-700 mt-1">${concluidas}</div></div>
          <div class="bg-white rounded-2xl p-4 border shadow-sm"><div class="text-xs text-slate-500 font-bold uppercase">Faturamento OS</div><div class="text-xl font-black text-navy-900 mt-1">${formatCurrency(faturamento)}</div></div>
        </div>

        <div class="bg-white rounded-2xl border shadow-sm overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-navy-900 text-white uppercase text-[11px]">
              <tr>
                <th class="px-3 py-2.5">Nº OS</th>
                <th class="px-3 py-2.5">Data</th>
                <th class="px-3 py-2.5">Cliente</th>
                <th class="px-3 py-2.5">Equipamento / Defeito</th>
                <th class="px-3 py-2.5">Valor</th>
                <th class="px-3 py-2.5">Status</th>
                <th class="px-3 py-2.5 text-right">Ações</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${list.map((o) => `
                <tr class="hover:bg-slate-50">
                  <td class="px-3 py-2.5 font-mono font-bold">${escapeHTML(o.id)}</td>
                  <td class="px-3 py-2.5">${formatDateBR(o.data)}</td>
                  <td class="px-3 py-2.5 font-bold text-navy-900">${escapeHTML(o.clienteNome)}</td>
                  <td class="px-3 py-2.5"><strong>${escapeHTML(o.equipamento)}</strong> — ${escapeHTML(o.defeito)}</td>
                  <td class="px-3 py-2.5 font-bold">${formatCurrency(o.valor)}</td>
                  <td class="px-3 py-2.5">${escapeHTML(o.status)}</td>
                  <td class="px-3 py-2.5 text-right whitespace-nowrap space-x-1">
                    <button type="button" onclick="printOsReceipt('${o.id}')" class="px-2 py-1 rounded-lg bg-blue-100 text-navy-900 font-bold cursor-pointer">Imprimir</button>
                    <button type="button" onclick="openOsModal('${o.id}')" class="px-2 py-1 rounded-lg bg-amber-100 text-amber-900 font-bold cursor-pointer">Editar</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function openOsModal(editId = null) {
      const item = editId ? (AppState.ordensServico || []).find((x) => x.id === editId) : null;
      const o = item || { data: new Date().toISOString().slice(0, 10), clienteNome: '', telefone: '', equipamento: '', defeito: '', servicoExecutado: '', valor: 0, status: 'Aberta' };
      openModal(
        item ? `Editar ${o.id}` : 'Nova Ordem de Serviço',
        `<form id="os-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div><label class="font-semibold">Data *</label><input type="date" name="data" required value="${escapeHTML(o.data)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Cliente *</label><input name="clienteNome" required value="${escapeHTML(o.clienteNome)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Telefone</label><input name="telefone" value="${escapeHTML(o.telefone)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Equipamento *</label><input name="equipamento" required value="${escapeHTML(o.equipamento)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div class="sm:col-span-2"><label class="font-semibold">Defeito Relatado *</label><input name="defeito" required value="${escapeHTML(o.defeito)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div class="sm:col-span-2"><label class="font-semibold">Serviço Executado</label><input name="servicoExecutado" value="${escapeHTML(o.servicoExecutado)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Valor (R$)</label><input type="number" step="0.01" name="valor" value="${Number(o.valor || 0)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Status</label><select name="status" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white">${OS_STATUSES.map((st) => `<option ${o.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></div>
        </form>`,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="os-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar OS</button>`
      );
      document.getElementById('os-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const rec = { id: item ? item.id : `OS-${new Date().getFullYear()}-${Math.floor(100 + Math.random() * 900)}`, data: fd.get('data'), clienteNome: fd.get('clienteNome').trim(), telefone: fd.get('telefone').trim(), equipamento: fd.get('equipamento').trim(), defeito: fd.get('defeito').trim(), servicoExecutado: fd.get('servicoExecutado').trim(), valor: Number(fd.get('valor') || 0), status: fd.get('status') };
        if (item) { const idx = AppState.ordensServico.findIndex((x) => x.id === item.id); if (idx >= 0) AppState.ordensServico[idx] = rec; }
        else AppState.ordensServico.push(rec);
        saveState(); closeModal(); renderRoute('os');
      };
    }

    function printOsReceipt(id) {
      const o = (AppState.ordensServico || []).find((x) => x.id === id);
      if (!o) return;
      const area = document.getElementById('print-area');
      area.innerHTML = `
        <div class="max-w-2xl mx-auto border-2 border-slate-800 p-6 text-xs space-y-4">
          <div class="flex items-center justify-between border-b pb-4">
            ${getContechLogoSVG(true)}
            <div class="text-right">
              <div class="text-base font-black">ORDEM DE SERVIÇO</div>
              <div class="font-mono font-bold">${escapeHTML(o.id)} • Data: ${formatDateBR(o.data)}</div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div><strong>Cliente:</strong> ${escapeHTML(o.clienteNome)}</div>
            <div><strong>Telefone:</strong> ${escapeHTML(o.telefone || '—')}</div>
            <div class="col-span-2"><strong>Equipamento:</strong> ${escapeHTML(o.equipamento)}</div>
            <div class="col-span-2"><strong>Defeito Relatado:</strong> ${escapeHTML(o.defeito)}</div>
            <div class="col-span-2"><strong>Serviço Executado:</strong> ${escapeHTML(o.servicoExecutado || '—')}</div>
            <div><strong>Status:</strong> ${escapeHTML(o.status)}</div>
            <div class="text-right text-sm font-black">Valor Total: ${formatCurrency(o.valor)}</div>
          </div>
          <div class="grid grid-cols-2 gap-8 pt-10 text-center">
            <div class="border-t border-slate-600 pt-1">CONTECH Contabilidade &amp; Informática</div>
            <div class="border-t border-slate-600 pt-1">Assinatura do Cliente</div>
          </div>
        </div>
      `;
      window.print();
    }

    // =========================================================================
    // 11. CENTRAL DE RELATÓRIOS
    // =========================================================================
    let SelectedReport = 'fluxo';

    function renderRelatorios(container) {
      let headers = [];
      let rows = [];

      if (SelectedReport === 'fluxo' || SelectedReport === 'receber') {
        headers = ['ID', 'Cliente', 'Descrição', 'Vencimento', 'Valor', 'Status'];
        rows = (AppState.contasReceber || []).map((r) => [r.id, r.cliente, r.descricao, formatDateBR(r.vencimento), formatCurrency(r.valor), r.status]);
      } else if (SelectedReport === 'pagar') {
        headers = ['ID', 'Descrição', 'Categoria', 'Vencimento', 'Valor', 'Status'];
        rows = (AppState.contasPagar || []).map((p) => [p.id, p.descricao, p.categoria, formatDateBR(p.vencimento), formatCurrency(p.valor), p.status]);
      } else if (SelectedReport === 'contabeis' || SelectedReport === 'gerais') {
        const list = SelectedReport === 'contabeis' ? AppState.clientesContabeis : AppState.clientesGerais;
        headers = ['ID', 'Nome / Razão Social', 'CNPJ / CPF', 'Regime', 'Celular'];
        rows = (list || []).map((c) => [c.id, c.nomeRazao, c.cnpj || c.cpf, c.regimeTributario, c.celular]);
      } else if (SelectedReport === 'certificados') {
        headers = ['Cliente', 'CNPJ/CPF', 'Vencimento'];
        rows = [...(AppState.clientesContabeis || []), ...(AppState.clientesGerais || [])].filter((c) => c.certificadoVencimento).map((c) => [c.nomeRazao, c.cnpj || c.cpf, formatDateBR(c.certificadoVencimento)]);
      } else if (SelectedReport === 'pmi') {
        headers = ['Data', 'Secretaria', 'Serviço', 'Valor', 'Status'];
        rows = (AppState.servicosPmi || []).map((p) => [formatDateBR(p.data), p.secretaria, p.servico, formatCurrency(p.valor), p.status]);
      } else if (SelectedReport === 'os') {
        headers = ['OS', 'Data', 'Cliente', 'Equipamento', 'Valor', 'Status'];
        rows = (AppState.ordensServico || []).map((o) => [o.id, formatDateBR(o.data), o.clienteNome, o.equipamento, formatCurrency(o.valor), o.status]);
      } else if (SelectedReport === 'tarefas') {
        headers = ['Tarefa', 'Área', 'Prioridade', 'Prazo', 'Status'];
        rows = (AppState.tarefas || []).map((t) => [t.titulo, t.area, t.prioridade, formatDateBR(t.prazo), t.status]);
      } else {
        headers = ['Data', 'Atividade', 'Status'];
        rows = (AppState.atividadesEstudo || []).map((a) => [formatDateBR(a.data), a.titulo, a.status]);
      }

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">Central de Relatórios</h2>
            <p class="text-xs sm:text-sm text-slate-600">Prévia consolidada, exportação CSV e impressão em PDF.</p>
          </div>
          <div class="flex gap-2 text-xs">
            <button type="button" onclick='downloadCSV("relatorio_${SelectedReport}.csv", ${JSON.stringify(headers)}, ${JSON.stringify(rows)})' class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold cursor-pointer">Exportar CSV</button>
            <button type="button" onclick="printCurrentReport()" class="px-3.5 py-2 rounded-xl bg-navy-900 text-white font-bold cursor-pointer">Imprimir / PDF</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 border shadow-sm text-xs">
          <label class="font-bold block mb-1">Selecione o Tipo de Relatório</label>
          <select onchange="SelectedReport = this.value; renderRoute('relatorios');" class="w-full sm:w-96 px-3 py-2 rounded-xl border bg-white">
            ${REPORT_TYPES.map((r) => `<option value="${r.id}" ${SelectedReport === r.id ? 'selected' : ''}>${r.label}</option>`).join('')}
          </select>
        </div>

        <div id="report-preview-box" class="bg-white rounded-2xl border shadow-sm overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-navy-900 text-white uppercase text-[11px]">
              <tr>${headers.map((h) => `<th class="px-4 py-3">${escapeHTML(h)}</th>`).join('')}</tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${rows.length === 0 ? `<tr><td colspan="${headers.length}" class="px-4 py-6 text-center text-slate-400">Sem registros para este relatório.</td></tr>` : rows.map((r) => `<tr>${r.map((cell) => `<td class="px-4 py-2.5">${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function printCurrentReport() {
      const box = document.getElementById('report-preview-box');
      const area = document.getElementById('print-area');
      if (!box || !area) return;
      area.innerHTML = `<div class="space-y-4"><div class="flex items-center justify-between border-b pb-3">${getContechLogoSVG(true)}<div class="text-xs font-bold">Relatório Gerencial • ${formatDateBR(new Date().toISOString().slice(0, 10))}</div></div>${box.innerHTML}</div>`;
      window.print();
    }

    // Inicialização
    syncAuthScreen();
  </script>
</body>
</html>
