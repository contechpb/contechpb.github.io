    function generateId(prefix = 'ID') {
      return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.floor(100 + Math.random() * 900)}`;
    }

    function addDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function addMonthsISO(isoDate, monthsToAdd) {
      const [y, m, d] = (isoDate || new Date().toISOString().slice(0, 10)).split('-').map(Number);
      const dt = new Date(y, m - 1 + monthsToAdd, d);
      return dt.toISOString().slice(0, 10);
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDateBR(iso) {
      if (!iso) return '—';
      const parts = String(iso).slice(0, 10).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : iso;
    }

    function daysUntil(iso) {
      if (!iso) return null;
      const target = new Date(`${String(iso).slice(0, 10)}T00:00:00`);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    function showToast(msg, type = 'success') {
      const box = document.getElementById('toast-container');
      if (!box) return;
      const el = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-600' : 'bg-navy-900';
      el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 pointer-events-auto`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function openModal(title, bodyHTML, footerHTML = '') {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHTML;
      document.getElementById('modal-footer').innerHTML =
        footerHTML || `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-navy-900 text-white text-xs font-bold cursor-pointer">Fechar</button>`;
      document.getElementById('modal-backdrop').classList.remove('hidden');

    function downloadCSV(filename, headers, rows) {
      const csv = [headers, ...rows]
        .map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'))
        .join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function getActiveSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;

    function syncAuthScreen() {
      const loginLogo = document.getElementById('login-logo-box');
      if (loginLogo && !loginLogo.innerHTML) loginLogo.innerHTML = getContechLogoSVG(false);
      const sideLogo = document.getElementById('sidebar-logo-box');
      if (sideLogo && !sideLogo.innerHTML) sideLogo.innerHTML = getContechLogoSVG(true);

      const session = getActiveSession();
      const authEl = document.getElementById('auth-screen');
      const shellEl = document.getElementById('app-shell');

      if (!session) {
        authEl.classList.remove('hidden');
        shellEl.classList.add('hidden');
        return;
      }

      authEl.classList.add('hidden');
      shellEl.classList.remove('hidden');
      document.getElementById('current-user-name').textContent = session.name || session.username;
      document.getElementById('current-user-role').textContent = session.role || 'Operador';
      renderSidebar();
      renderRoute(ActiveRoute);
      initInstantBidirectionalSync();
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const errBox = document.getElementById('login-error');

      const found = (AppState.users || []).find((u) => u.username === username && u.password === password);
      if (!found) {
        errBox.textContent = 'Usuário ou senha inválidos.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      const sessionData = JSON.stringify({ id: found.id, username: found.username, name: found.name, role: found.role });
      if (remember) {
        localStorage.setItem(SESSION_KEY, sessionData);
        sessionStorage.removeItem(SESSION_KEY);
      } else {
        sessionStorage.setItem(SESSION_KEY, sessionData);
        localStorage.removeItem(SESSION_KEY);
      }
      syncAuthScreen();
    });

    function logoutUser() {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      syncAuthScreen();
    }

          defeito: String(o.Defeito_Relatado || ''),
          servicoExecutado: String(o.Servico_Executado || ''),
          valor: Number(o.Valor || 0),
          status: String(o.Status || 'Aberta')
        }));
      }

      if (Array.isArray(cloudData.usuarios) && cloudData.usuarios.length > 0) {
        AppState.users = cloudData.usuarios.map((u) => ({
          id: String(u.ID || generateId('USR')),
          username: String(u.Usuario || ''),
          name: String(u.Nome_Completo || ''),
          password: String(u.Senha_Hash || ''),
          role: String(u.Perfil || 'Operador')
        }));
      }

      if (cloudVersion) AppState.config.cloudVersion = String(cloudVersion);
      AppState.config.lastSyncAt = new Date().toLocaleTimeString('pt-BR');
      AppState.config.lastSyncMessage = 'Sincronizado bidirecionalmente com Google Sheets';
      saveState(true);
    }

    function scheduleInstantPush() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url || AppState.config?.instantSync === false) return;
      updateSyncIndicator('syncing', 'Enviando alterações...');
      if (instantPushTimer) clearTimeout(instantPushTimer);
      instantPushTimer = setTimeout(() => {
        syncAllToGas(true);
      }, 450);
    }

    async function pullFromGas(silent = false) {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        if (!silent) showToast('Configure a URL /exec antes de puxar da nuvem.', 'warning');
        return;
      }
      if (isSyncBusy) return;
      isSyncBusy = true;
      updateSyncIndicator('syncing', 'Puxando da planilha...');
      try {
        const res = await fetch(`${url}?action=readAll&_t=${Date.now()}`);
        const json = await res.json();
        if (json.success && json.data) {
          applyCloudPayloadToState(json.data, json.version);
          updateSyncIndicator('online', `Sheets Ao Vivo • ${AppState.config.lastSyncAt}`);
          if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA' && document.activeElement?.tagName !== 'SELECT') {
            renderRoute(ActiveRoute);
          }
          if (!silent) showToast('Dados atualizados a partir do Google Sheets!');
        } else {
          updateSyncIndicator('error', 'Erro na leitura');
          if (!silent) showToast(json.error || 'Erro ao puxar dados.', 'error');
        }
      } catch (e) {
        updateSyncIndicator('error', 'Offline / Erro CORS');
        if (!silent) showToast('Falha de conexão com o Google Sheets.', 'error');
      } finally {
        isSyncBusy = false;
        if (pendingPushAfterSync) {
          pendingPushAfterSync = false;
          syncAllToGas(true);
        }
      }
    }

    async function checkCloudDeltaAndPull() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url || AppState.config?.instantSync === false || isSyncBusy || instantPushTimer) return;
      try {
        const res = await fetch(`${url}?action=version&_t=${Date.now()}`);
        const json = await res.json();
        if (json.success && json.version && String(json.version) !== String(AppState.config.cloudVersion || '0')) {
          await pullFromGas(true);
          showToast('Atualização recebida do Google Sheets!');
        } else if (json.success) {
          updateSyncIndicator('online', `Sheets Ao Vivo${AppState.config.lastSyncAt ? ' • ' + AppState.config.lastSyncAt : ''}`);
        }
      } catch (e) {
        // Silencioso no polling em segundo plano
      }
    }

    async function testGasConnection() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        showToast('Informe a URL /exec do Google Apps Script.', 'warning');
        return;
      }
      updateSyncIndicator('syncing', 'Testando conexão...');
      try {
        const res = await fetch(`${url}?action=test&_t=${Date.now()}`);
        const json = await res.json();
        if (json.success) {
          AppState.config.lastSyncMessage = `Conectado: ${json.spreadsheet || 'Planilha CONTECH'}`;
          saveState(true);
          updateSyncIndicator('online', 'Sheets Conectado');
          renderRoute('administracao');
          showToast('Conexão com Google Sheets validada!');
        } else {
          updateSyncIndicator('error', 'Erro no Script');
          showToast(json.error || 'Falha na resposta do script.', 'error');
        }
      } catch (e) {
        updateSyncIndicator('error', 'Falha de Rede');
        showToast('Erro de rede ao conectar com o Apps Script.', 'error');
      }
    }

    async function syncAllToGas(silent = false) {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        if (!silent) showToast('Configure a URL /exec antes de sincronizar.', 'warning');
        return;
      }
      if (instantPushTimer) {
        clearTimeout(instantPushTimer);
        instantPushTimer = null;
      }
      if (isSyncBusy) {
        pendingPushAfterSync = true;
        return;
      }
      isSyncBusy = true;
      updateSyncIndicator('syncing', 'Sincronizando...');
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'syncAll', data: mapStateToSheetPayload() })
        });
        const json = await res.json();
        if (json.success) {
          if (json.version) AppState.config.cloudVersion = String(json.version);
          AppState.config.lastSyncAt = new Date().toLocaleTimeString('pt-BR');
          AppState.config.lastSyncMessage = json.message || 'Sincronizado instantaneamente.';
          saveState(true);
          updateSyncIndicator('online', `Sheets Ao Vivo • ${AppState.config.lastSyncAt}`);
          if (ActiveRoute === 'administracao') renderRoute('administracao');
          if (!silent) showToast('Todas as abas enviadas para o Google Sheets!');
        } else {
          updateSyncIndicator('error', 'Falha ao enviar');
          if (!silent) showToast(json.error || 'Erro ao enviar dados.', 'error');
        }
      } catch (e) {
        updateSyncIndicator('error', 'Offline / Erro');
        if (!silent) showToast('Falha ao enviar dados para o Google Apps Script.', 'error');
      } finally {
        isSyncBusy = false;
        if (pendingPushAfterSync) {
          pendingPushAfterSync = false;
          syncAllToGas(true);
        }
      }
    }

    async function triggerInstantBidirectionalSync() {
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        navigateTo('administracao');
        showToast('Cole a URL /exec do Google Apps Script para ativar o Sync.', 'warning');
        return;
      }
      await syncAllToGas(false);
    }

    function initInstantBidirectionalSync() {
      if (cloudPollTimer) clearInterval(cloudPollTimer);
      const url = AppState.config?.gasUrl?.trim();
      if (!url) {
        updateSyncIndicator('offline', 'Sync Local');
        return;
      }
      updateSyncIndicator('online', 'Sheets Ao Vivo');
      if (AppState.config?.instantSync !== false) {
        checkCloudDeltaAndPull();
        const intervalMs = Math.max(3, Number(AppState.config?.pollSeconds || 5)) * 1000;
        cloudPollTimer = setInterval(checkCloudDeltaAndPull, intervalMs);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && AppState.config?.gasUrl && AppState.config?.instantSync !== false) {
        checkCloudDeltaAndPull();
      }
    });

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(AppState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_contech_erp_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackupJSON(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          AppState = { ...createInitialState(), ...parsed };
          saveState();
          renderRoute('administracao');
          showToast('Backup JSON restaurado com sucesso!');
        } catch (err) {
          showToast('Arquivo JSON inválido.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function openLgpdModal() {
      openModal(
        'Governança de Dados e Conformidade LGPD (Lei nº 13.709/2018)',
        `
          <div class="space-y-3 text-xs text-slate-700 leading-relaxed">
            <p><strong>1. Controlador e Finalidade:</strong> Os dados cadastrais, fiscais e credenciais armazenados no CONTECH ERP destinam-se exclusivamente ao cumprimento de obrigações legais, contábeis, fiscais e de suporte técnico contratadas junto à CONTECH Contabilidade &amp; Informática.</p>
            <p><strong>2. Armazenamento e Criptografia em Trânsito:</strong> Os registros operam localmente no navegador do operador autorizado e são transmitidos via HTTPS (TLS) exclusivamente para a planilha institucional configurada no Google Workspace.</p>
            <p><strong>3. Boas Práticas de Segurança:</strong> Recomenda-se o bloqueio de tela ao ausentar-se da estação, troca periódica das senhas de acesso e guarda segura dos backups exportados.</p>
          </div>
        `
      );
    }

    function renderAdministracao(container) {
      const cfg = AppState.config || {};
      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-navy-900">Administração, Usuários &amp; Google Sheets</h2>
            <p class="text-xs sm:text-sm text-slate-600">Gestão de operadores, backup JSON, conformidade LGPD e sincronização com Google Apps Script.</p>
          </div>
          <button type="button" onclick="openLgpdModal()" class="px-3.5 py-2 rounded-xl bg-navy-900 text-white text-xs font-bold cursor-pointer">Diretrizes LGPD</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl p-5 border shadow-sm space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-navy-900">Sincronização Bidirecional Instantânea</h3>
              <label class="inline-flex items-center gap-2 text-xs font-bold text-emerald-700 cursor-pointer">
                <input type="checkbox" ${cfg.instantSync !== false ? 'checked' : ''} onchange="AppState.config.instantSync = this.checked; saveState(true); initInstantBidirectionalSync();" class="rounded" />
                <span>Ativa em Tempo Real</span>
              </label>
            </div>
            <div class="space-y-2 text-xs">
              <label class="font-semibold block">URL do Web App (/exec)</label>
              <input type="url" value="${escapeHTML(cfg.gasUrl || '')}" onchange="AppState.config.gasUrl = this.value.trim(); saveState(true); initInstantBidirectionalSync();" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 rounded-xl border" />
              <div class="flex items-center justify-between gap-2 pt-1">
                <span class="text-[11px] text-slate-500">${escapeHTML(cfg.lastSyncMessage || '')} ${cfg.lastSyncAt ? `(${cfg.lastSyncAt})` : ''}</span>
                <label class="inline-flex items-center gap-1 text-[11px] text-slate-600 shrink-0">
                  <span>Checar a cada</span>
                  <input type="number" min="3" max="60" value="${Number(cfg.pollSeconds || 5)}" onchange="AppState.config.pollSeconds = Math.max(3, Number(this.value || 5)); saveState(true); initInstantBidirectionalSync();" class="w-12 px-1.5 py-0.5 rounded border text-center" />
                  <span>seg</span>
                </label>
              </div>
            </div>
            <div class="flex flex-wrap gap-2 text-xs">
              <button type="button" onclick="testGasConnection()" class="px-3.5 py-2 rounded-xl bg-navy-800 text-white font-bold cursor-pointer">Testar Conexão</button>
              <button type="button" onclick="pullFromGas(false)" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold cursor-pointer">Puxar da Nuvem Agora</button>
              <button type="button" onclick="syncAllToGas(false)" class="px-4 py-2 rounded-xl bg-accent-500 text-white font-bold cursor-pointer">Enviar Tudo para Planilha</button>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-5 border shadow-sm space-y-4">
            <h3 class="text-sm font-extrabold text-navy-900">Backup &amp; Restauração de Dados</h3>
            <p class="text-xs text-slate-600">Exporte uma cópia integral em JSON ou restaure um arquivo anterior.</p>
            <div class="flex flex-wrap gap-2 text-xs">
              <button type="button" onclick="exportBackupJSON()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold cursor-pointer">Exportar Backup JSON</button>
              <label class="px-4 py-2 rounded-xl bg-slate-200 text-slate-800 font-bold cursor-pointer">
                Restaurar JSON
                <input type="file" accept=".json" onchange="importBackupJSON(this.files[0])" class="hidden" />
              </label>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-5 border shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-navy-900">Usuários Autorizados (${(AppState.users || []).length})</h3>
            <button type="button" onclick="openUserModal()" class="px-3.5 py-1.5 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">+ Novo Usuário</button>
          </div>
          <div class="divide-y divide-slate-100 text-xs">
            ${(AppState.users || []).map((u) => `
              <div class="py-2.5 flex items-center justify-between gap-2">
                <div><strong>${escapeHTML(u.name)}</strong> (<span class="font-mono">${escapeHTML(u.username)}</span>) • ${escapeHTML(u.role)}</div>
                <div class="space-x-1">
                  <button type="button" onclick="openUserModal('${u.id}')" class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 font-semibold cursor-pointer">Alterar Senha</button>
                  ${u.username !== 'admin' ? `<button type="button" onclick="AppState.users = AppState.users.filter(x => x.id !== '${u.id}'); saveState(); renderRoute('administracao');" class="px-2.5 py-1 rounded-lg bg-red-100 text-red-700 font-semibold cursor-pointer">Remover</button>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openUserModal(editId = null) {
      const item = editId ? (AppState.users || []).find((x) => x.id === editId) : null;
      const u = item || { name: '', username: '', password: '', role: 'Operador' };
      openModal(
        item ? 'Editar Usuário' : 'Novo Usuário',
        `<form id="user-form" class="space-y-3 text-xs">
          <div><label class="font-semibold">Nome Completo *</label><input name="name" required value="${escapeHTML(u.name)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Login *</label><input name="username" required value="${escapeHTML(u.username)}" ${item?.username === 'admin' ? 'readonly' : ''} class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Senha *</label><input type="password" name="password" required value="${escapeHTML(u.password)}" class="w-full mt-1 px-3 py-2 rounded-xl border" /></div>
          <div><label class="font-semibold">Perfil</label><select name="role" class="w-full mt-1 px-3 py-2 rounded-xl border bg-white"><option ${u.role === 'Administrador' ? 'selected' : ''}>Administrador</option><option ${u.role === 'Operador' ? 'selected' : ''}>Operador</option></select></div>
        </form>`,
        `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold cursor-pointer">Cancelar</button>
         <button type="submit" form="user-form" class="px-4 py-2 rounded-xl bg-accent-500 text-white text-xs font-bold cursor-pointer">Salvar</button>`
      );
      document.getElementById('user-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const rec = { id: item ? item.id : generateId('USR'), name: fd.get('name').trim(), username: fd.get('username').trim(), password: fd.get('password'), role: fd.get('role') };
        if (item) {
          const idx = AppState.users.findIndex((x) => x.id === item.id);
          if (idx >= 0) AppState.users[idx] = rec;
        } else {
          AppState.users.push(rec);
        }
        saveState();
        closeModal();
        renderRoute('administracao');
        showToast('Usuário salvo!');
      };
    }

    // Inicialização
    syncAuthScreen();
  </script>
</body>
</html>
